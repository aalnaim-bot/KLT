<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowliom · Time & Load Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --kn-blue:#0d0089;
  --kn-blue-soft:#1a1099;
  --kn-blue-tint:#e8e7f5;
  --kn-warm:#fbf0e3;
  --kn-warm-soft:#fdf7ed;
  --kn-mint:#b8f4bd;
  --kn-mint-soft:#dcf9df;
  --kn-yellow:#ffd84d;
  --kn-yellow-soft:#fff5cc;
  --kn-white:#ffffff;
  --kn-bg:#f5f0e6;
  --kn-text:#282828;
  --kn-text-soft:#5a5a5a;
  --kn-text-faint:#9a9a9a;
  --kn-border:#e6dfd2;
  --kn-border-strong:#d4cab8;
  --kn-red:#c8302d;
  --kn-red-soft:#fbe5e4;
  --kn-amber:#d4881a;
  --kn-amber-soft:#fbeed4;
  --kn-green:#2d7a3a;
  --shadow-sm:0 1px 2px rgba(13,0,137,0.04);
  --shadow:0 4px 16px rgba(13,0,137,0.06);
  --shadow-lg:0 12px 40px rgba(13,0,137,0.12);
  --r-sm:6px;--r:10px;--r-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--kn-bg);color:var(--kn-text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'ss01','cv01'}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:-0.01em}
.serif{font-family:'Fraunces',serif;font-weight:400;letter-spacing:-0.02em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{outline:none}

#app{display:grid;grid-template-columns:240px 1fr;height:100vh;width:100vw}
.sidebar{background:var(--kn-blue);color:var(--kn-warm);display:flex;flex-direction:column;padding:24px 0;position:relative;overflow:hidden}
.sidebar::before{content:'';position:absolute;top:-50%;right:-30%;width:200%;height:60%;background:radial-gradient(ellipse,rgba(184,244,189,0.08),transparent 60%);pointer-events:none}
.brand{padding:0 24px 28px;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.brand-mark{width:34px;height:34px;background:var(--kn-warm);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--kn-blue);font-weight:700;font-size:18px;font-family:'Fraunces',serif}
.brand-name{font-weight:500;letter-spacing:-0.01em;font-size:15px}
.brand-name small{display:block;font-size:10px;opacity:0.6;font-weight:400;letter-spacing:0.08em;text-transform:uppercase;margin-top:2px}
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;color:var(--kn-warm);opacity:0.7;font-size:13px;font-weight:400;cursor:pointer;transition:all 0.15s;letter-spacing:-0.005em}
.nav-item:hover{background:rgba(255,255,255,0.06);opacity:1}
.nav-item.active{background:var(--kn-warm);color:var(--kn-blue);opacity:1;font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:0.12em;opacity:0.4;padding:18px 14px 6px;font-weight:500}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;opacity:0.6;position:relative;z-index:1}
.save-status{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--kn-mint);animation:pulse 2s infinite}
.save-dot.saving{background:var(--kn-amber)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

.main{display:flex;flex-direction:column;overflow:hidden;background:var(--kn-bg)}
.topbar{height:64px;background:var(--kn-warm-soft);border-bottom:1px solid var(--kn-border);display:flex;align-items:center;padding:0 28px;gap:20px;flex-shrink:0}
.page-title{font-size:20px;font-weight:500;letter-spacing:-0.02em;font-family:'Fraunces',serif}
.topbar-spacer{flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
.undo-btns{display:flex;gap:2px;margin-right:8px}
.undo-btns button{padding:7px;border-radius:var(--r-sm);color:var(--kn-text-soft);transition:all 0.1s}
.undo-btns button:hover:not(:disabled){background:var(--kn-warm);color:var(--kn-blue)}
.undo-btns button:disabled{opacity:0.3;cursor:not-allowed}
.undo-btns button svg{width:15px;height:15px}

.btn{padding:8px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;letter-spacing:-0.005em;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s}
.btn-primary{background:var(--kn-blue);color:var(--kn-warm)}
.btn-primary:hover{background:var(--kn-blue-soft);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn-secondary{background:var(--kn-white);color:var(--kn-blue);border:1px solid var(--kn-border)}
.btn-secondary:hover{background:var(--kn-warm);border-color:var(--kn-blue)}
.btn-ghost{color:var(--kn-text-soft)}
.btn-ghost:hover{background:rgba(13,0,137,0.05);color:var(--kn-blue)}
.btn-danger{background:var(--kn-red-soft);color:var(--kn-red)}
.btn-danger:hover{background:var(--kn-red);color:white}
.btn svg{width:14px;height:14px}
.btn-icon{padding:8px;width:34px;height:34px;justify-content:center}
.btn.active{background:var(--kn-blue);color:var(--kn-warm)}

.content{flex:1;overflow-y:auto;padding:28px}
.content::-webkit-scrollbar{width:10px;height:10px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--kn-border-strong);border-radius:5px}
.content::-webkit-scrollbar-thumb:hover{background:var(--kn-text-faint)}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:24px}
.stat-card{background:var(--kn-white);border:1px solid var(--kn-border);border-radius:var(--r-lg);padding:22px 24px;position:relative;overflow:hidden;transition:all 0.2s}
.stat-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--kn-text-soft);font-weight:500;margin-bottom:12px}
.stat-value{font-size:36px;font-weight:400;letter-spacing:-0.03em;color:var(--kn-blue);font-family:'Fraunces',serif;line-height:1}
.stat-value .unit{font-size:16px;color:var(--kn-text-soft);margin-left:4px;font-family:'IBM Plex Sans',sans-serif}
.stat-meta{font-size:12px;color:var(--kn-text-soft);margin-top:8px}

.month-picker{display:flex;align-items:center;gap:6px;background:var(--kn-white);border:1px solid var(--kn-border);border-radius:var(--r-sm);padding:3px}
.month-picker button{padding:6px 8px;border-radius:4px;color:var(--kn-text-soft)}
.month-picker button:hover{background:var(--kn-warm);color:var(--kn-blue)}
.month-picker .month-label{padding:0 12px;font-weight:500;font-size:13px;cursor:pointer;letter-spacing:-0.01em;min-width:130px;text-align:center}
.month-picker .month-label:hover{color:var(--kn-blue)}

.dash-section{background:var(--kn-white);border:1px solid var(--kn-border);border-radius:var(--r-lg);padding:24px;margin-bottom:20px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.section-title{font-size:15px;font-weight:500;letter-spacing:-0.01em}
.section-sub{font-size:12px;color:var(--kn-text-soft);margin-top:2px}

.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.emp-card{background:var(--kn-warm-soft);border:1px solid var(--kn-border);border-radius:var(--r);padding:16px;transition:all 0.15s;cursor:pointer}
.emp-card:hover{border-color:var(--kn-blue);box-shadow:var(--shadow-sm)}
.emp-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.emp-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:white;font-size:13px;letter-spacing:-0.02em;flex-shrink:0}
.emp-name{font-weight:500;font-size:14px;letter-spacing:-0.01em}
.emp-role{font-size:11px;color:var(--kn-text-soft);text-transform:uppercase;letter-spacing:0.06em}
.load-bar{height:8px;background:var(--kn-border);border-radius:4px;overflow:hidden;position:relative;margin-top:10px}
.load-bar-fill{height:100%;border-radius:4px;transition:width 0.3s}
.load-bar-fill.green{background:var(--kn-green)}
.load-bar-fill.amber{background:var(--kn-amber)}
.load-bar-fill.red{background:var(--kn-red)}
.load-stats{display:flex;justify-content:space-between;font-size:11px;color:var(--kn-text-soft);margin-top:6px}
.load-stats .v{font-family:'IBM Plex Mono',monospace;color:var(--kn-text);font-weight:500}

.proj-rank{display:flex;flex-direction:column;gap:10px}
.proj-rank-item{display:grid;grid-template-columns:24px 8px 1fr auto;align-items:center;gap:14px;padding:12px 16px;background:var(--kn-warm-soft);border:1px solid var(--kn-border);border-radius:var(--r)}
.proj-rank-num{font-family:'Fraunces',serif;font-size:22px;color:var(--kn-blue);opacity:0.4}
.proj-rank-color{width:8px;height:32px;border-radius:2px}
.proj-rank-info .code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--kn-text-soft);font-weight:500}
.proj-rank-info .name{font-weight:500;letter-spacing:-0.01em;margin-top:2px}
.proj-rank-load{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;padding:4px 10px;border-radius:4px;background:var(--kn-blue);color:var(--kn-warm)}

.heatmap-wrap{margin-top:8px}
.heatmap{display:grid;gap:3px;align-items:center}
.heatmap-label{font-size:12px;color:var(--kn-text-soft);font-weight:500;padding-right:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heatmap-cell{aspect-ratio:1;border-radius:3px;background:var(--kn-warm-soft);border:1px solid var(--kn-border);position:relative;cursor:pointer;transition:transform 0.1s}
.heatmap-cell:hover{transform:scale(1.4);z-index:2;box-shadow:var(--shadow)}
.heatmap-cell.weekend{background:transparent;border:1px dashed var(--kn-border)}
.heatmap-cell.holiday{background:var(--kn-yellow);border-color:#e8c233}
.heatmap-cell.l1{background:#dcf9df;border-color:#b8f4bd}
.heatmap-cell.l2{background:#9ae6a3;border-color:#7dd687}
.heatmap-cell.l3{background:#fff2b3;border-color:#ffe580}
.heatmap-cell.l4{background:#ffd84d;border-color:#e8c233}
.heatmap-cell.l5{background:#f0a83a;border-color:#d68d24}
.heatmap-cell.l6{background:#e5781c;border-color:#c5640f}
.heatmap-cell.over{background:var(--kn-red);border-color:var(--kn-red)}
.heatmap-cell.leave{background:#b8d4e8;border-color:#8db9d8}
.heatmap-cell.remote{background:#e8c79a;border-color:#c8a876}
.heatmap-legend{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:11px;color:var(--kn-text-soft);flex-wrap:wrap}
.legend-swatches{display:flex;gap:2px}
.legend-swatch{width:14px;height:14px;border-radius:3px;border:1px solid var(--kn-border)}
.legend-item{display:flex;align-items:center;gap:5px}

/* Calendar */
.cal-toolbar{background:var(--kn-white);border:1px solid var(--kn-border);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cal-month-label{font-size:18px;font-weight:500;letter-spacing:-0.02em;font-family:'Fraunces',serif;min-width:170px;cursor:pointer;padding:4px 10px;border-radius:6px}
.cal-month-label:hover{background:var(--kn-warm)}
.cal-nav{display:flex;align-items:center;gap:4px;background:var(--kn-warm);border:1px solid var(--kn-border);border-radius:var(--r-sm);padding:3px}
.cal-nav-btn{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;border-radius:4px;font-size:12px;font-weight:500;color:var(--kn-text);transition:all 0.15s;cursor:pointer;background:transparent;border:none;min-width:30px;height:28px}
.cal-nav-btn svg{width:14px;height:14px}
.cal-nav-btn:hover{background:var(--kn-blue-tint);color:var(--kn-blue)}
.cal-nav-btn:active{transform:scale(0.95)}
.cal-nav-today{padding:6px 12px;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600;color:var(--kn-text-soft)}
.cal-nav-today:hover{color:var(--kn-blue)}
.view-toggle{display:flex;background:var(--kn-warm);border-radius:var(--r-sm);padding:3px;border:1px solid var(--kn-border)}
.view-toggle button{padding:6px 14px;border-radius:4px;font-size:12px;font-weight:500;color:var(--kn-text-soft);transition:all 0.15s}
.view-toggle button.active{background:var(--kn-white);color:var(--kn-blue);box-shadow:var(--shadow-sm)}
.emp-select{padding:7px 12px;background:var(--kn-warm);border:1px solid var(--kn-border);border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--kn-blue);cursor:pointer}

.cal-day.range-selected{background:var(--kn-mint-soft) !important;outline:2px dashed var(--kn-green);outline-offset:-2px;z-index:1}
.cal-week-day.range-selected{background:var(--kn-mint-soft) !important;outline:2px dashed var(--kn-green);outline-offset:-2px}
body.range-selecting{cursor:crosshair}
body.range-selecting .cal-day,body.range-selecting .cal-week-day{user-select:none}

.cal-month{background:var(--kn-white);border:1px solid var(--kn-border);border-radius:var(--r-lg);overflow:hidden}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--kn-warm-soft);border-bottom:1px solid var(--kn-border)}
.cal-weekday{padding:10px 12px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--kn-text-soft);text-align:left}
.cal-weekday.weekend{color:var(--kn-text-faint)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(120px,1fr)}
.cal-day{border-right:1px solid var(--kn-border);border-bottom:1px solid var(--kn-border);padding:6px 8px;position:relative;cursor:pointer;transition:background 0.1s;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.cal-day:hover{background:var(--kn-warm-soft)}
.cal-day.other-month{background:#fafaf5;opacity:0.45}
.cal-day.weekend{background:repeating-linear-gradient(135deg,transparent,transparent 6px,rgba(13,0,137,0.025) 6px,rgba(13,0,137,0.025) 7px)}
.cal-day.today .cal-day-num{background:var(--kn-blue);color:var(--kn-warm);border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.cal-day.holiday{background:var(--kn-yellow-soft);background:linear-gradient(135deg,var(--kn-yellow-soft) 0%,#fff5cc 100%)}
.cal-day.holiday .holiday-name{font-size:9px;font-weight:600;color:#7a5c00;text-transform:uppercase;letter-spacing:0.04em;background:var(--kn-yellow);padding:1px 4px;border-radius:2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cal-day.drop-target{background:var(--kn-mint-soft);outline:2px dashed var(--kn-blue);outline-offset:-3px}
.cal-day.selected{outline:2px solid var(--kn-blue);outline-offset:-2px;background:var(--kn-blue-tint)}
.cal-day.leave-marking{background:var(--kn-mint);cursor:crosshair}
.cal-day-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:4px;flex-shrink:0;gap:4px}
.cal-day-num{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--kn-text-soft)}
.cal-day.weekend .cal-day-num{color:var(--kn-text-faint)}
.cal-day-load{font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:600;padding:1px 5px;border-radius:3px}
.cal-day-load.green{background:var(--kn-mint-soft);color:var(--kn-green)}
.cal-day-load.amber{background:var(--kn-amber-soft);color:var(--kn-amber)}
.cal-day-load.red{background:var(--kn-red-soft);color:var(--kn-red)}
.cal-day.weekend-work{background:repeating-linear-gradient(135deg,var(--kn-amber-soft),var(--kn-amber-soft) 6px,#f7e3b8 6px,#f7e3b8 7px)}
.weekend-work-icon{width:13px;height:13px;color:var(--kn-amber);flex-shrink:0}
.weekend-work-icon svg{width:100%;height:100%}
.ot-badge{display:inline-flex;align-items:center;gap:4px;background:var(--kn-amber-soft);color:var(--kn-amber);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;cursor:pointer;transition:all 0.1s}
.ot-badge:hover{background:var(--kn-amber);color:white}
.ot-badge svg{width:11px;height:11px}
.emp-name-clickable{cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:2px;transition:text-decoration-color 0.15s}
.emp-name-clickable:hover{text-decoration-color:var(--kn-blue)}
.ot-detail-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;padding:11px 14px;border-bottom:1px solid var(--kn-border);align-items:center;font-size:13px}
.ot-detail-row:last-child{border-bottom:none}
.ot-type-badge{font-size:10px;padding:2px 8px;border-radius:3px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.ot-type-weekend{background:var(--kn-amber-soft);color:var(--kn-amber)}
.ot-type-overflow{background:var(--kn-red-soft);color:var(--kn-red)}
.cal-day-pills{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow:hidden}
.cal-pill{font-size:10.5px;padding:2px 5px;border-radius:3px;font-weight:500;letter-spacing:-0.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;border-left:3px solid;background:rgba(255,255,255,0.85);display:flex;align-items:center;gap:4px;flex-shrink:0;transition:all 0.1s}
.cal-pill:hover{background:white;box-shadow:var(--shadow-sm)}
.cal-pill:active{cursor:grabbing}
.cal-pill.dragging{opacity:0.4}
.cal-pill.selected{outline:2px solid var(--kn-blue);background:var(--kn-blue-tint)}
.cal-pill .h{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--kn-text-soft);font-weight:600;flex-shrink:0}
.cal-pill .emp-badge{width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:white;flex-shrink:0;letter-spacing:-0.02em}
.cal-pill .code{flex:1;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cal-pill.leave{background:var(--kn-mint-soft);border-color:var(--kn-green);color:var(--kn-green)}
.cal-pill.weight-2{box-shadow:inset 0 0 0 1.5px var(--kn-red)}
.cal-pill.weight-1{box-shadow:inset 0 0 0 1px var(--kn-amber)}
.cal-pill.weightm1{opacity:0.85}
.cal-pill.weightm2{opacity:0.7}
.cal-day-more{font-size:10px;color:var(--kn-text-soft);padding:1px 4px}

.cal-week{background:var(--kn-white);border:1px solid var(--kn-border);border-radius:var(--r-lg);overflow:hidden}
.cal-week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-week-day{border-right:1px solid var(--kn-border);min-height:480px;padding:14px;cursor:pointer;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.cal-week-day:last-child{border-right:none}
.cal-week-day.weekend{background:repeating-linear-gradient(135deg,transparent,transparent 8px,rgba(13,0,137,0.02) 8px,rgba(13,0,137,0.02) 9px)}
.cal-week-day.today .day-date{color:var(--kn-blue)}
.cal-week-day.holiday{background:var(--kn-yellow-soft)}
.cal-week-day.drop-target{background:var(--kn-mint-soft);outline:2px dashed var(--kn-blue);outline-offset:-2px}
.cal-week-day.selected{outline:2px solid var(--kn-blue);outline-offset:-2px}
.day-name{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--kn-text-soft);font-weight:500}
.day-date{font-size:24px;font-family:'Fraunces',serif;font-weight:400;letter-spacing:-0.02em;margin-top:2px;margin-bottom:14px}
.holiday-banner{background:var(--kn-yellow);color:#7a5c00;font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em}
.cal-week-day .cal-pill{font-size:12px;padding:5px 8px;margin-bottom:5px;border-left-width:4px}
.cal-week-day .cal-pill .name{flex:1;overflow:hidden;text-overflow:ellipsis}

.cal-day-view{background:var(--kn-white);border:1px solid var(--kn-border);border-radius:var(--r-lg);padding:28px}
.day-view-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--kn-border)}
.day-view-date{font-size:32px;font-family:'Fraunces',serif;font-weight:400;letter-spacing:-0.02em}
.day-view-sub{font-size:13px;color:var(--kn-text-soft);text-transform:uppercase;letter-spacing:0.08em;margin-top:4px}
.day-view-summary{text-align:right}
.day-view-load{font-size:28px;font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--kn-blue)}
.day-view-list{display:flex;flex-direction:column;gap:10px}
.day-list-item{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:14px;align-items:center;padding:14px 16px;background:var(--kn-warm-soft);border:1px solid var(--kn-border);border-radius:var(--r);border-left:4px solid}
.day-list-code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--kn-text-soft);font-weight:600}
.day-list-name{font-weight:500;letter-spacing:-0.01em}
.day-list-client{font-size:11px;color:var(--kn-text-soft);margin-top:2px}
.day-list-hours{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px}
.day-list-weight{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
.weight-pill-2{background:#fbdfde;color:var(--kn-red)}
.weight-pill-1{background:var(--kn-amber-soft);color:var(--kn-amber)}
.weight-pill-0{background:var(--kn-warm);color:var(--kn-text-soft)}
.weight-pill-m1{background:var(--kn-mint-soft);color:var(--kn-green)}
.weight-pill-m2{background:#dcf9df;color:var(--kn-green);opacity:0.7}
.day-list-actions{display:flex;gap:4px}

/* Lists */
.list-toolbar{background:var(--kn-white);border:1px solid var(--kn-border);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.search-input{flex:1;max-width:340px;padding:8px 14px;background:var(--kn-warm);border:1px solid var(--kn-border);border-radius:var(--r-sm);font-size:13px}
.search-input:focus{border-color:var(--kn-blue);background:white}
.filter-tabs{display:flex;background:var(--kn-warm);border-radius:var(--r-sm);padding:3px;border:1px solid var(--kn-border)}
.filter-tabs button{padding:6px 14px;border-radius:4px;font-size:12px;font-weight:500;color:var(--kn-text-soft)}
.filter-tabs button.active{background:var(--kn-white);color:var(--kn-blue);box-shadow:var(--shadow-sm)}

.data-table{background:var(--kn-white);border:1px solid var(--kn-border);border-radius:var(--r-lg);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:var(--kn-warm-soft)}
th{text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--kn-text-soft);padding:12px 16px;border-bottom:1px solid var(--kn-border)}
td{padding:13px 16px;border-bottom:1px solid var(--kn-border);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background 0.1s}
tbody tr:hover{background:var(--kn-warm-soft)}
.row-code{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--kn-blue);font-size:12px}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.row-actions button{padding:4px 8px;font-size:11px}
.bulk-bar{background:var(--kn-blue);color:var(--kn-warm);border-radius:var(--r);padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;animation:slideUp 0.2s;box-shadow:var(--shadow)}
.bulk-bar-count{font-weight:500}
.bulk-bar button{padding:6px 12px;border-radius:var(--r-sm);font-size:12px;font-weight:500;background:rgba(255,255,255,0.12);color:var(--kn-warm);transition:all 0.1s;border:1px solid transparent}
.bulk-bar button:hover{background:rgba(255,255,255,0.22)}
.bulk-bar button.danger{background:var(--kn-red);color:white}
.bulk-bar button.danger:hover{background:#a82826}
.bulk-bar button svg{width:13px;height:13px;display:inline-block;vertical-align:middle;margin-right:4px}
.row-checkbox{width:16px;height:16px;cursor:pointer;accent-color:var(--kn-blue)}
tr.row-selected{background:var(--kn-blue-tint) !important}
tr.row-selected:hover{background:#dad7ed !important}
.color-swatch{width:20px;height:20px;border-radius:4px;display:inline-block;vertical-align:middle;border:1px solid rgba(0,0,0,0.1)}
.proj-type-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:3px 8px;border-radius:3px;letter-spacing:0.04em}
.type-KN{background:var(--kn-blue-tint);color:var(--kn-blue)}
.type-PR{background:var(--kn-amber-soft);color:var(--kn-amber)}
.type-IN{background:var(--kn-mint-soft);color:var(--kn-green)}
.status-badge{font-size:11px;padding:2px 8px;border-radius:3px;font-weight:500}
.status-active{background:var(--kn-mint-soft);color:var(--kn-green)}
.status-closed{background:#eee;color:var(--kn-text-faint)}
.status-cancelled{background:#fbe5e4;color:var(--kn-red);text-decoration:line-through}

/* Remote work — darker beige than holiday yellow */
.cal-day.remote-work{background:repeating-linear-gradient(135deg,#e8c79a,#e8c79a 8px,#dcb583 8px,#dcb583 9px)}
.cal-day.remote-work .cal-day-num{color:#7a4f00}
.cal-pill.remote{background:#e8c79a;border-color:#a8742a;color:#7a4f00}
.cal-pill.remote:hover{background:#dcb583}
.remote-banner{background:#e8c79a;color:#7a4f00;font-size:11px;font-weight:600;padding:1px 4px;border-radius:2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Searchable project picker */
.proj-picker{position:relative;width:100%}
.proj-picker-trigger{width:100%;padding:9px 12px;background:var(--kn-warm-soft);border:1px solid var(--kn-border);border-radius:var(--r-sm);font-size:13px;text-align:left;display:flex;align-items:center;gap:8px;transition:all 0.15s}
.proj-picker-trigger:hover{border-color:var(--kn-blue)}
.proj-picker-trigger.open{border-color:var(--kn-blue);background:white;box-shadow:0 0 0 3px var(--kn-blue-tint)}
.proj-picker-trigger .placeholder{color:var(--kn-text-faint)}
.proj-picker-trigger .swatch{width:8px;height:18px;border-radius:2px;flex-shrink:0}
.proj-picker-trigger .text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-picker-trigger .chev{width:14px;height:14px;color:var(--kn-text-soft);flex-shrink:0}
.proj-picker-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:white;border:1px solid var(--kn-border);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:200;max-height:340px;display:flex;flex-direction:column;overflow:hidden}
.proj-picker-search{margin:8px;padding:8px 12px;background:var(--kn-warm-soft);border:1px solid var(--kn-border);border-radius:var(--r-sm);font-size:13px}
.proj-picker-search:focus{border-color:var(--kn-blue);background:white}
.proj-picker-list{overflow-y:auto;flex:1;padding:0 4px 8px}
.proj-picker-section{margin-top:6px}
.proj-picker-section-head{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;padding:6px 10px 4px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--kn-border);margin-bottom:2px}
.proj-picker-section-head.type-KN{color:var(--kn-blue);background:var(--kn-blue-tint)}
.proj-picker-section-head.type-PR{color:var(--kn-amber);background:var(--kn-amber-soft)}
.proj-picker-section-head.type-IN{color:var(--kn-green);background:var(--kn-mint-soft)}
.proj-picker-section-head.type-mine{color:white;background:var(--kn-blue)}
.proj-picker-section-head .count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:9px;background:rgba(0,0,0,0.1);padding:1px 5px;border-radius:8px}
.proj-picker-item{width:100%;padding:7px 10px;border-radius:var(--r-sm);text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12.5px;transition:background 0.1s}
.proj-picker-item:hover{background:var(--kn-warm-soft)}
.proj-picker-item.active{background:var(--kn-blue-tint)}
.proj-picker-item .swatch{width:6px;height:18px;border-radius:2px;flex-shrink:0}
.proj-picker-item .code{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--kn-blue);font-size:11px;min-width:60px;flex-shrink:0}
.proj-picker-item .client{color:var(--kn-text-soft);font-size:11px;flex-shrink:0;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-picker-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--kn-text)}
.proj-picker-empty{padding:20px;text-align:center;color:var(--kn-text-soft);font-size:12px}

/* Forecast chart */
.forecast-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.forecast-card{background:var(--kn-warm-soft);border:1px solid var(--kn-border);border-radius:var(--r);padding:16px}
.forecast-card.current{border-color:var(--kn-blue);background:var(--kn-blue-tint)}
.forecast-month{font-family:'Fraunces',serif;font-size:18px;letter-spacing:-0.02em;margin-bottom:4px}
.forecast-pct{font-size:28px;font-family:'Fraunces',serif;letter-spacing:-0.03em;color:var(--kn-blue);line-height:1}
.forecast-bar{height:6px;background:rgba(13,0,137,0.1);border-radius:3px;margin-top:10px;overflow:hidden;position:relative}
.forecast-bar-fill{height:100%;border-radius:3px}
.forecast-meta{font-size:11px;color:var(--kn-text-soft);margin-top:8px}

.signature-footer{font-size:10px;text-align:center;color:var(--kn-text-faint);padding:14px 0;font-family:'Fraunces',serif;font-style:italic;letter-spacing:0.02em}
.signature-footer:hover{color:var(--kn-blue)}

/* ============ Project Tracker ============ */
.tracker-toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--kn-white);border:1px solid var(--kn-border);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:16px}
.tracker-toolbar .filter-tabs{flex-wrap:wrap}
.tracker-table-wrap{background:var(--kn-white);border:1px solid var(--kn-border);border-radius:var(--r-lg);overflow:auto;max-height:calc(100vh - 240px)}
.tracker-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:1500px;table-layout:fixed}
.tracker-table thead th{position:sticky;top:0;background:var(--kn-warm-soft);z-index:10;padding:10px 12px;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--kn-text-soft);font-weight:600;text-align:left;border-bottom:2px solid var(--kn-border);white-space:nowrap;position:relative}
.tracker-table tbody td{padding:6px 8px;border-bottom:1px solid var(--kn-border);vertical-align:top;overflow:hidden}
.tracker-table tbody tr:hover{background:var(--kn-warm-soft)}
.tracker-table tbody tr.row-done{background:#e8f5e9}
.tracker-table tbody tr.row-done:hover{background:#dcedc8}
.tracker-table tbody tr.row-cancelled{opacity:0.6}
.tracker-table tbody tr.row-cancelled td{color:var(--kn-text-faint)}
.tracker-table.reorder-mode tbody tr:hover .row-hide-btn,
.tracker-table.reorder-mode tbody tr:hover .row-action-btn{display:flex !important}
.tracker-table tbody tr .row-hide-btn:hover{background:var(--kn-warm);color:var(--kn-red);border-color:var(--kn-red)}
.tracker-table tbody tr.dragging{background:var(--kn-white) !important;box-shadow:0 8px 24px rgba(13,0,137,0.18),0 0 0 1px var(--kn-blue);border-radius:6px;cursor:grabbing;position:relative;z-index:5;will-change:transform}
.tracker-table tbody tr.drag-shifting{will-change:transform}
.tracker-table tbody tr.row-just-moved{animation:rowFlash 1.5s ease-out}
@keyframes rowFlash{
  0%{background:var(--kn-blue-tint);box-shadow:inset 0 0 0 2px var(--kn-blue)}
  100%{background:transparent;box-shadow:none}
}
.tracker-table tbody tr.row-recently-moved{background:var(--kn-blue-tint) !important;box-shadow:inset 0 0 0 2px var(--kn-blue);position:relative}
.tracker-table tbody tr.row-recently-moved::after{content:'JUST MOVED';position:absolute;top:50%;right:8px;transform:translateY(-50%);background:var(--kn-blue);color:white;padding:2px 8px;border-radius:3px;font-size:9px;font-weight:600;letter-spacing:0.08em;pointer-events:none;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
/* Drag column — small + subtle by default, large + active only in reorder mode */
.tracker-table .cell-drag{padding:6px 4px;text-align:center;color:var(--kn-text-faint);user-select:none;vertical-align:middle;cursor:default;pointer-events:none;opacity:0.4}
.tracker-table.reorder-mode .cell-drag{cursor:grab;pointer-events:auto;opacity:1;background:var(--kn-blue-tint);touch-action:none;border-right:2px solid var(--kn-blue)}
.tracker-table.reorder-mode .cell-drag:hover{color:var(--kn-blue);background:#cdc8ed}
.tracker-table.reorder-mode .cell-drag:active{cursor:grabbing}
.tracker-drag-handle{display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:18px;line-height:1;padding:14px 8px;user-select:none;letter-spacing:-3px}
body.is-row-dragging{cursor:grabbing !important;user-select:none}
body.is-row-dragging *{cursor:grabbing !important}

/* Reorder-mode banner inside table */
.tracker-table.reorder-mode tbody tr{cursor:default}
.tracker-reorder-banner{background:var(--kn-blue);color:white;padding:10px 16px;border-radius:var(--r);margin-bottom:12px;font-size:12px;display:flex;align-items:center;justify-content:space-between;animation:slideUp 0.2s}
.tracker-reorder-banner button{background:white;color:var(--kn-blue);font-weight:600;padding:6px 14px;border-radius:var(--r-sm);font-size:11px;border:none;cursor:pointer}
.tracker-reorder-banner button:hover{background:var(--kn-warm)}

/* Topbar add menu dropdown */
.topbar-add-menu{position:relative;display:inline-block}
.topbar-add-dropdown{position:absolute;top:calc(100% + 4px);right:0;background:white;border:1px solid var(--kn-border);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:100;min-width:240px;display:none;overflow:hidden}
.topbar-add-dropdown.open{display:block}
.topbar-add-dropdown button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;background:transparent;border:none;text-align:left;font-size:12.5px;color:var(--kn-text);cursor:pointer;font-weight:500}
.topbar-add-dropdown button:hover{background:var(--kn-blue-tint);color:var(--kn-blue)}
.topbar-add-dropdown button:disabled{opacity:0.4;cursor:not-allowed}
.topbar-add-dropdown button:disabled:hover{background:transparent;color:var(--kn-text)}
.topbar-add-dropdown button svg{width:14px;height:14px;flex-shrink:0}

/* Settings page tab navigation */
.settings-tabs{position:sticky;top:0;z-index:50;background:var(--kn-warm);border-bottom:1px solid var(--kn-border);padding:8px 0;margin:-20px -20px 20px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.settings-tabs button{padding:8px 14px;background:transparent;color:var(--kn-text-soft);border:1px solid transparent;border-radius:var(--r-sm);font-size:12px;font-weight:500;white-space:nowrap;transition:all 0.15s;cursor:pointer;flex-shrink:0}
.settings-tabs button:hover{background:var(--kn-warm-soft);color:var(--kn-text)}
.settings-tabs button.active{background:var(--kn-blue);color:var(--kn-warm);border-color:var(--kn-blue)}

/* Weekly snapshot banner */
.snapshot-banner{background:linear-gradient(135deg,var(--kn-blue) 0%,#2516a8 100%);color:white;padding:14px 20px;border-radius:var(--r-lg);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(13,0,137,0.2)}
.snapshot-banner button{font-size:11px;padding:6px 14px}
.tracker-table-wrap.snapshot-readonly{position:relative;border-color:var(--kn-blue)}
.tracker-table-wrap.snapshot-readonly::before{content:'📸 SNAPSHOT';position:absolute;top:10px;right:10px;background:var(--kn-blue);color:white;padding:3px 10px;border-radius:3px;font-size:9px;font-weight:600;letter-spacing:0.1em;z-index:20;pointer-events:none}
.col-resizer{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:11;background:transparent;transition:background 0.15s}
.col-resizer:hover{background:var(--kn-blue)}
.col-resizer.resizing{background:var(--kn-blue)}
.tracker-table .cell-input{width:100%;padding:5px 8px;background:transparent;border:1px solid transparent;border-radius:4px;font-size:12px;font-family:inherit;color:var(--kn-text);transition:all 0.1s}
.tracker-table .cell-input:hover{border-color:var(--kn-border);background:var(--kn-warm-soft)}
.tracker-table .cell-input:focus{border-color:var(--kn-blue);background:white;box-shadow:0 0 0 2px var(--kn-blue-tint)}
.tracker-table .cell-num{font-family:'IBM Plex Mono',monospace;color:var(--kn-text-soft);font-size:11px;width:30px;text-align:right;padding-right:10px;vertical-align:middle}
.tracker-table .cell-pn{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--kn-blue);font-size:11px}
.tracker-table .cell-pn.cancelled{color:var(--kn-red);text-decoration:line-through}
.tracker-table .cell-pn-clickable{cursor:pointer;transition:all 0.1s;padding:1px 4px;margin:-1px -4px;border-radius:3px}
.tracker-table .cell-pn-clickable:hover{background:var(--kn-blue);color:white}

/* Parent / sub-project hierarchy */
.tracker-table tbody tr.row-parent td{background:linear-gradient(180deg,rgba(13,0,137,0.04) 0%,rgba(13,0,137,0.02) 100%)}
.tracker-table tbody tr.row-parent:hover td{background:rgba(13,0,137,0.08)}
.tracker-table tbody tr.row-child td{background:#fafaf5;font-size:12px}
.tracker-table tbody tr.row-child:hover td{background:#f5f5ee}
.tracker-table tbody tr.row-child td:first-child + td{color:var(--kn-text-faint)}
.tree-marker{display:inline-flex;align-items:flex-start;justify-content:flex-end;flex-shrink:0;color:var(--kn-text-faint);font-family:'IBM Plex Mono',monospace;font-size:14px;line-height:1.2;padding-right:4px;padding-top:2px}
.tree-marker .tree-line{opacity:0.5}
.parent-toggle{flex-shrink:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:var(--kn-warm);border:1px solid var(--kn-border);border-radius:3px;cursor:pointer;color:var(--kn-text-soft);padding:0;margin-top:1px}
.parent-toggle:hover{background:var(--kn-blue);color:white;border-color:var(--kn-blue)}
.parent-badge{display:inline-block;background:var(--kn-blue);color:white;font-family:'IBM Plex Sans',sans-serif;font-size:9px;font-weight:600;padding:1px 5px;border-radius:8px;margin-left:4px;vertical-align:middle}
.row-parent .cell-pn{color:#0d0089;text-shadow:0 0 0 currentColor}
.rollup-pill{filter:saturate(0.85)}
.rollup-display{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--kn-text-soft);font-style:italic}

/* Row action stack — hide and add-sub buttons */
.row-action-stack{position:absolute;top:-4px;right:-4px;display:flex;flex-direction:column;gap:3px}
.row-action-btn,.row-hide-btn{width:22px;height:22px;display:none;background:white;border:1px solid var(--kn-border);border-radius:50%;cursor:pointer;color:var(--kn-text-soft);align-items:center;justify-content:center;padding:0;flex-shrink:0}
.row-action-btn:hover{background:var(--kn-blue);color:white;border-color:var(--kn-blue)}
.tracker-pill{display:inline-flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 10px;border-radius:4px;font-size:11px;font-weight:500;cursor:pointer;transition:filter 0.1s;white-space:nowrap;width:100%;box-sizing:border-box}
.tracker-pill:hover{filter:brightness(0.95)}
.tracker-pill svg{width:9px;height:9px;opacity:0.7;flex-shrink:0}
.tracker-pill .label-text{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis}
.tracker-pill.pill-phase{min-width:130px}
.tracker-pill.pill-status{min-width:140px}
.tracker-pill.pill-priority{min-width:74px}
.tracker-progress-bar{position:relative;height:18px;background:var(--kn-warm-soft);border-radius:3px;overflow:hidden;min-width:80px}
.tracker-progress-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,#7ed87e 0%,#5cb85c 100%);transition:width 0.2s}
.tracker-progress-pct{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:white;text-shadow:0 1px 1px rgba(0,0,0,0.2);font-family:'IBM Plex Mono',monospace}
.tracker-assignees{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:24px}
.tracker-assignee-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:500;color:white}
.tracker-assignee-chip .x{cursor:pointer;opacity:0.7;font-weight:700;line-height:1}
.tracker-assignee-chip .x:hover{opacity:1}

<body>
<div id="app"></div>
<div class="toast-stack" id="toasts"></div>

<script>
/* ============================================================
   KNOWLIOM TIME & LOAD PLANNER
   Designed and built by Abdulrhman Alanim
   Concept Design Manager — Knowliom (CAG), Riyadh
   ============================================================ */

/* ---------- Constants ---------- */
const STD_WORK_HOURS = 8;
const WEEKEND_DAYS = [5, 6]; // Fri, Sat (Saudi)
const WEIGHT_MULTIPLIER = { '-2': 0.5, '-1': 0.75, '0': 1.0, '1': 1.5, '2': 2.0 };
const WEIGHT_LABEL = { '-2': 'Quick', '-1': 'Light', '0': 'Normal', '1': 'Heavy', '2': 'Super' };

/* ---------- Project Tracker constants ---------- */
const PROJECT_PHASES = [
  { v: 'not_started', label: 'Not Started', color: '#e5e5e5' },
  { v: 'pre_design',  label: 'Pre-Design',  color: '#1a3a8a' },
  { v: 'concept',     label: 'Concept Development', color: '#5cb85c' },
  { v: 'schematic',   label: 'Schematic Design', color: '#7ed87e' },
  { v: 'design_dev',  label: 'Design Development', color: '#3d8b3d' },
  { v: 'detailed',    label: 'Detailed Drawings', color: '#346b34' },
  { v: 'procurement', label: 'Procurement Support', color: '#2d5e2d' },
  { v: 'construction',label: 'Construction Support', color: '#264f26' },
  { v: 'complete',    label: 'Complete', color: '#5b8c5b' }
];
const TRACK_STATUSES = [
  { v: 'on_track',    label: 'On Track',     color: '#9ad19a' },
  { v: 'pending',     label: 'Pending Client Initiation', color: '#f5d088' },
  { v: 'delayed',     label: 'Delayed',      color: '#f0a878' },
  { v: 'on_hold',     label: 'On Hold',      color: '#cccccc' },
  { v: 'at_risk',     label: 'At Risk',      color: '#cd3a32' },
  { v: 'done',        label: 'Done',         color: '#4a7a4a' },
  { v: 'cancelled',   label: 'Cancelled',    color: '#e8e8e8' }
];
const PROJECT_PRIORITIES = [
  { v: 'low',    label: 'Low',    color: '#c9e8c9' },
  { v: 'medium', label: 'Medium', color: '#f0c89a' },
  { v: 'high',   label: 'High',   color: '#cd3a32' }
];

const phaseLabel = (v) => (PROJECT_PHASES.find(p => p.v === v) || PROJECT_PHASES[0]).label;
const phaseColor = (v) => (PROJECT_PHASES.find(p => p.v === v) || PROJECT_PHASES[0]).color;
const trackStatusLabel = (v) => (TRACK_STATUSES.find(p => p.v === v) || TRACK_STATUSES[0]).label;
const trackStatusColor = (v) => (TRACK_STATUSES.find(p => p.v === v) || TRACK_STATUSES[0]).color;
const priorityLabel = (v) => (PROJECT_PRIORITIES.find(p => p.v === v) || PROJECT_PRIORITIES[0]).label;
const priorityColor = (v) => (PROJECT_PRIORITIES.find(p => p.v === v) || PROJECT_PRIORITIES[0]).color;

// Migrate older project records to new schema (additive, non-destructive)
function ensureTrackerFields(p) {
  if (p.phase === undefined) p.phase = 'not_started';
  if (p.trackStatus === undefined) p.trackStatus = 'on_track';
  if (p.priority === undefined) p.priority = 'low';
  if (p.progress === undefined) p.progress = 0;
  if (p.startDate === undefined) p.startDate = null;
  if (p.dueDate === undefined) p.dueDate = null;
  if (!Array.isArray(p.assignedTo)) p.assignedTo = [];
  if (p.ongoingActivities === undefined) p.ongoingActivities = '';
  if (p.milestone === undefined) p.milestone = '';
  if (p.sortIndex === undefined || p.sortIndex === null) p.sortIndex = Date.now() + Math.random();
  if (p.hiddenInTracker === undefined) p.hiddenInTracker = false;
  if (p.parentId === undefined) p.parentId = null;
  return p;
}

// ---- Project hierarchy helpers ----
function getChildProjects(parentId) {
  return state.projects.filter(p => p.parentId === parentId)
    .sort((a,b) => (a.sortIndex ?? 0) - (b.sortIndex ?? 0));
}
function isParentProject(pid) {
  return state.projects.some(p => p.parentId === pid);
}
// Compute a parent's effective values from its children (read-only roll-up)
function rollupParent(parent) {
  const children = getChildProjects(parent.id);
  if (children.length === 0) return null;
  // Average progress across children
  const avgProgress = Math.round(children.reduce((s,c) => s + (c.progress||0), 0) / children.length);
  // Earliest start, latest due
  const starts = children.map(c => c.startDate).filter(Boolean).sort();
  const dues   = children.map(c => c.dueDate).filter(Boolean).sort();
  // Parent phase = least-advanced phase among non-complete children, else complete
  const phaseOrder = PROJECT_PHASES.map(p => p.v);
  const childPhases = children.map(c => phaseOrder.indexOf(c.phase));
  const minPhaseIdx = Math.min(...childPhases.filter(i => i >= 0));
  const allComplete = children.every(c => c.phase === 'complete' || c.trackStatus === 'done');
  // Status: if any child at risk → at risk; if any delayed → delayed; etc.
  const childStatuses = children.map(c => c.trackStatus);
  let rollStatus = 'on_track';
  if (childStatuses.includes('at_risk')) rollStatus = 'at_risk';
  else if (childStatuses.includes('delayed')) rollStatus = 'delayed';
  else if (childStatuses.includes('on_hold')) rollStatus = 'on_hold';
  else if (childStatuses.includes('pending')) rollStatus = 'pending';
  else if (childStatuses.every(s => s === 'done' || s === 'cancelled')) rollStatus = 'done';
  return {
    progress: avgProgress,
    startDate: starts[0] || null,
    dueDate: dues[dues.length - 1] || null,
    phase: allComplete ? 'complete' : phaseOrder[minPhaseIdx] || 'not_started',
    trackStatus: rollStatus,
    childCount: children.length
  };
}
// Generate next sub-project code given parent code
function nextSubProjectCode(parentCode) {
  if (!parentCode) return '';
  const siblings = state.projects.filter(p => p.code && p.code.startsWith(parentCode + '.'));
  let maxNum = 0;
  siblings.forEach(s => {
    const suffix = s.code.slice(parentCode.length + 1);
    const num = parseInt(suffix, 10);
    if (!isNaN(num) && num > maxNum) maxNum = num;
  });
  return `${parentCode}.${maxNum + 1}`;
}

const DEFAULT_HEATMAP_COLORS = {
  l1: '#dcf9df',     // < 20% — very light green
  l2: '#9ae6a3',     // < 45% — green
  l3: '#fff2b3',     // < 65% — light yellow
  l4: '#ffd84d',     // < 85% — yellow
  l5: '#f0a83a',     // < 105% — amber
  l6: '#e5781c',     // < 125% — orange
  over: '#cd3a32',   // ≥ 125% — red (kn-red)
  leave: '#b8d4e8',  // leave/sick/annual — light blue
  remote: '#e8c79a', // remote work — beige
  holiday: '#ffd84d' // holiday — yellow (kn-yellow)
};

function getHeatmapColors() {
  const custom = state.settings.heatmapColors || {};
  return { ...DEFAULT_HEATMAP_COLORS, ...custom };
}

// Compute a slightly darker border color from a hex
function darkenHex(hex, amount = 25) {
  const c = hex.replace('#','');
  const r = Math.max(0, parseInt(c.substr(0,2),16) - amount);
  const g = Math.max(0, parseInt(c.substr(2,2),16) - amount);
  const b = Math.max(0, parseInt(c.substr(4,2),16) - amount);
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
}

// Pick black or white text for legibility on a given background hex.
// Uses W3C relative luminance with a slight bias toward white text on saturated colors.
function textColorFor(bgHex) {
  if (!bgHex) return '#282828';
  const c = bgHex.replace('#','');
  if (c.length !== 6) return '#282828';
  const r = parseInt(c.substr(0,2),16) / 255;
  const g = parseInt(c.substr(2,2),16) / 255;
  const b = parseInt(c.substr(4,2),16) / 255;
  // sRGB → linear, then luminance
  const lin = (v) => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  return L > 0.55 ? '#1a1a1a' : '#ffffff';
}

function applyHeatmapColors() {
  // Inject CSS overrides into a dedicated <style> tag
  let styleEl = document.getElementById('heatmapColorOverrides');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'heatmapColorOverrides';
    document.head.appendChild(styleEl);
  }
  const c = getHeatmapColors();

/* ---------- IndexedDB ---------- */
const DB = {
  name: 'knowliom_planner_v2',
  version: 2,
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.name, this.version);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        ['employees','projects','assignments','leaves','settings','snapshots'].forEach(s => {
          if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: s === 'settings' ? 'key' : 'id' });
        });
      };
      req.onsuccess = () => { this.db = req.result; resolve(req.result); };
      req.onerror = () => reject(req.error);
    });
  },
  tx(stores, mode='readonly') { return this.db.transaction(stores, mode); },
  all(store) { return new Promise((res,rej)=>{ const r=this.tx([store]).objectStore(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  put(store, value) { return new Promise((res,rej)=>{ const r=this.tx([store],'readwrite').objectStore(store).put(value); r.onsuccess=()=>res(value); r.onerror=()=>rej(r.error); }); },
  del(store, key) { return new Promise((res,rej)=>{ const r=this.tx([store],'readwrite').objectStore(store).delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
  clear(store) { return new Promise((res,rej)=>{ const r=this.tx([store],'readwrite').objectStore(store).clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); },
  get(store, key) { return new Promise((res,rej)=>{ const r=this.tx([store]).objectStore(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
};

/* ---------- Utilities ---------- */

const fmtDate = (d) => {
  if (typeof d === 'string') return d;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const parseDate = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const isWeekend = (d) => WEEKEND_DAYS.includes((typeof d === 'string' ? parseDate(d) : d).getDay());
const isHoliday = (d) => {
  const ds = typeof d === 'string' ? d : fmtDate(d);
  return state.holidays.find(h => ds >= h.startDate && ds <= h.endDate);
};
const monthName = (d) => d.toLocaleString('en', { month:'long', year:'numeric' });
const dayName = (d, short=false) => d.toLocaleString('en', { weekday: short ? 'short' : 'long' });
const escHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = (n) => n.trim().split(/\s+/).map(p => p[0]).slice(0,2).join('').toUpperCase();

const toast = (msg, type='') => {

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function colorFor(seed) {
  let h = 0;
  for (let i=0; i<seed.length; i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

function workingDaysInMonth(year, month) {
  let count = 0;
  const last = new Date(year, month+1, 0).getDate();
  for (let d=1; d<=last; d++) {
    const dt = new Date(year, month, d);
    if (!isWeekend(dt) && !isHoliday(dt)) count++;
  }
  return count;
}

function leaveDaysInMonth(empId, year, month) {
  const monthKey = `${year}-${String(month+1).padStart(2,'0')}`;
  return state.leaves.filter(l => l.employeeId === empId && l.date.startsWith(monthKey)).length;
}

/* ---------- Load calculations ---------- */
function loadForDate(empId, dateStr) {
  const items = state.assignments.filter(a => a.employeeId === empId && a.date === dateStr);
  const leave = state.leaves.find(l => l.employeeId === empId && l.date === dateStr);
  const hours = items.reduce((s,a)=> s+a.hours, 0);
  const weightedHours = items.reduce((s,a)=> s + a.hours * (WEIGHT_MULTIPLIER[String(a.weight)] ?? 1), 0);
  return { hours, weightedHours, items, leave };
}

function loadColor(weighted, capacity) {
  const pct = capacity ? weighted / capacity : 0;
  if (pct >= 1.25) return 'red';
  if (pct >= 0.9) return 'amber';
  return 'green';
}

function loadLevel(weighted, capacity) {
  if (weighted === 0) return '';
  const pct = capacity ? weighted / capacity : 0;
  if (pct > 1.25) return 'over';
  if (pct >= 1.05) return 'l6';
  if (pct >= 0.85) return 'l5';
  if (pct >= 0.65) return 'l4';
  if (pct >= 0.45) return 'l3';
  if (pct >= 0.20) return 'l2';
  return 'l1';
}

// Remote work is NOT a deductible leave — it's a working-day flag
function isDeductibleLeave(leave) {
  return leave && leave.type !== 'Remote Work';
}
function isRemoteDay(empId, dateStr) {
  return state.leaves.some(l => l.employeeId === empId && l.date === dateStr && l.type === 'Remote Work');
}

function monthLoadForEmployee(empId, year, month) {
  // Two modes (set in settings.leaveAccountingMode):
  //  'deduct'  → capacity = (workdays - leaveDays) × productiveHours; leave doesn't count as worked
  //  'include' → capacity = all workdays × productiveHours; leave days are credited as fully worked (company method)
  // Remote Work in BOTH modes = regular working day (no special treatment)
  const cap = state.settings.productiveHoursPerDay;
  const mode = state.settings.leaveAccountingMode || 'include';
  const last = new Date(year, month+1, 0).getDate();
  let totalHours = 0, totalWeighted = 0, dayCount = 0, leaveCount = 0, remoteCount = 0;
  for (let d=1; d<=last; d++) {
    const dt = new Date(year, month, d);
    const ds = fmtDate(dt);
    if (isWeekend(dt) || isHoliday(dt)) continue;
    const leave = state.leaves.find(l => l.employeeId === empId && l.date === ds);
    const isRemote = leave && leave.type === 'Remote Work';
    const isDeductible = leave && leave.type !== 'Remote Work';
    if (isRemote) remoteCount++;
    if (isDeductible) {
      leaveCount++;
      if (mode === 'deduct') continue;          // skip from cap
      // 'include' mode: credit as fully worked, count toward cap
      totalHours += cap;
      totalWeighted += cap;
      dayCount++;
      continue;
    }
    // Regular workday (incl. remote): count assignments
    const { hours, weightedHours } = loadForDate(empId, ds);
    totalHours += hours;
    totalWeighted += weightedHours;
    dayCount++;
  }
  const capacity = dayCount * cap;
  return { totalHours, totalWeighted, capacity, dayCount, leaveCount, remoteCount, pct: capacity ? totalWeighted/capacity : 0, mode };
}

/* Overtime for an employee in a given month
   Rules: weekend work = ALL hours OT; weekday > 8h = excess is OT
   Comp factor: 1h OT = 1.5h effective */
const OT_MULTIPLIER = 1.5;
function overtimeForEmployee(empId, year, month) {
  const monthKey = `${year}-${String(month+1).padStart(2,'0')}`;
  const empAssigns = state.assignments.filter(a => a.employeeId === empId && a.date.startsWith(monthKey));
  const byDate = {};
  empAssigns.forEach(a => { (byDate[a.date] = byDate[a.date] || []).push(a); });

  let weekendRawOT = 0, dailyRawOT = 0;
  const details = []; // { date, type: 'weekend'|'overflow', hours, items, totalDay }

  Object.entries(byDate).forEach(([date, items]) => {
    const dt = parseDate(date);
    const dayHours = items.reduce((s,a) => s + a.hours, 0);
    if (isWeekend(dt)) {
      weekendRawOT += dayHours;
      details.push({ date, type: 'weekend', hours: dayHours, items, totalDay: dayHours });
    } else if (dayHours > STD_WORK_HOURS) {
      const ot = dayHours - STD_WORK_HOURS;
      dailyRawOT += ot;
      details.push({ date, type: 'overflow', hours: ot, items, totalDay: dayHours });
    }
  });

  const totalRawOT = weekendRawOT + dailyRawOT;
  return {
    weekendRawOT,
    dailyRawOT,
    totalRawOT,
    totalEffectiveOT: totalRawOT * OT_MULTIPLIER,
    weekendDays: details.filter(d => d.type === 'weekend').length,
    overflowDays: details.filter(d => d.type === 'overflow').length,
    details: details.sort((a,b) => a.date.localeCompare(b.date))
  };
}

/* ---------- Auto-distribute hours across same-day assignments ---------- */
// Each assignment can have a `locked: true` flag set when user manually edits hours.
// Locked assignments keep their hours; only unlocked ones share remaining capacity.
function suggestHoursFor(empId, date, excludingId = null) {
  const cap = state.settings.productiveHoursPerDay;
  const existing = state.assignments.filter(a => a.employeeId === empId && a.date === date && a.id !== excludingId);
  if (existing.length === 0) return cap;
  const locked = existing.filter(a => a.locked);
  const unlocked = existing.filter(a => !a.locked);
  const lockedHrs = locked.reduce((s,a) => s + a.hours, 0);
  const remaining = Math.max(cap - lockedHrs, 0.5);
  return Math.round((remaining / (unlocked.length + 1)) * 4) / 4; // round to 0.25
}

async function redistributeUnlocked(empId, date) {
  if (!state.settings.autoDistributeHours) return;
  const cap = state.settings.productiveHoursPerDay;
  const existing = state.assignments.filter(a => a.employeeId === empId && a.date === date);
  if (existing.length === 0) return;
  const locked = existing.filter(a => a.locked);
  const unlocked = existing.filter(a => !a.locked);
  if (unlocked.length === 0) return;
  const lockedHrs = locked.reduce((s,a) => s + a.hours, 0);
  const remaining = Math.max(cap - lockedHrs, 0.5);
  const share = Math.round((remaining / unlocked.length) * 4) / 4;
  for (const a of unlocked) {
    if (Math.abs(a.hours - share) < 0.01) continue;
    a.hours = share;
    await DB.put('assignments', a);
  }
}

/* ---------- History (Undo/Redo) ---------- */
const History = {
  past: [],   // each entry: { do, undo, label }
  future: [],
  max: 100,
  // Apply an action; if record=true, push to history
  async apply(action, record=true) {
    await action.do();
    if (record) {
      this.past.push(action);
      if (this.past.length > this.max) this.past.shift();
      this.future = [];
      updateUndoButtons();
    }
  },
  async undo() {
    const a = this.past.pop();
    if (!a) return;
    await a.undo();
    this.future.push(a);
    updateUndoButtons();
    render();
    toast('Undone: ' + a.label);
  },
  async redo() {
    const a = this.future.pop();
    if (!a) return;
    await a.do();
    this.past.push(a);
    updateUndoButtons();
    render();
    toast('Redone: ' + a.label);
  },
  canUndo() { return this.past.length > 0; },
  canRedo() { return this.future.length > 0; }
};

function updateUndoButtons() {
  const u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn');
  if (u) u.disabled = !History.canUndo();
  if (r) r.disabled = !History.canRedo();
}

    undo: async () => { state.assignments = state.assignments.filter(x => x.id !== a.id); await DB.del('assignments', a.id); markSaved(); }

}

}
function actDeleteAssignment(a) {
  return {
    label: 'Delete assignment',
    do: async () => { state.assignments = state.assignments.filter(x => x.id !== a.id); await DB.del('assignments', a.id); markSaved(); },
    undo: async () => { state.assignments.push(a); await DB.put('assignments', a); markSaved(); }
  };
}
function actBulkAddAssignments(items) {
  return {
    label: `Add ${items.length} assignments`,
    do: async () => { for (const a of items) { state.assignments.push(a); await DB.put('assignments', a); } markSaved(); },
    undo: async () => { for (const a of items) { state.assignments = state.assignments.filter(x => x.id !== a.id); await DB.del('assignments', a.id); } markSaved(); }
  };
}

function actUpdateProject(oldP, newP) {
  return {
    label: 'Update project',
    do: async () => {
      const i = state.projects.findIndex(x => x.id === newP.id);
      if (i >= 0) Object.assign(state.projects[i], newP);
      await DB.put('projects', state.projects[i] || newP);
      markSaved();
    },
    undo: async () => {
      const i = state.projects.findIndex(x => x.id === oldP.id);
      if (i >= 0) {
        // Wipe and restore — handles deleted properties properly
        Object.keys(state.projects[i]).forEach(k => { if (!(k in oldP)) delete state.projects[i][k]; });
        Object.assign(state.projects[i], oldP);
      }
      await DB.put('projects', state.projects[i] || oldP);
      markSaved();
    }
  };
}
function actAddLeave(l) {
  return {
    label: 'Add leave',
    do: async () => { state.leaves.push(l); await DB.put('leaves', l); markSaved(); },
    undo: async () => { state.leaves = state.leaves.filter(x => x.id !== l.id); await DB.del('leaves', l.id); markSaved(); }
  };
}
function actBulkAddLeaves(items) {
  return {

    undo: async () => { for (const l of items) { state.leaves = state.leaves.filter(x => x.id !== l.id); await DB.del('leaves', l.id); } markSaved(); }
  };
}
function actDeleteLeave(l) {
  return {
    label: 'Delete leave',
    do: async () => { state.leaves = state.leaves.filter(x => x.id !== l.id); await DB.del('leaves', l.id); markSaved(); },
    undo: async () => { state.leaves.push(l); await DB.put('leaves', l); markSaved(); }
  };
}

/* ---------- Save indicator ---------- */
function markSaved() {
  state.settings.saveIndicatorTime = Date.now();
  const dot = document.querySelector('.save-dot');
  const lbl = document.getElementById('saveLabel');
  if (dot) { dot.classList.add('saving'); setTimeout(()=> dot.classList.remove('saving'), 400); }
  if (lbl) lbl.textContent = 'Saved just now';
  // refresh "X seconds ago" label every few seconds
}

setInterval(() => {
  const t = state.settings.saveIndicatorTime;
  const lbl = document.getElementById('saveLabel');
  if (!lbl || !t) return;
  const diff = Math.floor((Date.now() - t)/1000);
  if (diff < 5) lbl.textContent = 'Saved just now';
  else if (diff < 60) lbl.textContent = `Saved ${diff}s ago`;
  else if (diff < 3600) lbl.textContent = `Saved ${Math.floor(diff/60)}m ago`;
  else lbl.textContent = `Saved ${Math.floor(diff/3600)}h ago`;
}, 5000);

function render() {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === state.view));
  const titles = { dashboard:'Dashboard', calendar:'Calendar', tracker:'Project Tracker', projects:'Projects', employees:'Employees', reports:'Reports', settings:'Settings' };
  document.getElementById('pageTitle').textContent = titles[state.view];

  switch(state.view) {
    case 'dashboard': renderDashboard(); break;
    case 'calendar': renderCalendar(); break;
    case 'tracker': renderTracker(); break;
    case 'projects': renderProjects(); break;
    case 'employees': renderEmployees(); break;
    case 'reports': renderReports(); break;
    case 'settings': renderSettings(); break;

}

function topbarMonthPicker(onPrev, onToday, onNext, onLabelClick) {

function bindMonthPicker() {
  const prev = document.getElementById('mpPrev');
  const next = document.getElementById('mpNext');
  const today = document.getElementById('mpToday');
  const label = document.getElementById('mpLabel');
  if (prev) prev.onclick = () => { state.currentDate = new Date(state.currentDate.getFullYear(), state.currentDate.getMonth()-1, 1); render(); };
  if (next) next.onclick = () => { state.currentDate = new Date(state.currentDate.getFullYear(), state.currentDate.getMonth()+1, 1); render(); };
  if (today) today.onclick = () => { state.currentDate = new Date(); render(); };
  if (label) label.onclick = openMonthJumpModal;
}

function openMonthJumpModal() {
  const y = state.currentDate.getFullYear();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  showModal(`
    <div class="modal-head">
      <div><div class="modal-title">Jump to month</div></div>
      <button class="modal-close" onclick="closeModal()">${ic('x')}</button>

      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px" id="jMonths">
        ${months.map((mn,i)=>`<button class="weight-opt ${i===state.currentDate.getMonth()?'active':''}" data-m="${i}"><div class="v" style="font-family:'IBM Plex Sans',sans-serif">${mn}</div></button>`).join('')}
      </div>
    </div>
  `);
  let curY = y;
  const setYear = (delta) => {
    curY += delta;
    document.getElementById('jyLabel').textContent = curY;
  };
  document.getElementById('jyPrev').onclick = () => setYear(-1);
  document.getElementById('jyNext').onclick = () => setYear(1);
  document.querySelectorAll('#jMonths button').forEach(b => b.onclick = () => {
    state.currentDate = new Date(curY, +b.dataset.m, 1);

  });
}

      ${renderHeatmap(y, m)}
    </div>

    <div class="signature-footer">Designed and built by Abdulrhman Alanim · Knowliom · v3</div>
  `;

  document.querySelectorAll('.emp-card').forEach(card => {
    card.onclick = (e) => {
      // OT badge or name → open OT modal
      const otTrigger = e.target.closest('[data-otempid]');
      if (otTrigger) {
        e.stopPropagation();
        openOvertimeModal(otTrigger.dataset.otempid);
        return;
      }
      state.selectedEmployee = card.dataset.empid;
      state.view = 'calendar';
      render();
    };
  });
  document.querySelectorAll('.heatmap-cell[data-date]').forEach(cell => {
    cell.onclick = () => {
      state.currentDate = parseDate(cell.dataset.date);
      state.calendarView = 'day';
      state.selectedEmployee = cell.dataset.empid;
      state.view = 'calendar';
      render();
    };
  });
}

function renderForecast(curY, curM) {
  // Show last month, current, next — current is highlighted in the middle
  const months = [
    { y: curM === 0 ? curY - 1 : curY, m: (curM + 11) % 12, label: 'Last month' },
    { y: curY, m: curM, label: 'Current' },
    { y: curM === 11 ? curY + 1 : curY, m: (curM + 1) % 12, label: 'Next' }
  ];
  return `<div class="forecast-grid">
    ${months.map((mo, idx) => {
      const teamLoads = state.employees.map(e => monthLoadForEmployee(e.id, mo.y, mo.m));
      const totalCap = teamLoads.reduce((s,l) => s + l.capacity, 0);
      const totalWeighted = teamLoads.reduce((s,l) => s + l.totalWeighted, 0);
      const pct = totalCap ? Math.round(100 * totalWeighted / totalCap) : 0;
      const overbooked = teamLoads.filter(l => l.pct > 1.0).length;
      const monthDt = new Date(mo.y, mo.m, 1);
      const cls = pct >= 100 ? 'red' : pct >= 85 ? 'amber' : pct >= 30 ? 'green' : '';
      const fillColor = pct >= 100 ? 'var(--kn-red)' : pct >= 85 ? 'var(--kn-amber)' : pct >= 30 ? 'var(--kn-green)' : 'var(--kn-text-faint)';
      return `<div class="forecast-card ${idx===1?'current':''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <div>
            <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--kn-text-soft);font-weight:500">${mo.label}</div>
            <div class="forecast-month">${monthName(monthDt)}</div>
          </div>
          ${pct === 0 ? '<span style="font-size:10px;color:var(--kn-text-faint);text-transform:uppercase;letter-spacing:0.06em">empty</span>' : ''}
        </div>
        <div class="forecast-pct">${pct}<span style="font-size:14px;color:var(--kn-text-soft);margin-left:4px">%</span></div>
        <div class="forecast-bar"><div class="forecast-bar-fill" style="width:${Math.min(pct,150)}%;background:${fillColor}"></div></div>
        <div class="forecast-meta">
          ${overbooked > 0 ? `<span style="color:var(--kn-red);font-weight:500">${overbooked} over 100%</span> · ` : ''}
          ${pct === 0 ? 'Nothing scheduled yet' : `${totalWeighted.toFixed(0)}h scheduled`}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}


function renderHeatmap(year, month) {
  const last = new Date(year, month+1, 0).getDate();
  const days = Array.from({length: last}, (_, i) => i+1);
  const cap = state.settings.productiveHoursPerDay;

  let header = `<div class="heatmap-row" style="display:contents">
    <div class="heatmap-label" style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;">Day</div>
    ${days.map(d => `<div style="text-align:center;font-size:9px;color:var(--kn-text-faint);font-family:'IBM Plex Mono',monospace;">${d}</div>`).join('')}
  </div>`;

  const rows = state.employees.map(e => {
    const cells = days.map(d => {
      const dt = new Date(year, month, d);
      const ds = fmtDate(dt);
      const wknd = isWeekend(dt);
      const hol = isHoliday(dt);
      const { weightedHours, leave } = loadForDate(e.id, ds);
      const isRemote = leave && leave.type === 'Remote Work';
      const isDeductible = leave && leave.type !== 'Remote Work';
      let cls = '', title = '';
      if (isDeductible) { cls = 'leave'; title = `${leave.type} · ${ds}`; }
      else if (hol) { cls = 'holiday'; title = `${hol.name} (${ds})`; }
      else if (wknd && weightedHours === 0) { cls = 'weekend'; title = `${dayName(dt)} ${ds}`; }
      else if (isRemote && weightedHours === 0) { cls = 'remote'; title = `Remote · ${ds}`; }
      else {
        cls = loadLevel(weightedHours, cap);
        if (isRemote) cls += ' remote';
        title = `${e.name} · ${ds} · ${weightedHours.toFixed(1)}h weighted${isRemote?' · remote':''}`;
      }
      return `<div class="heatmap-cell ${cls}" data-date="${ds}" data-empid="${e.id}" title="${escHtml(title)}"></div>`;
    }).join('');
    return `<div class="heatmap-row" style="display:contents">
      <div class="heatmap-label">${escHtml(e.name)}</div>${cells}
    </div>`;
  }).join('');

  return `<div class="heatmap-wrap">
    <div class="heatmap" style="grid-template-columns:140px repeat(${days.length}, minmax(18px,1fr));">${header}${rows}</div>
    <div class="heatmap-legend">
      <span>Load</span>
      <div class="legend-swatches">
        <div class="legend-swatch heatmap-cell"></div>
        <div class="legend-swatch heatmap-cell l1"></div>
        <div class="legend-swatch heatmap-cell l2"></div>
        <div class="legend-swatch heatmap-cell l3"></div>
        <div class="legend-swatch heatmap-cell l4"></div>
        <div class="legend-swatch heatmap-cell l5"></div>
        <div class="legend-swatch heatmap-cell l6"></div>
        <div class="legend-swatch heatmap-cell over"></div>
      </div>
      <span style="margin-left:6px">low → over</span>
      <div class="legend-item"><div class="legend-swatch heatmap-cell leave"></div> Leave</div>
      <div class="legend-item"><div class="legend-swatch heatmap-cell remote"></div> Remote</div>
      <div class="legend-item"><div class="legend-swatch heatmap-cell holiday"></div> Holiday</div>
    </div>
  </div>`;
}

/* ---------- Render: Calendar ---------- */

    ${state.clipboard ? `<div style="background:var(--kn-mint-soft);border:1px solid var(--kn-green);color:var(--kn-green);padding:8px 14px;border-radius:var(--r);margin-bottom:12px;font-size:12px;display:flex;justify-content:space-between;align-items:center"><span>${state.clipboard.items.length} item${state.clipboard.items.length>1?'s':''} in clipboard · select a day and press <span class="kbd">⌘V</span> to paste</span><button class="btn btn-ghost" onclick="state.clipboard=null;render()">Clear</button></div>` : ''}
