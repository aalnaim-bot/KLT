async function exportFullBackup() {
  try {
    const wb = XLSX.utils.book_new();

    const empSheet = XLSX.utils.json_to_sheet(state.employees);
    XLSX.utils.book_append_sheet(wb, empSheet, 'Employees');

    const projSheet = XLSX.utils.json_to_sheet(state.projects);
    XLSX.utils.book_append_sheet(wb, projSheet, 'Projects');

    const assignSheet = XLSX.utils.json_to_sheet(state.assignments.map(a => ({
      ...a,
      employeeName: state.employees.find(e => e.id === a.employeeId)?.name || '',
      projectCode: state.projects.find(p => p.id === a.projectId)?.code || '',
      projectName: state.projects.find(p => p.id === a.projectId)?.name || ''
    })));
    XLSX.utils.book_append_sheet(wb, assignSheet, 'Assignments');

    const leaveSheet = XLSX.utils.json_to_sheet(state.leaves.map(l => ({
      ...l,
      employeeName: state.employees.find(e => e.id === l.employeeId)?.name || ''
    })));
    XLSX.utils.book_append_sheet(wb, leaveSheet, 'Leaves');

    const holSheet = XLSX.utils.json_to_sheet(state.holidays);
    XLSX.utils.book_append_sheet(wb, holSheet, 'Holidays');

    const settingsSheet = XLSX.utils.json_to_sheet([{
      productiveHoursPerDay: state.settings.productiveHoursPerDay,
      overtimeThreshold: state.settings.overtimeThreshold,
      autoBackupDays: state.settings.autoBackupDays,
      exportedAt: new Date().toISOString()
    }]);
    XLSX.utils.book_append_sheet(wb, settingsSheet, 'Settings');

    const stamp = fmtDate(new Date()) + '_' + new Date().toTimeString().slice(0,5).replace(':','');
    XLSX.writeFile(wb, `Knowliom_Planner_Backup_${stamp}.xlsx`);

    state.settings.lastBackup = new Date().toISOString();
    await saveSettings();
    updateLastBackupLabel();
    toast('Backup saved','success');
  } catch (err) {
    console.error(err);
    toast('Backup failed: ' + err.message, 'error');
  }
}

async function importBackup(file) {
  if (!confirm('Import will MERGE the file into your current data (matching by ID). Continue?')) return;
  try {
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, { type: 'array' });

    const sheets = ['Employees','Projects','Assignments','Leaves','Holidays'];
    let counts = { Employees:0, Projects:0, Assignments:0, Leaves:0, Holidays:0 };

    for (const name of sheets) {
      if (!wb.SheetNames.includes(name)) continue;
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name]);
      if (name === 'Employees') {
        for (const r of rows) {
          if (!r.id) continue;
          const item = { id: r.id, name: r.name, role: r.role||'', color: r.color || colorFor(r.id) };
          state.employees = state.employees.filter(x => x.id !== item.id);
          state.employees.push(item);
          await DB.put('employees', item);
          counts.Employees++;
        }
      } else if (name === 'Projects') {
        for (const r of rows) {
          if (!r.id) continue;
          const item = { id: r.id, code: r.code, name: r.name, client: r.client||'', type: r.type||'project', status: r.status||'active', color: r.color || colorFor(r.id) };
          state.projects = state.projects.filter(x => x.id !== item.id);
          state.projects.push(item);
          await DB.put('projects', item);
          counts.Projects++;
        }
      } else if (name === 'Assignments') {
        for (const r of rows) {
          if (!r.id) continue;
          const item = { id: r.id, employeeId: r.employeeId, projectId: r.projectId, date: r.date, hours: +r.hours, weight: +r.weight, notes: r.notes||'' };
          state.assignments = state.assignments.filter(x => x.id !== item.id);
          state.assignments.push(item);
          await DB.put('assignments', item);
          counts.Assignments++;
        }
      } else if (name === 'Leaves') {
        for (const r of rows) {
          if (!r.id) continue;
          const item = { id: r.id, employeeId: r.employeeId, date: r.date, type: r.type||'Annual Leave', notes: r.notes||'' };
          state.leaves = state.leaves.filter(x => x.id !== item.id);
          state.leaves.push(item);
          await DB.put('leaves', item);
          counts.Leaves++;
        }
      } else if (name === 'Holidays') {
        state.holidays = migrateHolidays(rows.map(r => {
          if (r.startDate && r.endDate) return { name: r.name || '', startDate: r.startDate, endDate: r.endDate };
          if (r.date) return { name: r.name || '', date: r.date };
          return null;
        }).filter(Boolean));
        await saveHolidays();
        counts.Holidays = rows.length;
      }
    }

    if (wb.SheetNames.includes('Settings')) {
      const s = XLSX.utils.sheet_to_json(wb.Sheets['Settings'])[0];
      if (s) {
        if (s.productiveHoursPerDay) state.settings.productiveHoursPerDay = +s.productiveHoursPerDay;
        if (s.overtimeThreshold) state.settings.overtimeThreshold = +s.overtimeThreshold;
        if (s.autoBackupDays) state.settings.autoBackupDays = +s.autoBackupDays;
        await saveSettings();
      }
    }

    History.past = []; History.future = []; updateUndoButtons();
    render();
    toast(`Imported: ${counts.Employees}E ${counts.Projects}P ${counts.Assignments}A ${counts.Leaves}L ${counts.Holidays}H`, 'success');
  } catch (err) {
    console.error(err);
    toast('Import failed: ' + err.message, 'error');
  }
}

async function exportTimesheet() {
  try {
    const y = state.currentDate.getFullYear(), m = state.currentDate.getMonth();
    const monthKey = `${y}-${String(m+1).padStart(2,'0')}`;
    const monthLbl = monthName(state.currentDate);
    const last = new Date(y, m+1, 0).getDate();
    const cap = state.settings.productiveHoursPerDay;

    // Build a sheet that mirrors the company timesheet format
    const wb = XLSX.utils.book_new();

    const rows = [];
    rows.push([`Knowliom · Time Sheet · ${monthLbl}`]);
    rows.push([]);

    const monthAssigns = state.assignments.filter(a => a.date.startsWith(monthKey));
    const monthLeaves = state.leaves.filter(l => l.date.startsWith(monthKey));

    const buildSection = (title, type) => {
      rows.push([title]);
      const dayHeaders = ['Ref. #','Project','Client', ...Array.from({length:last},(_,i)=>String(i+1)),'Total'];
      rows.push(dayHeaders);
      const projects = state.projects.filter(p => p.type === type);
      projects.forEach(p => {
        const projectAssigns = monthAssigns.filter(a => a.projectId === p.id);
        if (projectAssigns.length === 0) return;
        const row = [p.code, p.name, p.client||''];
        let total = 0;
        for (let d = 1; d <= last; d++) {
          const ds = `${monthKey}-${String(d).padStart(2,'0')}`;
          const dayHrs = projectAssigns.filter(a => a.date === ds).reduce((s,a)=>s+a.hours, 0);
          row.push(dayHrs > 0 ? dayHrs : '');
          total += dayHrs;
        }
        row.push(total);
        rows.push(row);
      });
      rows.push([]);
    };

    buildSection('AWARDED PROJECTS', 'project');
    buildSection('BUSINESS DEVELOPMENT (Proposals)', 'proposal');
    buildSection('GENERAL / INTERNAL', 'internal');

    rows.push(['WORK SUSPENDED (Leave & Holidays)']);
    rows.push(['Type','Employee', ...Array.from({length:last},(_,i)=>String(i+1)),'Total']);
    state.employees.forEach(e => {
      const empLeaves = monthLeaves.filter(l => l.employeeId === e.id);
      const grouped = {};
      empLeaves.forEach(l => { if (!grouped[l.type]) grouped[l.type] = []; grouped[l.type].push(l); });
      Object.entries(grouped).forEach(([type, list]) => {
        const row = [type, e.name];
        let count = 0;
        for (let d = 1; d <= last; d++) {
          const ds = `${monthKey}-${String(d).padStart(2,'0')}`;
          const has = list.find(l => l.date === ds);
          row.push(has ? 1 : '');
          if (has) count++;
        }
        row.push(count);
        rows.push(row);
      });
    });
    state.holidays.forEach(h => {
      // Skip if range is entirely outside this month
      if (h.endDate < monthKey + '-01' || h.startDate > monthKey + '-31') return;
      const row = ['Public Holiday', h.name];
      let count = 0;
      for (let d = 1; d <= last; d++) {
        const ds = `${monthKey}-${String(d).padStart(2,'0')}`;
        const inRange = ds >= h.startDate && ds <= h.endDate;
        row.push(inRange ? 1 : '');
        if (inRange) count++;
      }
      if (count > 0) {
        row.push(count);
        rows.push(row);
      }
    });

    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, monthLbl);

    // Summary sheet
    const summaryRows = [['Employee','Hours','Weighted Hours','Capacity','Load %','Leave days','Weekend OT (h)','Overflow OT (h)','Raw OT (h)','Effective OT (×1.5)']];
    state.employees.forEach(e => {
      const ml = monthLoadForEmployee(e.id, y, m);
      const ot = overtimeForEmployee(e.id, y, m);
      summaryRows.push([
        e.name,
        +ml.totalHours.toFixed(1),
        +ml.totalWeighted.toFixed(1),
        +ml.capacity.toFixed(1),
        Math.round(ml.pct*100)+'%',
        ml.leaveCount,
        +ot.weekendRawOT.toFixed(1),
        +ot.dailyRawOT.toFixed(1),
        +ot.totalRawOT.toFixed(1),
        +ot.totalEffectiveOT.toFixed(1)
      ]);
    });
    const sumWs = XLSX.utils.aoa_to_sheet(summaryRows);
    XLSX.utils.book_append_sheet(wb, sumWs, 'Summary');

    XLSX.writeFile(wb, `Knowliom_Timesheet_${monthLbl.replace(' ','_')}.xlsx`);
    toast('Timesheet exported','success');
  } catch (err) {
    console.error(err);
    toast('Export failed: ' + err.message, 'error');
  }
}

/* ---------- Init / Seed ---------- */
async function loadAll() {
  state.employees = await DB.all('employees');
  state.projects = await DB.all('projects');
  state.assignments = await DB.all('assignments');
  state.leaves = await DB.all('leaves');
  try { state.snapshots = await DB.all('snapshots'); } catch(_) { state.snapshots = []; }

  // Migrate projects to ensure tracker fields exist (idempotent)
  for (const p of state.projects) {
    const before = JSON.stringify(p);
    ensureTrackerFields(p);
    if (JSON.stringify(p) !== before) await DB.put('projects', p);
  }

  const settingsRow = await DB.get('settings', 'app');
  if (settingsRow) state.settings = { ...state.settings, ...settingsRow.value };

  const holRow = await DB.get('settings', 'holidays');
  state.holidays = holRow ? holRow.value : [...DEFAULT_HOLIDAYS];
  state.holidays = migrateHolidays(state.holidays);
  if (!holRow) await saveHolidays();
}

// Migrate old single-date holidays to range format and merge consecutive same-name entries
function migrateHolidays(arr) {
  if (!arr || arr.length === 0) return [];
  // Step 1: normalize each entry to {name, startDate, endDate}
  const normalized = arr.map(h => {
    if (h.startDate && h.endDate) return { name: h.name || '', startDate: h.startDate, endDate: h.endDate };
    if (h.date) {
      // Old format — strip " Day N" suffix from name
      const cleanName = (h.name || '').replace(/\s*Day\s*\d+\s*$/i, '').trim() || 'Holiday';
      return { name: cleanName, startDate: h.date, endDate: h.date };
    }
    return null;
  }).filter(Boolean);

  // Step 2: sort by startDate
  normalized.sort((a,b) => a.startDate.localeCompare(b.startDate));

  // Step 3: merge consecutive same-name entries
  const merged = [];
  normalized.forEach(h => {
    const prev = merged[merged.length - 1];
    if (prev && prev.name === h.name) {
      const prevEnd = parseDate(prev.endDate);
      const thisStart = parseDate(h.startDate);
      const dayDiff = Math.round((thisStart - prevEnd) / 86400000);
      if (dayDiff <= 1) {
        // Extend prev's end date if this entry extends further
        if (h.endDate > prev.endDate) prev.endDate = h.endDate;
        return;
      }
    }
    merged.push({ ...h });
  });
  return merged;
}

async function maybeShowLockScreen() {
  if (!state.settings.pinHash) return false;
  return new Promise((resolve) => {
    document.body.insertAdjacentHTML('beforeend', `
      <div class="lock-screen" id="lockScreen">
        <div class="lock-logo">Knowliom</div>
        <div class="lock-tagline">Time & Load Planner</div>
        <input type="password" class="lock-input" id="pinInput" placeholder="Enter PIN" maxlength="8">
        <div class="lock-msg" id="lockMsg"></div>
      </div>
    `);
    const inp = document.getElementById('pinInput');
    inp.focus();
    inp.addEventListener('keydown', async (e) => {
      if (e.key !== 'Enter') return;
      const hash = await sha256(inp.value);
      if (hash === state.settings.pinHash) {
        document.getElementById('lockScreen').remove();
        resolve(true);
      } else {
        document.getElementById('lockMsg').textContent = 'Wrong PIN';
        document.getElementById('lockMsg').className = 'lock-msg err';
        inp.value = '';
        setTimeout(()=> document.getElementById('lockMsg').textContent = '', 1800);
      }
    });
  });
}

        setTimeout(() => toast(`Backup is ${days} days old — consider exporting`,'error'), 1500);

      setTimeout(() => toast('No backup yet — try Settings → Save full backup','error'), 1500);
    }

  }
})();
