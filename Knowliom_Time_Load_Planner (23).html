function weekRangeLabel(d) {
  const start = new Date(d); start.setDate(d.getDate() - d.getDay());
  const end = new Date(start); end.setDate(start.getDate() + 6);
  const sm = start.toLocaleString('en',{month:'short'}), em = end.toLocaleString('en',{month:'short'});
  return `${sm} ${start.getDate()} – ${em} ${end.getDate()}, ${end.getFullYear()}`;
}

function renderMonthView() {
  const y = state.currentDate.getFullYear(), m = state.currentDate.getMonth();
  const first = new Date(y, m, 1);
  const startOffset = first.getDay();
  const firstCell = new Date(y, m, 1 - startOffset);
  const cells = [];
  for (let i=0; i<42; i++) {
    const d = new Date(firstCell); d.setDate(firstCell.getDate()+i);
    cells.push(d);
  }
  const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const empFilter = state.selectedEmployee;
  const todayStr = fmtDate(new Date());
  const cap = state.settings.productiveHoursPerDay;

  return `<div class="cal-month">
    <div class="cal-weekdays">
      ${weekdays.map((w,i)=>`<div class="cal-weekday ${WEEKEND_DAYS.includes(i)?'weekend':''}">${w}</div>`).join('')}
    </div>
    <div class="cal-grid">
      ${cells.map(d => {
        const ds = fmtDate(d);
        const inMonth = d.getMonth() === m;
        const wknd = isWeekend(d);
        const hol = isHoliday(d);
        const isToday = ds === todayStr;
        const isSelected = state.selectedDay && state.selectedDay.date === ds;

        const empIds = empFilter === 'all' ? state.employees.map(e=>e.id) : [empFilter];
        let pills = [], totalH = 0, totalW = 0;
        empIds.forEach(eid => {
          const emp = state.employees.find(e => e.id === eid);
          const { items, leave, hours, weightedHours } = loadForDate(eid, ds);
          totalH += hours; totalW += weightedHours;
          if (leave) {
            const isRemote = leave.type === 'Remote Work';
            pills.push({ type:'leave', text: `${emp?.name||''} · ${leave.type}`, id: leave.id, isLeave: true, isRemote });
          }
          items.forEach(a => {
            const p = state.projects.find(pp => pp.id === a.projectId);
            if (p) pills.push({ id: a.id, code: p.code, name: p.name, hours: a.hours, weight: a.weight, color: p.color || colorFor(p.id), empId: eid, empName: emp?.name, empColor: emp?.color });
          });
        });

        const loadCls = totalW > 0 && empIds.length ? loadColor(totalW / empIds.length, cap) : '';
        const loadDisplay = empFilter === 'all' ? '' :
          totalH > 0 ? `<span class="cal-day-load ${loadCls}">${totalH.toFixed(1)}h</span>` : '';

        const visiblePills = pills.slice(0,4);
        const moreCount = pills.length - visiblePills.length;
        const isAllView = empFilter === 'all';
        // Weekend work = OT only for actual project work, not remote
        const hasWeekendWork = wknd && pills.some(p => !p.isLeave);
        const hasOverflow = !wknd && !hol && totalH > STD_WORK_HOURS;
        // Remote work day flag (any employee in scope is remote that day)
        const hasRemote = pills.some(p => p.isRemote) && !hol && !hasWeekendWork;

        return `<div class="cal-day ${inMonth?'':'other-month'} ${wknd?'weekend':''} ${hasWeekendWork?'weekend-work':''} ${hol?'holiday':''} ${hasRemote?'remote-work':''} ${isToday?'today':''} ${isSelected?'selected':''}" data-date="${ds}">
          <div class="cal-day-head">
            <span class="cal-day-num">${d.getDate()}</span>
            ${(hasWeekendWork || hasOverflow) ? `<span class="weekend-work-icon" title="${hasWeekendWork?'Weekend work — counts as overtime':'Over 8h — counts as overtime'}">${ic('clock')}</span>` : ''}
            ${loadDisplay}
          </div>
          ${hol ? `<div class="holiday-name" title="${escHtml(hol.name)}">${escHtml(hol.name)}</div>` : ''}
          <div class="cal-day-pills">
            ${visiblePills.map(p => p.isLeave ?
              `<div class="cal-pill ${p.isRemote?'remote':'leave'}" data-leaveid="${p.id||''}"><span>${escHtml(p.text)}</span></div>` :
              `<div class="cal-pill ${p.weight>0?'weight-'+p.weight:''} ${p.weight===-1?'weightm1':''} ${p.weight===-2?'weightm2':''} ${state.selectedPills.includes(p.id)?'selected':''}" 
                style="border-left-color:${p.color}" draggable="true" data-aid="${p.id}" data-empid="${p.empId}">
                ${isAllView ? `<span class="emp-badge" style="background:${p.empColor||'#888'}" title="${escHtml(p.empName||'')}">${escHtml(initials(p.empName||'?'))}</span>` : ''}
                <span class="h">${p.hours}h</span>
                <span class="code">${escHtml(p.code)}</span>
              </div>`
            ).join('')}
            ${moreCount > 0 ? `<div class="cal-day-more">+${moreCount} more</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderWeekView() {
  const d = state.currentDate;
  const start = new Date(d); start.setDate(d.getDate() - d.getDay());
  const days = Array.from({length:7}, (_,i) => { const x = new Date(start); x.setDate(start.getDate()+i); return x; });
  const todayStr = fmtDate(new Date());
  const isAllView = state.selectedEmployee === 'all';

  return `<div class="cal-week">
    <div class="cal-weekdays">
      ${days.map((d,i) => {
        const wknd = WEEKEND_DAYS.includes(i);
        return `<div class="cal-weekday ${wknd?'weekend':''}">${dayName(d, true)} ${d.getDate()}</div>`;
      }).join('')}
    </div>
    <div class="cal-week-grid">
      ${days.map((d,i) => {
        const ds = fmtDate(d);
        const wknd = WEEKEND_DAYS.includes(i);
        const hol = isHoliday(d);
        const isSelected = state.selectedDay && state.selectedDay.date === ds;
        const empIds = isAllView ? state.employees.map(e=>e.id) : [state.selectedEmployee];
        let pills = [];
        let totalH = 0;
        empIds.forEach(eid => {
          const { items, leave, hours } = loadForDate(eid, ds);
          totalH += hours;
          const emp = state.employees.find(e=>e.id===eid);
          if (leave) {
            const isRemote = leave.type === 'Remote Work';
            pills.push({ type:'leave', text: `${emp?.name || ''} · ${leave.type}`, isLeave:true, isRemote, id: leave.id });
          }
          items.forEach(a => {
            const p = state.projects.find(pp=>pp.id===a.projectId);
            if (p) pills.push({ id:a.id, code:p.code, name:p.name, hours:a.hours, weight:a.weight, color: p.color || colorFor(p.id), empId:eid, empName: emp?.name, empColor: emp?.color });
          });
        });

        const hasWeekendWork = wknd && pills.filter(p=>!p.isLeave).length > 0;
        const hasOverflow = !wknd && !hol && totalH > STD_WORK_HOURS;
        const hasRemote = pills.some(p => p.isRemote) && !hol && !hasWeekendWork;
        return `<div class="cal-week-day ${wknd?'weekend':''} ${hasWeekendWork?'weekend-work':''} ${hol?'holiday':''} ${hasRemote?'remote-work':''} ${ds===todayStr?'today':''} ${isSelected?'selected':''}" data-date="${ds}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <div class="day-name">${dayName(d, true)}</div>
              <div class="day-date">${d.getDate()}</div>
            </div>
            ${(hasWeekendWork || hasOverflow) ? `<span class="weekend-work-icon" style="width:18px;height:18px;margin-top:6px" title="${hasWeekendWork?'Weekend work — overtime':'Over 8h — overtime'}">${ic('clock')}</span>` : ''}
          </div>
          ${hol ? `<div class="holiday-banner">${escHtml(hol.name)}</div>` : ''}
          <div style="margin-bottom:10px;font-size:11px;color:var(--kn-text-soft);font-family:'IBM Plex Mono',monospace">${totalH.toFixed(1)}h scheduled${hasWeekendWork||hasOverflow?` <span style="color:var(--kn-amber);font-weight:600">· OT</span>`:''}</div>
          ${pills.map(p => p.isLeave ?
            `<div class="cal-pill ${p.isRemote?'remote':'leave'}" data-leaveid="${p.id}"><span>${escHtml(p.text)}</span></div>` :
            `<div class="cal-pill ${p.weight>0?'weight-'+p.weight:''} ${state.selectedPills.includes(p.id)?'selected':''}" style="border-left-color:${p.color}" draggable="true" data-aid="${p.id}" data-empid="${p.empId}">
              ${isAllView ? `<span class="emp-badge" style="background:${p.empColor||'#888'}">${escHtml(initials(p.empName||'?'))}</span>` : ''}
              <span class="h">${p.hours}h</span>
              <span class="name">${escHtml(p.code)} · ${escHtml(p.name)}</span>
            </div>`
          ).join('')}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderDayView() {
  const d = state.currentDate;
  const ds = fmtDate(d);
  const empIds = state.selectedEmployee === 'all' ? state.employees.map(e=>e.id) : [state.selectedEmployee];
  const hol = isHoliday(d);

  let groups = empIds.map(eid => {
    const emp = state.employees.find(e=>e.id===eid);

  });

  return `<div class="cal-day-view">
    <div class="day-view-head">
      <div>
        <div class="day-view-date">${d.toLocaleString('en',{weekday:'long', month:'long', day:'numeric'})}</div>

      </div>
      <div class="day-view-summary">

    ${hol ? `<div style="background:var(--kn-yellow);color:#7a5c00;padding:12px 16px;border-radius:var(--r);font-weight:600;margin-bottom:18px;text-align:center">🌙 ${escHtml(hol.name)} · Holiday</div>` : ''}
    <div class="day-view-list">

        ${state.selectedEmployee === 'all' ? `<div style="display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-weight:500"><div class="emp-avatar" style="width:26px;height:26px;font-size:11px;background:${g.emp.color}">${escHtml(initials(g.emp.name))}</div>${escHtml(g.emp.name)} <span style="font-size:11px;color:var(--kn-text-soft);font-family:'IBM Plex Mono',monospace;margin-left:auto">${g.hours.toFixed(1)}h · ${g.weightedHours.toFixed(1)}h weighted</span></div>` : ''}
        ${g.leave ? `<div class="day-list-item" style="border-left-color:var(--kn-green);background:var(--kn-mint-soft)"><div></div><div><div class="day-list-name">${escHtml(g.leave.type)}</div><div class="day-list-client">${escHtml(g.leave.notes||'')}</div></div><div></div><div></div><div class="day-list-actions"><button class="btn btn-ghost" data-rmleave="${g.leave.id}">${ic('trash')}</button></div></div>` : ''}
        ${g.items.map(a => {
          const p = state.projects.find(pp=>pp.id===a.projectId);
          if (!p) return '';
          const color = p.color || colorFor(p.id);
          return `<div class="day-list-item" style="border-left-color:${color}">
            <div class="day-list-code">${escHtml(p.code)}</div>
            <div>
              <div class="day-list-name">${escHtml(p.name)}</div>

            </div>

            <div class="day-list-weight weight-pill-${a.weight<0?'m'+Math.abs(a.weight):a.weight}">${WEIGHT_LABEL[String(a.weight)]}</div>
            <div class="day-list-actions">
              <button class="btn btn-ghost btn-icon" data-edit="${a.id}" title="Edit">${ic('edit')}</button>
              <button class="btn btn-ghost btn-icon" data-rm="${a.id}" title="Delete">${ic('trash')}</button>
            </div>
          </div>`;
        }).join('')}
        ${(g.items.length === 0 && !g.leave && state.selectedEmployee !== 'all') ? `<div class="empty-state" style="padding:30px"><h3>Nothing scheduled</h3><p>Add work or mark leave below.</p></div>` : ''}
      `).join('')}
    </div>
    <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" id="addAssignBtn">${ic('plus')}<span>Add assignment</span></button>
      <button class="btn btn-secondary" id="addLeaveBtn">${ic('palm')}<span>Mark leave / remote</span></button>
    </div>
  </div>`;
}


/* ---------- Calendar interactions ---------- */
function bindCalendarInteractions() {
  // ===== Drag-select range across days =====
  document.querySelectorAll('.cal-day, .cal-week-day').forEach(el => {
    el.addEventListener('mousedown', (e) => {
      // Only left button, only on empty day area (not on a pill or button)
      if (e.button !== 0) return;
      if (e.target.closest('.cal-pill') || e.target.closest('button')) return;
      // Other-month cells in month view → skip
      if (el.classList.contains('other-month')) return;
      const ds = el.dataset.date;
      state.rangeSelect = { isDragging: true, startDate: ds, endDate: ds, justFinished: false };
      document.body.classList.add('range-selecting');
      updateRangeHighlight();
      e.preventDefault();
    });
    el.addEventListener('mouseenter', () => {
      if (!state.rangeSelect.isDragging) return;
      state.rangeSelect.endDate = el.dataset.date;
      updateRangeHighlight();
    });
  });
  // Document-level mouseup ends the selection
  document.addEventListener('mouseup', onRangeMouseUp);

  // Click empty area of day cell
  document.querySelectorAll('.cal-day, .cal-week-day').forEach(el => {
    el.addEventListener('click', async (e) => {
      if (e.target.closest('.cal-pill') || e.target.closest('button')) return;
      const ds = el.dataset.date;

      // Skip if a drag-select just finished (handled by mouseup)
      if (state.rangeSelect && state.rangeSelect.justFinished) {
        state.rangeSelect.justFinished = false;
        return;
      }

      // Select day for paste target
      state.selectedDay = { date: ds };
      state.selectedPills = [];
      // If day was already selected and user clicked again -> open assignment modal
      const lastClick = el.dataset.lastClick ? +el.dataset.lastClick : 0;
      if (Date.now() - lastClick < 350) {
        openAssignmentModal({ date: ds, employeeId: state.selectedEmployee !== 'all' ? state.selectedEmployee : undefined });
        return;
      }
      el.dataset.lastClick = Date.now();
      // Just visually highlight selected day
      document.querySelectorAll('.cal-day, .cal-week-day').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
    });

    // Right-click context menu
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const ds = el.dataset.date;
      state.selectedDay = { date: ds };
      const pill = e.target.closest('.cal-pill[data-aid]');
      showContextMenu(e.pageX, e.pageY, ds, pill ? pill.dataset.aid : null);
    });
  });

  // Pill click → edit  +  shift-click → multi-select
  document.querySelectorAll('.cal-pill[data-aid]').forEach(p => {
    p.addEventListener('click', (e) => {
      e.stopPropagation();
      const aid = p.dataset.aid;
      if (e.shiftKey) {
        if (state.selectedPills.includes(aid)) state.selectedPills = state.selectedPills.filter(x => x !== aid);
        else state.selectedPills.push(aid);
        p.classList.toggle('selected');
        return;
      }
      if (e.altKey || e.ctrlKey || e.metaKey) {
        // alt/cmd click → select only this one
        state.selectedPills = [aid];
        document.querySelectorAll('.cal-pill').forEach(x => x.classList.remove('selected'));
        p.classList.add('selected');
        return;
      }
      const a = state.assignments.find(x => x.id === aid);
      if (a) openAssignmentModal(a);
    });
  });

  // Drag and drop
  document.querySelectorAll('.cal-pill[draggable="true"]').forEach(p => {
    p.addEventListener('dragstart', (e) => {
      state.dragging = { aid: p.dataset.aid, empId: p.dataset.empid };
      p.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copyMove';
    });
    p.addEventListener('dragend', () => { p.classList.remove('dragging'); state.dragging = null; });
  });
  document.querySelectorAll('.cal-day, .cal-week-day').forEach(el => {
    el.addEventListener('dragover', (e) => {
      if (!state.dragging) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = (e.altKey || e.ctrlKey || e.metaKey) ? 'copy' : 'move';
      el.classList.add('drop-target');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drop-target'));
    el.addEventListener('drop', async (e) => {
      e.preventDefault();
      el.classList.remove('drop-target');
      if (!state.dragging) return;
      const newDate = el.dataset.date;
      const a = state.assignments.find(x => x.id === state.dragging.aid);
      if (!a || a.date === newDate) return;
      if (e.altKey || e.ctrlKey || e.metaKey) {
        const copy = { ...a, id: uid(), date: newDate };
        await History.apply(actAddAssignment(copy));
        toast('Copied');
      } else {
        const oldA = { ...a };
        const newA = { ...a, date: newDate };
        await History.apply(actUpdateAssignment(oldA, newA));
        toast('Moved');
      }
      render();
    });
  });

  // Day-view buttons
  const ab = document.getElementById('addAssignBtn');
  if (ab) ab.onclick = () => openAssignmentModal({ date: fmtDate(state.currentDate), employeeId: state.selectedEmployee !== 'all' ? state.selectedEmployee : undefined });
  const lb = document.getElementById('addLeaveBtn');
  if (lb) lb.onclick = () => openLeaveModal({ date: fmtDate(state.currentDate), employeeId: state.selectedEmployee !== 'all' ? state.selectedEmployee : undefined });

  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const a = state.assignments.find(x => x.id === b.dataset.edit);
    if (a) openAssignmentModal(a);
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    const a = state.assignments.find(x => x.id === b.dataset.rm);
    if (!a) return;
    await History.apply(actDeleteAssignment(a));
    render();
  });
  document.querySelectorAll('[data-rmleave]').forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    const l = state.leaves.find(x => x.id === b.dataset.rmleave);
    if (!l) return;
    await History.apply(actDeleteLeave(l));
    render();
  });
}

async function toggleLeaveOnDay(empId, ds) {
  const existing = state.leaves.find(l => l.employeeId === empId && l.date === ds);
  if (existing) {
    await History.apply(actDeleteLeave(existing));
    render();
    return;
  }
  // Remove any existing assignments for that day & employee first
  const conflicts = state.assignments.filter(a => a.employeeId === empId && a.date === ds);
  for (const c of conflicts) await History.apply(actDeleteAssignment(c));
  const leave = { id: uid(), employeeId: empId, date: ds, type: 'Annual Leave', notes: '' };
  await History.apply(actAddLeave(leave));
  render();
}

/* ---------- Drag-select range ---------- */
function updateRangeHighlight() {
  if (!state.rangeSelect.startDate) return;
  const a = state.rangeSelect.startDate, b = state.rangeSelect.endDate || a;
  const from = a < b ? a : b, to = a < b ? b : a;
  document.querySelectorAll('[data-date]').forEach(el => {
    const ds = el.dataset.date;
    if (!ds) return;
    el.classList.toggle('range-selected', ds >= from && ds <= to);
  });
}
function clearRangeHighlight() {
  document.querySelectorAll('.range-selected').forEach(el => el.classList.remove('range-selected'));
  document.body.classList.remove('range-selecting');
}
function onRangeMouseUp() {
  if (!state.rangeSelect.isDragging) return;
  state.rangeSelect.isDragging = false;
  document.body.classList.remove('range-selecting');
  const a = state.rangeSelect.startDate, b = state.rangeSelect.endDate || a;
  if (!a || !b) { clearRangeHighlight(); return; }
  const from = a < b ? a : b, to = a < b ? b : a;
  if (from === to) {
    // Single-cell drag — treat as click; let the click handler fire normally
    clearRangeHighlight();
    return;
  }
  // Multi-day range selected — don't clear yet; mark so click handler skips, then open chooser
  state.rangeSelect.justFinished = true;
  setTimeout(() => { state.rangeSelect.justFinished = false; }, 100);
  openRangeActionModal(from, to);
}

function openRangeActionModal(from, to) {
  // Count days
  const start = parseDate(from), end = parseDate(to);
  let totalDays = 0, workdays = 0;
  const dayList = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
    totalDays++;
    if (!isWeekend(d) && !isHoliday(d)) { workdays++; dayList.push(fmtDate(d)); }
  }
  const empOpts = state.employees.map(e => `<option value="${e.id}" ${e.id===state.selectedEmployee?'selected':''}>${escHtml(e.name)}</option>`).join('');
  const fromLbl = parseDate(from).toLocaleString('en',{weekday:'short',month:'short',day:'numeric'});
  const toLbl = parseDate(to).toLocaleString('en',{weekday:'short',month:'short',day:'numeric'});

  // Pre-compute existing items in range
  const existingInRange = state.assignments.filter(a => dayList.includes(a.date));
  const leavesInRange = state.leaves.filter(l => dayList.includes(l.date));
  const hasExisting = existingInRange.length > 0 || leavesInRange.length > 0;

  const initEmpForPicker = state.selectedEmployee && state.selectedEmployee !== 'all' ? state.selectedEmployee : null;
  const picker = buildProjectPicker(null, { employeeId: initEmpForPicker });

  showModal(`
    <div class="modal-head">
      <div>
        <div class="modal-title">${totalDays} days selected</div>
        <div class="modal-sub">${escHtml(fromLbl)} → ${escHtml(toLbl)} · ${workdays} workday${workdays===1?'':'s'} (weekends/holidays skipped)${hasExisting?` · ${existingInRange.length} assignments + ${leavesInRange.length} leaves in range`:''}</div>
      </div>
      <button class="modal-close" onclick="closeRangeModal()">${ic('x')}</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label">What do you want to do?</label>
        <div style="display:grid;grid-template-columns:repeat(${hasExisting?3:2},1fr);gap:6px">
          <div class="weight-opt active" data-action="leave">
            <div class="v" style="font-family:'IBM Plex Sans',sans-serif;font-size:13px">Mark Leave</div>
            <span class="l">Annual / sick / etc.</span>
          </div>
          <div class="weight-opt" data-action="assign">
            <div class="v" style="font-family:'IBM Plex Sans',sans-serif;font-size:13px">Assign Project</div>
            <span class="l">Same project all days</span>
          </div>
          ${hasExisting?`<div class="weight-opt" data-action="manage">
            <div class="v" style="font-family:'IBM Plex Sans',sans-serif;font-size:13px">Manage Existing</div>
            <span class="l">Edit / delete in range</span>
          </div>`:''}
        </div>
      </div>
      <div id="leaveFields">
        <div class="field"><label class="field-label">Employee</label><select class="field-select" id="raEmp">${empOpts}</select></div>
        <div class="field">
          <label class="field-label">Leave type</label>
          <select class="field-select" id="raType">
            <option>Annual Leave</option>
            <option>Sick Leave</option>
            <option>Remote Work</option>
            <option>Public Holiday Off</option>
            <option>Unpaid Leave</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field"><label class="field-label">Notes (optional)</label><textarea class="field-textarea" id="raNotes"></textarea></div>
      </div>
      <div id="assignFields" style="display:none">
        <div class="field"><label class="field-label">Employee</label><select class="field-select" id="raEmpA">${empOpts}</select></div>
        <div class="field"><label class="field-label">Project</label>${picker.html}</div>
        <div class="field-row">
          <div class="field">
            <label class="field-label">Hours per day</label>
            <input type="number" class="field-input" id="raHours" value="${state.settings.productiveHoursPerDay}" step="0.25" min="0.25" max="24">
            <div class="field-help">Default = realistic capacity</div>
          </div>
          <div class="field">
            <label class="field-label">Effort weight</label>
            <div class="weight-picker" id="raWeight">
              ${[-2,-1,0,1,2].map(w => `<div class="weight-opt ${w===0?'active':''}" data-w="${w}" style="padding:6px 4px"><div class="v" style="font-size:12px">${w>0?'+'+w:w}</div><span class="l" style="font-size:9px">${WEIGHT_LABEL[String(w)]}</span></div>`).join('')}
            </div>
          </div>
        </div>
        <div class="field"><label class="field-label">Notes (optional)</label><textarea class="field-textarea" id="raAssignNotes"></textarea></div>
        <div class="field-help" style="background:var(--kn-warm-soft);padding:10px;border-radius:6px;border-left:3px solid var(--kn-blue)">An assignment will be created for each of the ${workdays} workdays. Weekends and holidays are skipped.</div>
      </div>
      <div id="manageFields" style="display:none">
        <div class="field">
          <label class="field-label">Filter by employee</label>
          <select class="field-select" id="raEmpM"><option value="">All employees</option>${state.employees.map(e=>`<option value="${e.id}">${escHtml(e.name)}</option>`).join('')}</select>
        </div>
        <div id="rangeItemsList" style="max-height:280px;overflow-y:auto;border:1px solid var(--kn-border);border-radius:var(--r);padding:6px"></div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn btn-secondary" id="raMultHrs">Multiply hours…</button>
          <button class="btn btn-secondary" id="raSetHrs">Set all hours…</button>
          <button class="btn btn-secondary" id="raSetWeight">Change weight…</button>
          <button class="btn btn-danger" id="raDelAssigns">Delete all assignments</button>
          <button class="btn btn-danger" id="raDelLeaves">Delete all leaves</button>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeRangeModal()">Cancel</button>
      <button class="btn btn-primary" id="raApply">Apply to ${workdays} day${workdays===1?'':'s'}</button>
    </div>
  `);

  let chosenAction = 'leave';
  let chosenWeight = 0;
  picker.attach(() => {});

  // When the user picks a different employee in the Assign tab, update picker filter
  const raEmpA = document.getElementById('raEmpA');
  if (raEmpA) raEmpA.onchange = () => {
    const pickerRoot = document.getElementById(picker.triggerId);
    if (pickerRoot && pickerRoot.setEmployee) pickerRoot.setEmployee(raEmpA.value);
  };

  const renderManageList = () => {
    const empFilter = document.getElementById('raEmpM').value;
    const filterFn = (item) => !empFilter || item.employeeId === empFilter;
    const visAssigns = existingInRange.filter(filterFn).filter(a => state.assignments.some(x => x.id === a.id));
    const visLeaves = leavesInRange.filter(filterFn).filter(l => state.leaves.some(x => x.id === l.id));
    const items = [
      ...visAssigns.map(a => ({ kind:'a', item: a, sortKey: a.date })),
      ...visLeaves.map(l => ({ kind:'l', item: l, sortKey: l.date }))
    ].sort((x,y) => x.sortKey.localeCompare(y.sortKey));

    document.getElementById('rangeItemsList').innerHTML = items.length === 0 ?
      `<div style="padding:24px;text-align:center;color:var(--kn-text-soft);font-size:13px">No items in selected range${empFilter?' for this employee':''}</div>` :
      items.map(({kind, item}) => {
        const emp = state.employees.find(e => e.id === item.employeeId);
        if (kind === 'a') {
          const p = state.projects.find(pp => pp.id === item.projectId);
          return `<div class="ot-detail-row" style="grid-template-columns:auto auto 1fr auto auto auto">
            <span class="emp-badge" style="background:${emp?.color||'#888'};width:18px;height:18px;font-size:9px">${escHtml(initials(emp?.name||'?'))}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--kn-text-soft)">${escHtml(item.date.slice(5))}</span>
            <div><div style="font-weight:500;font-size:12px" dir="auto">${escHtml(p?.code||'?')} · ${escHtml(p?.name||'(deleted)')}</div></div>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500">${item.hours}h</span>
            <span class="weight-pill-${item.weight<0?'m'+Math.abs(item.weight):item.weight}" style="padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500">${WEIGHT_LABEL[String(item.weight)]}</span>
            <button class="btn btn-ghost btn-icon" data-rmaid="${item.id}">${ic('trash')}</button>
          </div>`;
        } else {
          return `<div class="ot-detail-row" style="grid-template-columns:auto auto 1fr auto auto;background:var(--kn-mint-soft)">
            <span class="emp-badge" style="background:${emp?.color||'#888'};width:18px;height:18px;font-size:9px">${escHtml(initials(emp?.name||'?'))}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--kn-text-soft)">${escHtml(item.date.slice(5))}</span>
            <div style="font-weight:500;font-size:12px;color:var(--kn-green)">${escHtml(item.type)}${item.notes?` · ${escHtml(item.notes)}`:''}</div>
            <span style="font-size:10px;text-transform:uppercase;color:var(--kn-green);letter-spacing:0.06em;font-weight:600">LEAVE</span>
            <button class="btn btn-ghost btn-icon" data-rmlid="${item.id}">${ic('trash')}</button>
          </div>`;
        }
      }).join('');

    // wire delete buttons
    document.querySelectorAll('[data-rmaid]').forEach(b => b.onclick = async () => {
      const a = state.assignments.find(x => x.id === b.dataset.rmaid);
      if (a) { await History.apply(actDeleteAssignment(a)); renderManageList(); }
    });
    document.querySelectorAll('[data-rmlid]').forEach(b => b.onclick = async () => {
      const l = state.leaves.find(x => x.id === b.dataset.rmlid);
      if (l) { await History.apply(actDeleteLeave(l)); renderManageList(); }
    });
  };

  document.querySelectorAll('[data-action]').forEach(opt => opt.onclick = () => {
    document.querySelectorAll('[data-action]').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    chosenAction = opt.dataset.action;
    document.getElementById('leaveFields').style.display = chosenAction === 'leave' ? 'block' : 'none';
    document.getElementById('assignFields').style.display = chosenAction === 'assign' ? 'block' : 'none';
    document.getElementById('manageFields').style.display = chosenAction === 'manage' ? 'block' : 'none';
    document.getElementById('raApply').style.display = chosenAction === 'manage' ? 'none' : 'inline-flex';
    if (chosenAction === 'manage') renderManageList();
  });

  document.querySelectorAll('#raWeight .weight-opt').forEach(opt => opt.onclick = () => {
    document.querySelectorAll('#raWeight .weight-opt').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    chosenWeight = +opt.dataset.w;
  });

  // Manage tab: filter
  if (hasExisting) {
    document.getElementById('raEmpM').onchange = renderManageList;

    document.getElementById('raMultHrs').onclick = async () => {
      const factor = parseFloat(prompt('Multiply hours by (e.g. 0.5 to halve, 2 to double):'));
      if (!factor || factor <= 0) return;
      const empFilter = document.getElementById('raEmpM').value;
      const targets = existingInRange.filter(a => state.assignments.some(x => x.id === a.id)).filter(a => !empFilter || a.employeeId === empFilter);
      for (const a of targets) {
        const newA = { ...a, hours: Math.round(a.hours * factor * 4)/4, locked: true };
        await History.apply(actUpdateAssignment(a, newA));
      }
      toast(`${targets.length} hours updated`,'success');
      renderManageList();
    };
    document.getElementById('raSetHrs').onclick = async () => {
      const val = parseFloat(prompt('Set all hours to:'));
      if (!val || val <= 0) return;
      const empFilter = document.getElementById('raEmpM').value;
      const targets = existingInRange.filter(a => state.assignments.some(x => x.id === a.id)).filter(a => !empFilter || a.employeeId === empFilter);
      for (const a of targets) {
        const newA = { ...a, hours: val, locked: true };
        await History.apply(actUpdateAssignment(a, newA));
      }
      toast(`${targets.length} hours set to ${val}h`,'success');
      renderManageList();
    };
    document.getElementById('raSetWeight').onclick = async () => {
      const val = prompt('Set weight (-2, -1, 0, 1, 2):');
      const w = parseInt(val);
      if (![-2,-1,0,1,2].includes(w)) { toast('Invalid weight','error'); return; }
      const empFilter = document.getElementById('raEmpM').value;
      const targets = existingInRange.filter(a => state.assignments.some(x => x.id === a.id)).filter(a => !empFilter || a.employeeId === empFilter);
      for (const a of targets) {
        const newA = { ...a, weight: w };
        await History.apply(actUpdateAssignment(a, newA));
      }
      toast(`${targets.length} weights changed`,'success');
      renderManageList();
    };
    document.getElementById('raDelAssigns').onclick = async () => {
      const empFilter = document.getElementById('raEmpM').value;
      const targets = existingInRange.filter(a => state.assignments.some(x => x.id === a.id)).filter(a => !empFilter || a.employeeId === empFilter);
      if (targets.length === 0) { toast('Nothing to delete','error'); return; }
      if (!confirm(`Delete ${targets.length} assignment(s) in selected range?`)) return;
      for (const a of targets) await History.apply(actDeleteAssignment(a));
      toast(`${targets.length} assignments deleted`,'success');
      renderManageList();
    };
    document.getElementById('raDelLeaves').onclick = async () => {
      const empFilter = document.getElementById('raEmpM').value;
      const targets = leavesInRange.filter(l => state.leaves.some(x => x.id === l.id)).filter(l => !empFilter || l.employeeId === empFilter);
      if (targets.length === 0) { toast('Nothing to delete','error'); return; }
      if (!confirm(`Delete ${targets.length} leave(s) in selected range?`)) return;
      for (const l of targets) await History.apply(actDeleteLeave(l));
      toast(`${targets.length} leaves deleted`,'success');
      renderManageList();
    };
  }

  document.getElementById('raApply').onclick = async () => {
    if (chosenAction === 'leave') {
      const empId = document.getElementById('raEmp').value;
      if (!empId) { toast('Pick an employee','error'); return; }
      const type = document.getElementById('raType').value;
      const notes = document.getElementById('raNotes').value.trim();
      const newDays = dayList.filter(ds => !state.leaves.find(l => l.employeeId === empId && l.date === ds));
      if (newDays.length === 0) { toast('Already marked','error'); return; }
      // Remove conflicting assignments first (unless Remote Work — those keep work)
      if (type !== 'Remote Work') {
        for (const ds of newDays) {
          const conflicts = state.assignments.filter(a => a.employeeId === empId && a.date === ds);
          for (const c of conflicts) await History.apply(actDeleteAssignment(c));
        }
      }
      const items = newDays.map(ds => ({ id: uid(), employeeId: empId, date: ds, type, notes }));
      await History.apply(actBulkAddLeaves(items));
      toast(`${newDays.length} day${newDays.length>1?'s':''} marked as ${type}`,'success');
    } else if (chosenAction === 'assign') {
      const empId = document.getElementById('raEmpA').value;
      if (!empId) { toast('Pick an employee','error'); return; }
      const projectId = document.querySelector('#assignFields .proj-picker').getValue?.();
      if (!projectId) { toast('Pick a project','error'); return; }
      const hours = +document.getElementById('raHours').value;
      const notes = document.getElementById('raAssignNotes').value.trim();
      if (!hours || hours <= 0) { toast('Enter valid hours','error'); return; }
      // Skip days with deductible leave (but allow remote-work days)
      const validDays = dayList.filter(ds => {
        const leave = state.leaves.find(l => l.employeeId === empId && l.date === ds);
        return !leave || leave.type === 'Remote Work';
      });
      if (validDays.length === 0) { toast('All days have leave already','error'); return; }
      const items = validDays.map(ds => ({ id: uid(), employeeId: empId, projectId, date: ds, hours, weight: chosenWeight, notes, locked: true }));
      await History.apply(actBulkAddAssignments(items));
      toast(`Project assigned to ${validDays.length} day${validDays.length>1?'s':''}`,'success');
    }

    closeRangeModal();
    render();
  };
}

function closeRangeModal() {
  closeModal();
  clearRangeHighlight();
}

/* ---------- Context menu ---------- */
function showContextMenu(x, y, ds, aid) {
  hideContextMenu();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  const dt = parseDate(ds);
  const isWknd = isWeekend(dt), hol = isHoliday(dt);
  const empSelected = state.selectedEmployee !== 'all';
  const isHistorical = false;

  let items = [];
  if (aid) {
    const a = state.assignments.find(x=>x.id===aid);
    items.push({ icon:'edit', label:'Edit assignment', action: () => { hideContextMenu(); openAssignmentModal(a); } });
    items.push({ icon:'copy', label:'Copy', shortcut:'⌘C', action: () => { hideContextMenu(); state.clipboard = { type:'assignments', items:[{...a}] }; toast('Copied'); render(); } });
    items.push({ icon:'copy', label:'Duplicate to next day', action: async () => { hideContextMenu(); const next = new Date(parseDate(a.date)); next.setDate(next.getDate()+1); const copy = { ...a, id: uid(), date: fmtDate(next) }; await History.apply(actAddAssignment(copy)); render(); toast('Duplicated'); } });
    items.push({ sep: true });
    items.push({ icon:'trash', label:'Delete', danger:true, action: async () => { hideContextMenu(); await History.apply(actDeleteAssignment(a)); render(); } });
  } else {
    items.push({ icon:'plus', label:'Add assignment here', action: () => { hideContextMenu(); openAssignmentModal({ date: ds, employeeId: state.selectedEmployee !== 'all' ? state.selectedEmployee : undefined }); } });
    if (state.clipboard && state.clipboard.items.length) {
      items.push({ icon:'paste', label:`Paste ${state.clipboard.items.length} item${state.clipboard.items.length>1?'s':''}`, shortcut:'⌘V', action: async () => { hideContextMenu(); await pasteToDay(ds); } });
    }
    items.push({ sep: true });
    if (empSelected && !isWknd && !hol) {
      const exists = state.leaves.find(l => l.employeeId === state.selectedEmployee && l.date === ds);
      if (exists) {
        items.push({ icon:'palm', label:'Remove leave', action: async () => { hideContextMenu(); await History.apply(actDeleteLeave(exists)); render(); } });
      } else {
        items.push({ icon:'palm', label:'Mark Annual Leave', action: async () => { hideContextMenu(); await markQuickLeave(ds, 'Annual Leave'); } });
        items.push({ icon:'palm', label:'Mark Sick Leave', action: async () => { hideContextMenu(); await markQuickLeave(ds, 'Sick Leave'); } });
        items.push({ icon:'palm', label:'Mark Remote Work', action: async () => { hideContextMenu(); await markQuickLeave(ds, 'Remote Work'); } });
      }
    } else if (!empSelected) {
      items.push({ label:'(Pick an employee to mark leave)', disabled:true });
    }
  }

  menu.innerHTML = items.map(it => {
    if (it.sep) return '<div class="ctx-menu-sep"></div>';
    if (it.disabled) return `<div class="ctx-menu-item" style="opacity:0.5;cursor:default">${escHtml(it.label)}</div>`;
    return `<div class="ctx-menu-item ${it.danger?'danger':''}">${it.icon?ic(it.icon):''}<span>${escHtml(it.label)}</span>${it.shortcut?`<span class="ctx-menu-shortcut">${it.shortcut}</span>`:''}</div>`;
  }).join('');
  // attach handlers
  Array.from(menu.querySelectorAll('.ctx-menu-item')).forEach((el, i) => {
    const it = items.filter(x=>!x.sep)[i];
    if (it && it.action && !it.disabled) el.onclick = it.action;
  });

  document.body.appendChild(menu);
  // position
  const rect = menu.getBoundingClientRect();
  if (x + rect.width > window.innerWidth) x = window.innerWidth - rect.width - 8;
  if (y + rect.height > window.innerHeight) y = window.innerHeight - rect.height - 8;
  menu.style.left = x+'px';
  menu.style.top = y+'px';
  state.contextMenu = menu;
  setTimeout(() => document.addEventListener('click', hideContextMenu, { once: true }), 0);
}
function hideContextMenu() {
  if (state.contextMenu) { state.contextMenu.remove(); state.contextMenu = null; }
}

async function markQuickLeave(ds, type) {
  if (state.selectedEmployee === 'all') { toast('Pick an employee first','error'); return; }
  // Remote Work is a workday flag, not a leave — keep existing assignments
  if (type !== 'Remote Work') {
    const conflicts = state.assignments.filter(a => a.employeeId === state.selectedEmployee && a.date === ds);
    for (const c of conflicts) await History.apply(actDeleteAssignment(c));
  }
  const leave = { id: uid(), employeeId: state.selectedEmployee, date: ds, type, notes: '' };
  await History.apply(actAddLeave(leave));
  toast(`${type} marked`,'success');
  render();
}

async function pasteToDay(ds) {
  if (!state.clipboard || !state.clipboard.items.length) return;
  const newAssigns = state.clipboard.items.map(item => ({
    ...item,
    id: uid(),
    date: ds,
    employeeId: state.selectedEmployee !== 'all' ? state.selectedEmployee : item.employeeId
  }));
  await History.apply(actBulkAddAssignments(newAssigns));
  render();
  toast(`Pasted ${newAssigns.length} item${newAssigns.length>1?'s':''}`,'success');
}

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener('keydown', async (e) => {
  // ignore when typing in an input
  const inField = ['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName) || e.target.isContentEditable;

  // ESC: close modals, cancel range select, deselect
  if (e.key === 'Escape') {
    if (document.querySelector('.modal-backdrop')) { closeModal(); return; }
    if (state.rangeSelect && state.rangeSelect.isDragging) {
      state.rangeSelect.isDragging = false;
      clearRangeHighlight();
      return;
    }
    if (state.lastMovedProjectId) {
      state.lastMovedProjectId = null;
      render();
      return;
    }
    state.selectedPills = [];
    state.selectedDay = null;
    document.querySelectorAll('.selected').forEach(x => x.classList.remove('selected'));
    return;
  }

  if (inField) return;

  const cmd = e.metaKey || e.ctrlKey;

  // Undo/Redo
  if (cmd && e.key === 'z' && !e.shiftKey) { e.preventDefault(); History.undo(); return; }
  if ((cmd && e.key === 'z' && e.shiftKey) || (cmd && e.key === 'y')) { e.preventDefault(); History.redo(); return; }

  // Copy
  if (cmd && e.key === 'c') {
    if (state.selectedPills.length === 0) return;
    const items = state.selectedPills.map(id => state.assignments.find(a => a.id === id)).filter(Boolean);
    if (items.length === 0) return;
    state.clipboard = { type:'assignments', items: items.map(a => ({...a})) };
    toast(`Copied ${items.length} item${items.length>1?'s':''}`,'success');
    e.preventDefault();
    if (state.view === 'calendar') render();
    return;
  }

  // Cut
  if (cmd && e.key === 'x') {
    if (state.selectedPills.length === 0) return;
    const items = state.selectedPills.map(id => state.assignments.find(a => a.id === id)).filter(Boolean);
    if (items.length === 0) return;
    state.clipboard = { type:'assignments', items: items.map(a => ({...a})) };
    for (const a of items) await History.apply(actDeleteAssignment(a));
    state.selectedPills = [];
    toast(`Cut ${items.length} item${items.length>1?'s':''}`,'success');
    e.preventDefault();
    render();
    return;
  }

  // Paste
  if (cmd && e.key === 'v') {
    if (!state.clipboard || !state.clipboard.items.length) { toast('Clipboard empty','error'); return; }
    if (!state.selectedDay) { toast('Click a day first to paste','error'); return; }
    e.preventDefault();
    await pasteToDay(state.selectedDay.date);
    return;
  }

  // Save (Ctrl+S) → export backup
  if (cmd && e.key === 's') {
    e.preventDefault();
    exportFullBackup();
    return;
  }

  // Delete selected pills
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedPills.length > 0) {
    e.preventDefault();
    const items = state.selectedPills.map(id => state.assignments.find(a => a.id === id)).filter(Boolean);
    for (const a of items) await History.apply(actDeleteAssignment(a));
    state.selectedPills = [];
    render();
    return;
  }

  // Arrow keys navigate calendar
  if (state.view === 'calendar') {
    if (e.key === 'ArrowLeft') { e.preventDefault(); calNav(-1); render(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); calNav(1); render(); }
  }
});

function calNav(delta) {
  if (state.calendarView === 'month') {
    state.currentDate = new Date(state.currentDate.getFullYear(), state.currentDate.getMonth()+delta, 1);
  } else if (state.calendarView === 'week') {
    state.currentDate.setDate(state.currentDate.getDate() + 7*delta);
    state.currentDate = new Date(state.currentDate);
  } else {
    state.currentDate.setDate(state.currentDate.getDate() + delta);
    state.currentDate = new Date(state.currentDate);
  }
}

function getFilteredTrackerProjects() {
  // If viewing a snapshot, read frozen projects from there instead of state.projects
  let sourceProjects = state.projects;
  let allInSource = state.projects;  // for parent lookups
  if (state.trackerSnapshotId) {
    const snap = state.snapshots.find(s => s.id === state.trackerSnapshotId);
    if (snap) { sourceProjects = snap.projects; allInSource = snap.projects; }
    else state.trackerSnapshotId = null; // snapshot deleted while viewing
  }
  // Hide closed (those have their own tab in Projects), but keep cancelled visible —
  // they appear at the bottom of the All tab so the year-end count stays visible.
  // Also respect per-project hiddenInTracker flag (not applied to snapshots — they show what was)
  let projs = sourceProjects.filter(p => p.status !== 'closed');
  if (!state.trackerSnapshotId) {
    projs = projs.filter(p => !p.hiddenInTracker);
  }
  const tab = state.trackerFilter.tab || 'all';
  if (tab === 'phase_active') projs = projs.filter(p => p.phase !== 'not_started' && p.phase !== 'complete' && p.status !== 'cancelled');
  else if (tab === 'phase_pre') projs = projs.filter(p => (p.phase === 'pre_design' || p.phase === 'not_started') && p.status !== 'cancelled');
  else if (tab === 'phase_complete') projs = projs.filter(p => (p.phase === 'complete' || p.trackStatus === 'done') && p.status !== 'cancelled');
  else if (tab === 'st_at_risk') projs = projs.filter(p => (p.trackStatus === 'at_risk' || p.trackStatus === 'delayed') && p.status !== 'cancelled');
  else if (tab === 'st_pending') projs = projs.filter(p => (p.trackStatus === 'pending' || p.trackStatus === 'on_hold') && p.status !== 'cancelled');
  else if (tab === 'pri_high') projs = projs.filter(p => p.priority === 'high' && p.status !== 'cancelled');
  // 'all' tab keeps cancelled

  if (state.trackerFilter.employee && state.trackerFilter.employee !== 'all') {
    projs = projs.filter(p => (p.assignedTo || []).includes(state.trackerFilter.employee));
  }

  // Filter passed but a child's parent failed → bring the parent back into the visible set
  // so children always appear under their proper umbrella.
  const visibleIds = new Set(projs.map(p => p.id));
  const parentIdsToInclude = new Set();
  projs.forEach(p => {
    if (p.parentId && !visibleIds.has(p.parentId)) {
      const parent = allInSource.find(x => x.id === p.parentId);
      if (parent) parentIdsToInclude.add(parent.id);
    }
  });
  parentIdsToInclude.forEach(pid => {
    const parent = allInSource.find(x => x.id === pid);
    if (parent) projs.push(parent);
  });

  // Now build the hierarchical sort: top-level projects sorted, with children interleaved beneath
  const cancelledRank = (p) => p.status === 'cancelled' || p.trackStatus === 'cancelled' ? 1 : 0;
  const priOrder = { high: 0, medium: 1, low: 2 };
  const sortFn = (a,b) => {
    const ca = cancelledRank(a), cb = cancelledRank(b);
    if (ca !== cb) return ca - cb;
    const sa = a.sortIndex ?? Number.MAX_SAFE_INTEGER;
    const sb = b.sortIndex ?? Number.MAX_SAFE_INTEGER;
    if (sa !== sb) return sa - sb;
    const pa = priOrder[a.priority||'low'], pb = priOrder[b.priority||'low'];
    if (pa !== pb) return pa - pb;
    if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if (a.dueDate) return -1;
    if (b.dueDate) return 1;
    return (a.code||'').localeCompare(b.code||'', undefined, { numeric: true });
  };

  const topLevel = projs.filter(p => !p.parentId).sort(sortFn);
  const childrenByParent = {};
  projs.forEach(p => {
    if (p.parentId) {
      if (!childrenByParent[p.parentId]) childrenByParent[p.parentId] = [];
      childrenByParent[p.parentId].push(p);
    }
  });
  Object.keys(childrenByParent).forEach(pid => childrenByParent[pid].sort(sortFn));

  // Output: each top-level project followed by its visible children (unless collapsed)
  const ordered = [];
  topLevel.forEach(parent => {
    parent.__hasChildren = !!childrenByParent[parent.id];
    parent.__depth = 0;
    ordered.push(parent);
    if (parent.__hasChildren && !state.collapsedParents.has(parent.id)) {
      childrenByParent[parent.id].forEach(child => {
        child.__depth = 1;
        child.__parent = parent;
        ordered.push(child);
      });
    }
  });

  // Edge case: orphaned children (parent doesn't exist anymore) — show as top-level
  const orphans = projs.filter(p => p.parentId && !state.projects.find(x => x.id === p.parentId));
  orphans.forEach(o => { o.__depth = 0; o.parentId = null; });

  return ordered;
}

  // In reorder mode, the drag column expands wider for an easy hit area
  const dragColWidth = state.trackerReorderMode ? 56 : (W.drag);

  return `<div class="tracker-table-wrap">

          <th>#</th>
          <th data-colkey="pn">PN<span class="col-resizer"></span></th>
          <th data-colkey="project">Project<span class="col-resizer"></span></th>
          <th data-colkey="client">Client<span class="col-resizer"></span></th>
          <th data-colkey="assigned">Assigned<span class="col-resizer"></span></th>
          <th data-colkey="start">Start<span class="col-resizer"></span></th>
          <th data-colkey="due">Due<span class="col-resizer"></span></th>
          <th data-colkey="phase">Phase<span class="col-resizer"></span></th>
          <th data-colkey="progress">Progress<span class="col-resizer"></span></th>
          <th data-colkey="status">Status<span class="col-resizer"></span></th>
          <th data-colkey="priority">Priority<span class="col-resizer"></span></th>
          <th data-colkey="activities">Ongoing activities${showMs ? '<span class="col-resizer"></span>' : ''}</th>
          ${showMs ? '<th data-colkey="milestone">Milestone</th>' : ''}
        </tr>
      </thead>
      <tbody>
        ${projs.map((p, idx) => {
          const tm = typeMeta(p);
          const isDone = p.trackStatus === 'done';
          const isParent = p.__hasChildren;
          const isChild = p.__depth > 0;
          const collapsed = state.collapsedParents.has(p.id);

          // For parents, compute rolled-up display values
          const display = { ...p };
          let isRollup = false;
          if (isParent) {
            const r = rollupParent(p);
            if (r) {
              display.progress = r.progress;
              display.startDate = r.startDate;
              display.dueDate = r.dueDate;
              display.phase = r.phase;
              display.trackStatus = r.trackStatus;
              isRollup = true;
            }
          }

          const rowClasses = [];
          if (highlightDone && isDone) rowClasses.push('row-done');
          if (p.status === 'cancelled' || p.trackStatus === 'cancelled') rowClasses.push('row-cancelled');
          if (state.lastMovedProjectId === p.id) rowClasses.push('row-recently-moved');
          if (isParent) rowClasses.push('row-parent');
          if (isChild) rowClasses.push('row-child');

          // Indentation marker for children
          const indentPx = (p.__depth || 0) * 24;
          const treeMarker = isChild
            ? `<span class="tree-marker" style="width:${indentPx}px"><span class="tree-line">└</span></span>`
            : '';
          const expandToggle = isParent
            ? `<button class="parent-toggle" data-toggleparent="${p.id}" title="${collapsed?'Show':'Hide'} ${getChildProjects(p.id).length} sub-project(s)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:11px;height:11px;transform:rotate(${collapsed?'-90deg':'0deg'});transition:transform 0.15s"><path d="M6 9l6 6 6-6"/></svg>
              </button>`
            : '';

          return `<tr data-pid="${p.id}" class="${rowClasses.join(' ')}">
            <td class="cell-drag" title="${state.trackerReorderMode?'Drag to reorder':''}"><span class="tracker-drag-handle">⋮⋮</span></td>
            <td class="cell-num">${idx+1}</td>
            <td>
              <div style="display:flex;align-items:flex-start;gap:4px;position:relative">
                ${treeMarker}
                ${expandToggle}
                <div style="display:flex;flex-direction:column;gap:3px;flex:1;min-width:0">
                  <span class="cell-pn cell-pn-clickable ${p.status==='cancelled'?'cancelled':''}" data-editproj="${p.id}" title="Click to edit project">${escHtml(p.code)}${isParent?` <span class="parent-badge">${getChildProjects(p.id).length}</span>`:''}</span>
                  <span class="proj-type-badge ${tm.cls}" style="font-size:9px;padding:1px 5px;align-self:flex-start">${tm.label}${isParent?' · Umbrella':''}</span>
                </div>
                <div class="row-action-stack">
                  ${!isChild ? `<button class="row-action-btn" data-addsub="${p.id}" title="Add sub-project under ${escHtml(p.code)}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:11px;height:11px"><path d="M12 5v14M5 12h14"/></svg>
                  </button>` : ''}
                  <button class="row-hide-btn" data-hidefromtrk="${p.id}" title="Hide from tracker (project stays in Projects tab)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:11px;height:11px"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  </button>
                </div>
              </div>
            </td>
            <td><strong style="font-weight:500;font-size:12.5px" dir="auto">${escHtml(p.name)}</strong></td>
            <td style="color:var(--kn-text-soft);font-size:12px" dir="auto">${escHtml(p.client||'—')}</td>
            <td>${renderAssigneeChips(p)}</td>
            <td>${isRollup
              ? `<span class="rollup-display" title="Earliest start across sub-projects (read-only)">${display.startDate?fmtDateShort(display.startDate):'—'}</span>`
              : `<input type="date" class="cell-input" value="${escHtml(p.startDate||'')}" data-fld="startDate">`}</td>
            <td>${isRollup
              ? `<span class="rollup-display" title="Latest due across sub-projects (read-only)">${display.dueDate?fmtDateShort(display.dueDate):'—'}</span>`
              : `<input type="date" class="cell-input" value="${escHtml(p.dueDate||'')}" data-fld="dueDate">`}</td>
            <td>${isRollup ? renderPhasePill(display, true) : renderPhasePill(p)}</td>
            <td>${isRollup ? renderProgressCell(display, true) : renderProgressCell(p)}</td>
            <td>${isRollup ? renderStatusPill(display, true) : renderStatusPill(p)}</td>
            <td>${renderPriorityPill(p)}</td>
            <td class="tracker-cell-text"><textarea data-fld="ongoingActivities" placeholder="What's happening on this project?" dir="auto">${escHtml(p.ongoingActivities||'')}</textarea></td>
            ${showMs ? `<td><input type="text" class="cell-input" value="${escHtml(p.milestone||'')}" data-fld="milestone" placeholder="—" dir="auto"></td>` : ''}
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function fmtDateShort(s) {
  if (!s) return '—';
  try {
    const d = new Date(s);
    return d.toLocaleString('en', { month: 'short', day: 'numeric', year: '2-digit' });
  } catch { return s; }
}

function renderAssigneeChips(p) {
  const list = (p.assignedTo || []).map(eid => {
    const e = state.employees.find(em => em.id === eid);
    if (!e) return '';
    return `<span class="tracker-assignee-chip" style="background:${e.color}">
      ${escHtml(initials(e.name))}
      <span class="x" data-rmasn="${e.id}" title="Remove">×</span>
    </span>`;
  }).join('');
  return `<div class="tracker-assignees">
    ${list}
    <button class="tracker-assignee-add" data-addasn>+ Add</button>
  </div>`;
}

function renderPhasePill(p, readOnly) {
  const ph = PROJECT_PHASES.find(x => x.v === p.phase) || PROJECT_PHASES[0];
  if (readOnly) {
    return `<span class="tracker-pill pill-phase rollup-pill" title="Rolled up from sub-projects" style="background:${ph.color};color:${textColorFor(ph.color)};cursor:default;opacity:0.85">
      ${escHtml(ph.label)}
    </span>`;
  }
  return `<span class="tracker-pill pill-phase" data-popover="phase" style="background:${ph.color};color:${textColorFor(ph.color)}">
    ${escHtml(ph.label)}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </span>`;
}

function renderStatusPill(p, readOnly) {
  const st = TRACK_STATUSES.find(x => x.v === p.trackStatus) || TRACK_STATUSES[0];
  if (readOnly) {
    return `<span class="tracker-pill pill-status rollup-pill" title="Rolled up from sub-projects" style="background:${st.color};color:${textColorFor(st.color)};cursor:default;opacity:0.85">
      ${escHtml(st.label)}
    </span>`;
  }
  return `<span class="tracker-pill pill-status" data-popover="status" style="background:${st.color};color:${textColorFor(st.color)}">
    ${escHtml(st.label)}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
  </span>`;
}

function renderPriorityPill(p, readOnly) {
  const pr = PROJECT_PRIORITIES.find(x => x.v === p.priority) || PROJECT_PRIORITIES[0];
  if (readOnly) {
    return `<span class="tracker-pill pill-priority rollup-pill" title="Rolled up" style="background:${pr.color};color:${textColorFor(pr.color)};cursor:default;opacity:0.85">
      ${escHtml(pr.label)}
    </span>`;
  }
  return `<span class="tracker-pill pill-priority" data-popover="priority" style="background:${pr.color};color:${textColorFor(pr.color)}">

function renderProgressCell(p, readOnly) {
  const pct = Math.max(0, Math.min(100, p.progress || 0));
  if (readOnly) {
    return `<div class="tracker-progress-bar rollup-pill" title="Average across sub-projects" style="cursor:default;opacity:0.85">
      <div class="tracker-progress-fill" style="width:${pct}%"></div>
      <div class="tracker-progress-pct">${pct}%</div>
    </div>`;
  }
  return `<div class="tracker-progress-bar" data-popover="progress" title="Click to edit">
    <div class="tracker-progress-fill" style="width:${pct}%"></div>
    <div class="tracker-progress-pct">${pct}%</div>
  </div>`;
}

function wireTrackerTable() {
  // If viewing a snapshot, the table is read-only — only wire navigation, not editing
  if (state.trackerSnapshotId) {
    // Apply read-only styling
    const wrap = document.querySelector('.tracker-table-wrap');
    if (wrap) wrap.classList.add('snapshot-readonly');
    // Disable all inputs
    document.querySelectorAll('.tracker-table input, .tracker-table textarea').forEach(inp => {
      inp.disabled = true;
      inp.style.cursor = 'not-allowed';
    });
    // Disable popovers and drag
    document.querySelectorAll('.tracker-table [data-popover], .tracker-table [data-addasn], .tracker-table [data-rmasn], .tracker-table .tracker-drag-handle, .tracker-table [data-editproj], .tracker-table [data-addsub], .tracker-table [data-hidefromtrk]').forEach(el => {
      el.style.pointerEvents = 'none';
      el.style.opacity = '0.7';
    });
    // But still allow expand/collapse — that's pure navigation
    document.querySelectorAll('[data-toggleparent]').forEach(btn => btn.onclick = (e) => {
      e.stopPropagation();
      const pid = btn.dataset.toggleparent;
      if (state.collapsedParents.has(pid)) state.collapsedParents.delete(pid);
      else state.collapsedParents.add(pid);
      render();
    });
    return;
  }

  // Inline date / text edits
  document.querySelectorAll('.tracker-table [data-fld]').forEach(inp => {
    inp.onchange = async () => {
      const tr = inp.closest('tr');
      const p = state.projects.find(x => x.id === tr.dataset.pid);
      if (!p) return;
      const fld = inp.dataset.fld;
      const newVal = (fld === 'startDate' || fld === 'dueDate') ? (inp.value || null) : inp.value;
      if (p[fld] === newVal) return;
      const oldP = JSON.parse(JSON.stringify(p));
      p[fld] = newVal;
      await History.apply(actUpdateProject(oldP, JSON.parse(JSON.stringify(p))));
      // No full render — text/date already shown in input
    };
  });

  // Assignee chip remove (rewireRowAssignees handles the same logic; this preserves initial wiring)
  document.querySelectorAll('.tracker-table tbody tr[data-pid]').forEach(tr => rewireRowAssignees(tr));
  document.querySelectorAll('.tracker-table tbody tr[data-pid]').forEach(tr => rewireRowPopovers(tr));

  // Hide-from-tracker button on each row (only active in reorder mode)
  if (state.trackerReorderMode) {
    document.querySelectorAll('[data-hidefromtrk]').forEach(btn => btn.onclick = async (e) => {
      e.stopPropagation();
      const pid = btn.dataset.hidefromtrk;
      const p = state.projects.find(pp => pp.id === pid);
      if (!p) return;
      const oldP = JSON.parse(JSON.stringify(p));
      p.hiddenInTracker = true;
      await History.apply(actUpdateProject(oldP, JSON.parse(JSON.stringify(p))));
      toast(`"${p.name}" hidden from tracker`, 'success');
      render();
    });
    // Add sub-project button — also only available in reorder mode
    document.querySelectorAll('[data-addsub]').forEach(btn => btn.onclick = (e) => {
      e.stopPropagation();
      const pid = btn.dataset.addsub;
      addSubProject(pid);
    });
  }

  // Expand / collapse parents — always active
  document.querySelectorAll('[data-toggleparent]').forEach(btn => btn.onclick = (e) => {
    e.stopPropagation();
    const pid = btn.dataset.toggleparent;
    if (state.collapsedParents.has(pid)) state.collapsedParents.delete(pid);
    else state.collapsedParents.add(pid);
    render();
  });

  // Click PN code → opens project edit modal
  document.querySelectorAll('[data-editproj]').forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    const p = state.projects.find(pp => pp.id === el.dataset.editproj);
    if (p) openProjectModal(p);
  });

  // Row drag-and-drop reordering
  wireTrackerRowDrag();

  // Column resizing
  wireTrackerColumnResize();

  // Click anywhere to dismiss the "just moved" highlight (but not the row itself)
  if (state.lastMovedProjectId) {
    const dismissHandler = (ev) => {
      // If the click is on the highlighted row itself, keep the highlight (you're inspecting it)
      const movedRow = document.querySelector('.tracker-table tbody tr.row-recently-moved');
      if (movedRow && movedRow.contains(ev.target)) return;
      state.lastMovedProjectId = null;
      document.removeEventListener('click', dismissHandler);
      render();
    };
    // Defer attachment so the click that triggered the move doesn't immediately dismiss
    setTimeout(() => document.addEventListener('click', dismissHandler), 50);
  }
}

function wireTrackerRowDrag() {
  // Only enable drag-to-reorder when reorder mode is explicitly on
  if (!state.trackerReorderMode) return;

  const tbody = document.querySelector('.tracker-table tbody');
  if (!tbody) return;
  const tableWrap = document.querySelector('.tracker-table-wrap');

  // Bind to the entire .cell-drag <td> for a huge hit area, not just the handle span
  document.querySelectorAll('.tracker-table tbody td.cell-drag').forEach(cell => {
    cell.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      startTrackerDrag(cell, e, tbody, tableWrap);
    });
  });
}

let _trackerDrag = null;

function startTrackerDrag(handle, e, tbody, tableWrap) {
  const tr = handle.closest('tr');
  if (!tr) return;
  const rows = Array.from(tbody.querySelectorAll('tr[data-pid]'));
  const origIndex = rows.indexOf(tr);
  if (origIndex < 0) return;

  const rect = tr.getBoundingClientRect();
  const rowHeight = rect.height;

  _trackerDrag = {
    tr,
    rows,
    origIndex,
    targetIndex: origIndex,
    rowHeight,
    startClientY: e.clientY,
    handle,
    pointerId: e.pointerId,
    tableWrap,
    autoScrollRAF: null,
    lastClientY: e.clientY,
    scrollOffsetSinceStart: 0
  };

  document.body.classList.add('is-row-dragging');
  tr.classList.add('dragging');
  tr.style.transition = 'none';
  // Apply smooth transitions to all OTHER rows so they slide
  rows.forEach((r, i) => {
    if (i !== origIndex) {
      r.classList.add('drag-shifting');
      r.style.transition = 'transform 180ms cubic-bezier(0.2, 0, 0, 1)';
    }
  });

  try { handle.setPointerCapture(e.pointerId); } catch(_) {}

  const onMove = (ev) => {
    if (!_trackerDrag) return;
    _trackerDrag.lastClientY = ev.clientY;
    const scrollDelta = _trackerDrag.scrollOffsetSinceStart || 0;
    const dy = (ev.clientY - _trackerDrag.startClientY) + scrollDelta;
    // Move dragged row visually
    _trackerDrag.tr.style.transform = `translateY(${dy}px)`;

    // Determine target index based on cursor offset (in row-height steps)
    const offsetSlots = Math.round(dy / _trackerDrag.rowHeight);
    let newIndex = _trackerDrag.origIndex + offsetSlots;
    newIndex = Math.max(0, Math.min(_trackerDrag.rows.length - 1, newIndex));

    if (newIndex !== _trackerDrag.targetIndex) {
      _trackerDrag.targetIndex = newIndex;
      // Apply transforms to other rows to "make space"
      _trackerDrag.rows.forEach((r, i) => {
        if (i === _trackerDrag.origIndex) return;
        let translate = 0;
        if (newIndex < _trackerDrag.origIndex) {
          // Dragging up — rows between newIndex (incl) and origIndex (excl) shift down
          if (i >= newIndex && i < _trackerDrag.origIndex) translate = _trackerDrag.rowHeight;
        } else if (newIndex > _trackerDrag.origIndex) {
          // Dragging down — rows between origIndex (excl) and newIndex (incl) shift up
          if (i <= newIndex && i > _trackerDrag.origIndex) translate = -_trackerDrag.rowHeight;
        }
        r.style.transform = `translateY(${translate}px)`;
      });
    }

    // Auto-scroll near edges of table wrap
    handleAutoScroll();
  };

  const onUp = async (ev) => {
    if (!_trackerDrag) return;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if (_trackerDrag.autoScrollRAF) cancelAnimationFrame(_trackerDrag.autoScrollRAF);

    const { tr, rows, origIndex, targetIndex } = _trackerDrag;
    document.body.classList.remove('is-row-dragging');
    try { _trackerDrag.handle.releasePointerCapture(_trackerDrag.pointerId); } catch(_) {}

    if (origIndex === targetIndex) {
      // No change — animate dragged row back to its home
      tr.style.transition = 'transform 160ms cubic-bezier(0.2, 0, 0, 1)';
      tr.style.transform = '';
      const cleanup = () => {
        tr.classList.remove('dragging');
        tr.style.transition = '';
        rows.forEach(r => {
          r.classList.remove('drag-shifting');
          r.style.transition = '';
          r.style.transform = '';
        });
      };
      setTimeout(cleanup, 170);
      _trackerDrag = null;
      return;
    }

    // Apply the new ordering — re-render will set rows in new positions naturally
    const visiblePids = rows.map(r => r.dataset.pid);
    const draggedPid = visiblePids.splice(origIndex, 1)[0];
    visiblePids.splice(targetIndex, 0, draggedPid);

    // Clear transforms BEFORE re-render so the freshly-rendered rows don't inherit anything
    rows.forEach(r => {
      r.classList.remove('drag-shifting');
      r.style.transition = '';
      r.style.transform = '';
    });
    tr.classList.remove('dragging');

    _trackerDrag = null;
    await applyTrackerOrder(visiblePids, draggedPid);
  };

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

function handleAutoScroll() {
  if (!_trackerDrag || !_trackerDrag.tableWrap) return;
  const wrap = _trackerDrag.tableWrap;
  const rect = wrap.getBoundingClientRect();
  const y = _trackerDrag.lastClientY;
  const edge = 60; // px from each edge to start scrolling

  let speed = 0;
  if (y < rect.top + edge) {
    // Scroll up — speed is proportional to depth into the edge zone, capped
    const depth = (rect.top + edge - y) / edge; // 0..1
    speed = -Math.min(8, depth * 8);
  } else if (y > rect.bottom - edge) {
    const depth = (y - (rect.bottom - edge)) / edge;
    speed = Math.min(8, depth * 8);
  }

  // Cancel any in-flight scroll loop. We restart fresh.
  if (_trackerDrag.autoScrollRAF) {
    cancelAnimationFrame(_trackerDrag.autoScrollRAF);
    _trackerDrag.autoScrollRAF = null;
  }
  if (speed === 0) return;

  // We track *page-coordinate* startY at scroll-time so we can recompute dy each frame
  // against the CURRENT cursor position (which is in viewport coords) and the CURRENT
  // scroll position. This keeps the row glued to the cursor as the table scrolls.
  const tick = () => {
    if (!_trackerDrag) return;
    const wrap = _trackerDrag.tableWrap;
    const beforeScroll = wrap.scrollTop;
    wrap.scrollTop += speed;
    const actualDelta = wrap.scrollTop - beforeScroll;
    if (actualDelta === 0) {
      // Hit the top or bottom of the scroll container — stop scrolling
      _trackerDrag.autoScrollRAF = null;
      return;
    }
    // The cursor is at lastClientY (viewport coords). The row needs to follow.
    // dy is purely (currentClientY - originalStartClientY) PLUS however much we've scrolled.
    _trackerDrag.scrollOffsetSinceStart = (_trackerDrag.scrollOffsetSinceStart || 0) + actualDelta;
    const dy = (_trackerDrag.lastClientY - _trackerDrag.startClientY) + _trackerDrag.scrollOffsetSinceStart;
    _trackerDrag.tr.style.transform = `translateY(${dy}px)`;

    // Re-evaluate target index based on new dy
    const offsetSlots = Math.round(dy / _trackerDrag.rowHeight);
    let newIndex = _trackerDrag.origIndex + offsetSlots;
    newIndex = Math.max(0, Math.min(_trackerDrag.rows.length - 1, newIndex));
    if (newIndex !== _trackerDrag.targetIndex) {
      _trackerDrag.targetIndex = newIndex;
      _trackerDrag.rows.forEach((r, i) => {
        if (i === _trackerDrag.origIndex) return;
        let translate = 0;
        if (newIndex < _trackerDrag.origIndex) {
          if (i >= newIndex && i < _trackerDrag.origIndex) translate = _trackerDrag.rowHeight;
        } else if (newIndex > _trackerDrag.origIndex) {
          if (i <= newIndex && i > _trackerDrag.origIndex) translate = -_trackerDrag.rowHeight;
        }
        r.style.transform = `translateY(${translate}px)`;
      });
    }

    _trackerDrag.autoScrollRAF = requestAnimationFrame(tick);
  };
  _trackerDrag.autoScrollRAF = requestAnimationFrame(tick);
}

async function applyTrackerOrder(visiblePids, movedPid) {
  // visiblePids is the new order of currently-visible rows.
  // We need to update sortIndex on those projects to reflect this order,
  // while leaving non-visible projects' relative order intact.
  const visibleSet = new Set(visiblePids);
  const allSorted = [...state.projects].sort((a,b) => (a.sortIndex ?? 0) - (b.sortIndex ?? 0));
  // Walk through allSorted; whenever we hit a "visible" project, replace it with the next id from visiblePids
  let vi = 0;
  const newOrder = [];
  for (const p of allSorted) {
    if (visibleSet.has(p.id)) {
      const replacementId = visiblePids[vi++];
      const repl = state.projects.find(x => x.id === replacementId);
      if (repl) newOrder.push(repl);
    } else {
      newOrder.push(p);
    }
  }
  // Reassign sortIndex
  for (let i = 0; i < newOrder.length; i++) {
    newOrder[i].sortIndex = (i + 1) * 10;
    await DB.put('projects', newOrder[i]);
  }
  markSaved();

  // Mark this as the recently-moved row — sticky until user clicks or presses Esc
  state.lastMovedProjectId = movedPid || null;

  // Capture scroll position BEFORE re-rendering so we can restore it
  const wrap = document.querySelector('.tracker-table-wrap');
  const savedScroll = wrap ? wrap.scrollTop : 0;
  render();

  // After render, scroll position is reset by browser. Restore it then ensure moved row is visible.
  setTimeout(() => {
    const newWrap = document.querySelector('.tracker-table-wrap');
    if (newWrap) newWrap.scrollTop = savedScroll;
    if (movedPid) {
      const tr = document.querySelector(`.tracker-table tbody tr[data-pid="${movedPid}"]`);
      if (tr && newWrap) {
        const trRect = tr.getBoundingClientRect();
        const wrapRect = newWrap.getBoundingClientRect();
        const fullyVisible = trRect.top >= wrapRect.top && trRect.bottom <= wrapRect.bottom;
        if (!fullyVisible) {
          tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    }
  }, 50);
}

function wireTrackerColumnResize() {
  const table = document.querySelector('.tracker-table');
  if (!table) return;
  document.querySelectorAll('.tracker-table th .col-resizer').forEach(rz => {
    rz.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const th = rz.closest('th');
      const colKey = th.dataset.colkey;
      if (!colKey) return;
      const col = table.querySelector(`colgroup col[data-colkey="${colKey}"]`);
      if (!col) return;
      rz.classList.add('resizing');
      const startX = e.clientX;
      const startWidth = col.offsetWidth || parseInt(col.style.width) || 100;
      const onMove = (ev) => {
        const newW = Math.max(60, startWidth + (ev.clientX - startX));
        col.style.width = newW + 'px';
      };
      const onUp = async () => {
        rz.classList.remove('resizing');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        // Persist
        const finalW = parseInt(col.style.width);
        if (!state.settings.trackerColumnWidths) state.settings.trackerColumnWidths = {};
        state.settings.trackerColumnWidths[colKey] = finalW;
        await saveSettings();
        markSaved();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

  pop.querySelectorAll('[data-pick]').forEach(it => it.onclick = async (e) => {
    e.stopPropagation();
    const newVal = it.dataset.pick;
    const oldP = JSON.parse(JSON.stringify(p));
    p[field] = newVal;
    // Keep lifecycle status in sync if track status is "cancelled"
    let needFullRender = false;
    if (field === 'trackStatus' && newVal === 'cancelled') { p.status = 'cancelled'; needFullRender = true; }
    if (field === 'trackStatus' && newVal === 'done') { p.status = 'closed'; needFullRender = true; }
    if (field === 'trackStatus' && oldP.trackStatus === 'cancelled' && newVal !== 'cancelled') { p.status = 'active'; needFullRender = true; }
    if (field === 'trackStatus' && oldP.trackStatus === 'done' && newVal !== 'done') { p.status = 'active'; needFullRender = true; }
    if (field === 'phase' && newVal === 'complete') p.progress = 100;
    await History.apply(actUpdateProject(oldP, JSON.parse(JSON.stringify(p))));
    closeAllPopovers();
    if (needFullRender) {
      render();
    } else {
      // Surgical update: replace just the affected cell + the row's "done"/"cancelled" highlight class
      updateTrackerCellInPlace(p, field);
      // Also refresh the progress cell if phase was set to complete
      if (field === 'phase' && newVal === 'complete') updateTrackerCellInPlace(p, 'progress');
    }
  });
  setTimeout(() => document.addEventListener('click', closeAllPopovers, { once: true }), 0);
}

// Update a single cell in the tracker without re-rendering the whole table
function updateTrackerCellInPlace(p, field) {
  const tr = document.querySelector(`.tracker-table tbody tr[data-pid="${p.id}"]`);
  if (!tr) return;
  // Update done/cancelled row highlight
  tr.classList.toggle('row-done', state.settings.trackerHighlightDone !== false && p.trackStatus === 'done');
  tr.classList.toggle('row-cancelled', p.status === 'cancelled' || p.trackStatus === 'cancelled');

  if (field === 'phase') {
    const cell = tr.children[8]; // 0=drag, 1=#, 2=PN, 3=name, 4=client, 5=assigned, 6=start, 7=due, 8=phase
    if (cell) cell.innerHTML = renderPhasePill(p);
    rewireRowPopovers(tr);
  } else if (field === 'trackStatus') {
    const cell = tr.children[10];
    if (cell) cell.innerHTML = renderStatusPill(p);
    rewireRowPopovers(tr);
  } else if (field === 'priority') {
    const cell = tr.children[11];
    if (cell) cell.innerHTML = renderPriorityPill(p);
    rewireRowPopovers(tr);
  } else if (field === 'progress') {
    const cell = tr.children[9];
    if (cell) cell.innerHTML = renderProgressCell(p);
    rewireRowPopovers(tr);
  } else if (field === 'assignedTo') {
    const cell = tr.children[5];
    if (cell) cell.innerHTML = renderAssigneeChips(p);
    rewireRowAssignees(tr);
  }
}

function rewireRowPopovers(tr) {

function positionPopover(pop, anchor) {
  const rect = anchor.getBoundingClientRect();
  const popH = pop.offsetHeight;
  const popW = pop.offsetWidth;
  let top = rect.bottom + window.scrollY + 4;
  let left = rect.left + window.scrollX;
  if (top + popH > window.innerHeight + window.scrollY) top = rect.top + window.scrollY - popH - 4;
  if (left + popW > window.innerWidth) left = window.innerWidth - popW - 12;
  pop.style.top = top + 'px';
  pop.style.left = left + 'px';
  pop.style.position = 'absolute';
}

function closeAllPopovers() {
