/* ---------- Gantt chart ---------- */
function renderGanttChart() {
  const projs = getFilteredTrackerProjects();
  if (projs.length === 0) return `<div class="empty-state"><h3>No projects to chart</h3><p>Add projects with start and due dates to see them here.</p></div>`;

  // Establish timeline range — auto-fit to data, padded by 14 days each side
  const now = new Date();
  let earliest = new Date(now); earliest.setDate(earliest.getDate() - 7);
  let latest = new Date(now); latest.setDate(latest.getDate() + 60);
  projs.forEach(p => {
    if (p.startDate) { const d = parseDate(p.startDate); if (d < earliest) earliest = d; }
    if (p.dueDate) { const d = parseDate(p.dueDate); if (d > latest) latest = d; }
  });
  // Round to start of week
  earliest.setDate(earliest.getDate() - earliest.getDay());
  latest.setDate(latest.getDate() + (6 - latest.getDay()));
  // Pad
  earliest.setDate(earliest.getDate() - 7);
  latest.setDate(latest.getDate() + 7);

  const dayMs = 86400000;
  const totalDays = Math.round((latest - earliest) / dayMs) + 1;
  const dayPx = 24;
  const timelineW = totalDays * dayPx;

  // Build day cells + month bands
  const days = [];
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(earliest); d.setDate(earliest.getDate() + i);
    days.push(d);
  }
  // Group days by month for header
  const monthGroups = [];
  days.forEach(d => {
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const last = monthGroups[monthGroups.length - 1];
    if (last && last.key === key) last.count++;
    else monthGroups.push({ key, count: 1, dt: new Date(d) });
  });

  const todayStr = fmtDate(now);
  const todayIdx = days.findIndex(d => fmtDate(d) === todayStr);
  const todayLeft = todayIdx >= 0 ? todayIdx * dayPx + dayPx/2 : -999;

  return `<div class="gantt-wrap">
    <div class="gantt-scroll" id="ganttScroll">
      <div class="gantt-grid" style="grid-template-columns:280px ${timelineW}px;width:${280 + timelineW}px">
        <div class="gantt-info-col">
          <div class="gantt-info-cell header">Project</div>
          ${projs.map(p => `
            <div class="gantt-info-cell" data-gpid="${p.id}" title="Click to edit">
              <span class="gp-status" style="background:${trackStatusColor(p.trackStatus)}"></span>
              <span class="gp-code">${escHtml(p.code)}</span>
              <span class="gp-name">${escHtml(p.name)}</span>
            </div>
          `).join('')}
        </div>
        <div class="gantt-timeline" style="width:${timelineW}px;position:relative">
          <div class="gantt-timeline-header">
            <div class="gantt-month-row">
              ${monthGroups.map(mg => `<div class="gantt-month-cell" style="width:${mg.count * dayPx}px;flex-shrink:0">${mg.dt.toLocaleString('en',{month:'long',year:'numeric'})}</div>`).join('')}
            </div>
            <div class="gantt-day-row">
              ${days.map(d => {
                const wknd = WEEKEND_DAYS.includes(d.getDay());
                const isTd = fmtDate(d) === todayStr;
                return `<div class="gantt-day-cell ${wknd?'weekend':''} ${isTd?'today':''}">
                  <div class="dn">${d.toLocaleString('en',{weekday:'narrow'})}</div>
                  <div class="dd">${d.getDate()}</div>
                </div>`;
              }).join('')}
            </div>
          </div>
          ${projs.map(p => {
            const cells = days.map(d => {
              const wknd = WEEKEND_DAYS.includes(d.getDay());
              const isTd = fmtDate(d) === todayStr;
              return `<div class="gantt-cell ${wknd?'weekend':''} ${isTd?'today':''}"></div>`;
            }).join('');

            let bar = '';
            if (p.startDate && p.dueDate) {
              const sd = parseDate(p.startDate);
              const ed = parseDate(p.dueDate);
              const sIdx = Math.max(0, Math.round((sd - earliest) / dayMs));
              const eIdx = Math.min(totalDays - 1, Math.round((ed - earliest) / dayMs));
              const left = sIdx * dayPx;
              const width = Math.max(dayPx, (eIdx - sIdx + 1) * dayPx);
              const phColor = phaseColor(p.phase);
              const pct = Math.max(0, Math.min(100, p.progress || 0));
              bar = `<div class="gantt-bar" data-gbpid="${p.id}" style="left:${left}px;width:${width}px;background:${phColor}" title="${escHtml(p.code)} · ${escHtml(p.name)} — ${escHtml(p.startDate)} → ${escHtml(p.dueDate)} · ${pct}%">
                <div class="gantt-bar-progress" style="width:${pct}%"></div>
                <span class="gantt-bar-label">${pct}% · ${escHtml(phaseLabel(p.phase))}</span>
              </div>`;
            } else {
              bar = `<div class="gantt-no-dates" data-gbpid="${p.id}" style="left:${dayPx*2}px;width:200px" title="Click to set dates">No dates set — click to add</div>`;
            }

            return `<div class="gantt-row" style="position:relative;width:${timelineW}px">${cells}${bar}</div>`;
          }).join('')}
          ${todayLeft >= 0 ? `<div class="gantt-today-line" style="left:${todayLeft}px"></div>` : ''}
        </div>
      </div>
    </div>
    <div class="gantt-legend">
      ${PROJECT_PHASES.map(ph => `<div class="gantt-legend-item"><div class="gantt-legend-swatch" style="background:${ph.color}"></div>${escHtml(ph.label)}</div>`).join('')}
    </div>
  </div>`;
}

function wireGantt() {
  // Auto-scroll Gantt so today's line is visible (a few cells from left)
  const scroll = document.getElementById('ganttScroll');
  if (scroll) {
    const todayLine = scroll.querySelector('.gantt-today-line');
    if (todayLine) {
      const scrollLeft = parseFloat(todayLine.style.left) - 200;
      scroll.scrollLeft = Math.max(0, scrollLeft);
    }

  // Click bar or info cell to open modal
  document.querySelectorAll('[data-gbpid], [data-gpid]').forEach(el => el.onclick = () => {
    const id = el.dataset.gbpid || el.dataset.gpid;
    const p = state.projects.find(x => x.id === id);
    if (p) openProjectModal(p);

}

async function addSubProject(parentId) {
  const parent = state.projects.find(p => p.id === parentId);
  if (!parent) return;
  // Auto-generate next sub-code
  const subCode = nextSubProjectCode(parent.code);
  const newP = {
    id: uid(),
    code: subCode,
    name: '',
    client: parent.client || '',
    type: parent.type,
    status: 'active',
    color: parent.color, // inherit visual identity
    parentId: parent.id,
    assignedTo: [],
    startDate: null,
    dueDate: null,
    phase: 'not_started',
    progress: 0,
    trackStatus: 'on_track',
    priority: parent.priority || 'low',
    ongoingActivities: '',
    milestone: ''
  };
  ensureTrackerFields(newP);
  // Place sub-project right after its parent in sort order
  const allChildren = getChildProjects(parent.id);
  const lastChildIdx = allChildren.length > 0
    ? Math.max(...allChildren.map(c => c.sortIndex || 0))
    : (parent.sortIndex || 0);
  newP.sortIndex = lastChildIdx + 1;
  state.projects.push(newP);
  await DB.put('projects', newP);
  markSaved();
  // Make sure parent is expanded so user sees the new child
  state.collapsedParents.delete(parent.id);
  // Highlight the new sub-project
  state.lastMovedProjectId = newP.id;
  render();
  // Then open it for editing
  setTimeout(() => openProjectModal(newP), 100);
}

    toast(`${ids.length} project${ids.length>1?'s':''} restored to tracker`, 'success');
    // Mark the first restored project as "just moved" for the persistent highlight
    state.lastMovedProjectId = ids[0] || null;
    render();
    // Scroll the first restored row into view
    setTimeout(() => {
      if (ids[0]) {
        const tr = document.querySelector(`.tracker-table tbody tr[data-pid="${ids[0]}"]`);
        if (tr) tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }, 100);
  };
}

async function exportStatusReport() {

  if (typeof XLSX === 'undefined') { toast('XLSX not loaded','error'); return; }

  XLSX.writeFile(wb, fname);
  toast(`Saved ${fname}`,'success');
}


/* ---------- Tracker Import: parse Excel + show preview + apply ---------- */
function excelSerialToISO(serial) {
  if (serial === null || serial === undefined || serial === '' || serial === '-') return null;
  if (typeof serial === 'string') {
    // already a date string?
    const m = serial.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    const n = parseFloat(serial);
    if (isNaN(n)) return null;
    serial = n;
  }
  if (serial instanceof Date) return fmtDate(serial);
  if (typeof serial !== 'number' || serial < 1) return null;
  // Excel epoch (with the 1900 leap year bug — adjust by subtracting 1 if > 60)
  const utcDays = Math.floor(serial - 25569);
  const dt = new Date(utcDays * 86400 * 1000);
  return fmtDate(dt);
}

function normalizeProjectCode(raw) {
  if (!raw) return '';
  return String(raw).trim().replace(/\s+/g, '').toUpperCase();
}

function inferProjectType(code) {
  const c = normalizeProjectCode(code);
  if (c.startsWith('PR')) return 'proposal';
  if (c.startsWith('KN-IN') || c.startsWith('KNIN')) return 'internal';
  if (c.startsWith('KN')) return 'project';
  return 'project';
}

function mapPhase(raw) {
  const v = String(raw||'').trim().toLowerCase();
  if (!v) return 'not_started';
  if (v.includes('not started')) return 'not_started';
  if (v.includes('pre-design') || v.includes('pre design')) return 'pre_design';
  if (v.includes('concept')) return 'concept';
  if (v.includes('schematic')) return 'schematic';
  if (v.includes('detailed')) return 'detailed';
  if (v.includes('design development') || v.includes('design dev')) return 'design_dev';
  if (v.includes('procurement')) return 'procurement';
  if (v.includes('construction')) return 'construction';
  if (v.includes('complete')) return 'complete';
  return 'not_started';
}

function mapTrackStatus(raw) {
  const v = String(raw||'').trim().toLowerCase();
  if (!v) return 'on_track';
  if (v.includes('on track')) return 'on_track';
  if (v.includes('pending')) return 'pending';
  if (v.includes('delayed')) return 'delayed';
  if (v.includes('on hold')) return 'on_hold';
  if (v.includes('at risk')) return 'at_risk';
  if (v.includes('done')) return 'done';
  if (v.includes('cancelled') || v.includes('canceled')) return 'cancelled';
  return 'on_track';
}

function mapPriority(raw) {
  const v = String(raw||'').trim().toLowerCase();
  if (v.includes('high')) return 'high';
  if (v.includes('medium') || v.includes('med')) return 'medium';
  if (v.includes('low')) return 'low';
  return 'low';
}

function matchEmployeeIds(assignedToStr) {
  if (!assignedToStr) return [];
  // Split on commas (Latin or Arabic) or "and"
  const names = String(assignedToStr).split(/[,،]|\sand\s/i).map(n => n.trim()).filter(Boolean);
  const ids = [];
  names.forEach(name => {
    const norm = name.toLowerCase().replace(/\s+/g, '');
    const found = state.employees.find(e => {
      const en = e.name.toLowerCase().replace(/\s+/g,'');
      return en === norm || en.startsWith(norm) || norm.startsWith(en.split(/\s/)[0].toLowerCase());
    });
    if (found && !ids.includes(found.id)) ids.push(found.id);
  });
  return ids;
}

async function parseTrackerExcel(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { cellDates: true, cellNF: false });
  return wb;
}

function extractProjectsFromSheet(wb, sheetName) {
  const ws = wb.Sheets[sheetName];
  if (!ws) return [];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
  // Find header row — look for a row containing "PN" and "Project" and "Phase"
  let headerIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const r = rows[i] || [];
    const joined = r.map(c => String(c||'').toLowerCase()).join('|');
    if (joined.includes('pn') && joined.includes('project') && joined.includes('phase')) {
      headerIdx = i; break;
    }
  }
  if (headerIdx < 0) return [];
  const header = rows[headerIdx].map(c => String(c||'').trim().toLowerCase());
  const colIdx = (label, alts = []) => {
    const candidates = [label, ...alts].map(s => s.toLowerCase());
    for (const c of candidates) {
      const idx = header.findIndex(h => h === c);
      if (idx >= 0) return idx;
    }
    // fuzzy
    for (const c of candidates) {
      const idx = header.findIndex(h => h.includes(c));
      if (idx >= 0) return idx;
    }
    return -1;
  };
  const cols = {
    pn: colIdx('pn'),
    project: colIdx('project'),
    client: colIdx('client / partner', ['client','partner','client/partner']),
    assigned: colIdx('assigned to', ['assigned']),
    start: colIdx('start date', ['start']),
    due: colIdx('due date', ['due']),
    phase: colIdx('phase'),
    progress: colIdx('progress'),
    status: colIdx('status'),
    priority: colIdx('project priority', ['priority']),
    activities: colIdx('ongoing activities', ['activities']),
    milestone: colIdx('milestone')
  };

  const projects = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r) continue;
    const code = r[cols.pn];
    const name = r[cols.project];
    if (!code && !name) continue;
    if (String(code||'').toLowerCase().includes('all')) continue; // Skip "All" footer row
    if (!name || String(name).trim() === '') continue;

    projects.push({
      sourceRow: i + 1,
      rawCode: code != null ? String(code).trim() : '',
      code: normalizeProjectCode(code),
      name: String(name).trim(),
      client: cols.client >= 0 && r[cols.client] != null ? String(r[cols.client]).trim() : '',
      assignedToRaw: cols.assigned >= 0 && r[cols.assigned] != null ? String(r[cols.assigned]).trim() : '',
      startDate: excelSerialToISO(r[cols.start]),
      dueDate: excelSerialToISO(r[cols.due]),
      phaseRaw: cols.phase >= 0 ? r[cols.phase] : null,
      phase: mapPhase(r[cols.phase]),
      progress: (() => {
        const p = r[cols.progress];
        if (p == null || p === '') return 0;
        const n = parseFloat(p);
        if (isNaN(n)) return 0;
        return n <= 1 ? Math.round(n * 100) : Math.round(n);
      })(),
      statusRaw: cols.status >= 0 ? r[cols.status] : null,
      trackStatus: mapTrackStatus(r[cols.status]),
      priorityRaw: cols.priority >= 0 ? r[cols.priority] : null,
      priority: mapPriority(r[cols.priority]),
      ongoingActivities: cols.activities >= 0 && r[cols.activities] != null ? String(r[cols.activities]).trim() : '',
      milestone: cols.milestone >= 0 && r[cols.milestone] != null ? String(r[cols.milestone]).trim() : ''
    });
  }
  return projects;
}

          </div>

    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="impApply" disabled>Import</button>
    </div>
  `);

  let chosenMode = 'merge';
  document.querySelectorAll('[data-impmode]').forEach(o => o.onclick = () => {
    document.querySelectorAll('[data-impmode]').forEach(x => x.classList.remove('active'));
    o.classList.add('active');
    chosenMode = o.dataset.impmode;
    refreshWarn();
  });

    const warn = document.getElementById('impWarn');
    if (chosenMode === 'replace' && trackerImportState.parsed.length > 0) {
      warn.style.display = 'block';
      warn.textContent = `⚠ Replace mode will delete all ${state.projects.length} existing projects and import ${trackerImportState.parsed.length} new ones. Existing time assignments will keep their project IDs but those IDs may no longer exist — assignments to deleted projects become orphaned. Use Smart merge instead unless you really want a clean slate.`;
    } else {
      warn.style.display = 'none';
    }
  };

  document.getElementById('impFile').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    trackerImportState.file = file;
    try {
      const wb = await parseTrackerExcel(file);
      trackerImportState.wb = wb;
      const sheets = wb.SheetNames;
      const sheetSel = document.getElementById('impSheet');
      sheetSel.innerHTML = sheets.map(s => `<option value="${escHtml(s)}">${escHtml(s)}</option>`).join('');
      // Auto-pick "Current Week" if present
      const live = sheets.find(s => /current\s*week/i.test(s) || /live/i.test(s));
      if (live) sheetSel.value = live;
      document.getElementById('impSheetWrap').style.display = 'block';
      sheetSel.onchange = () => loadSheet(sheetSel.value);
      loadSheet(sheetSel.value);
    } catch (err) {
      toast('Could not read file: ' + err.message,'error');

    trackerImportState.sheetName = sheetName;
    const projs = extractProjectsFromSheet(trackerImportState.wb, sheetName);

      document.getElementById('impSummary').innerHTML = `<div style="background:var(--kn-amber-soft);color:var(--kn-amber);padding:10px;border-radius:6px;font-size:12px">No projects found on "${escHtml(sheetName)}". The expected header row has columns PN, Project, Client / Partner, Assigned To, Start Date, Due Date, Phase, Progress, Status…</div>`;
      document.getElementById('impPreview').style.display = 'none';
      document.getElementById('impMode').style.display = 'none';
      document.getElementById('impApply').disabled = true;
      return;
    }
    // Match against existing projects
    const existingByCode = new Map();
    state.projects.forEach(p => {
      const c = normalizeProjectCode(p.code);
      if (!existingByCode.has(c)) existingByCode.set(c, []);
      existingByCode.get(c).push(p);
    });
    let willUpdate = 0, willAdd = 0;
    const previewRows = projs.map((p, idx) => {
      const matched = existingByCode.get(p.code) || [];
      const existing = matched.find(ex => ex.name && p.name && ex.name.trim().toLowerCase() === p.name.trim().toLowerCase()) || matched[0];
      const action = existing ? 'update' : 'add';
      if (action === 'update') willUpdate++; else willAdd++;
      const empIds = matchEmployeeIds(p.assignedToRaw);
      const empNames = empIds.map(eid => state.employees.find(e=>e.id===eid)?.name).filter(Boolean).join(', ') ||
        (p.assignedToRaw ? `<span style="color:var(--kn-red)">${escHtml(p.assignedToRaw)} ?</span>` : '<span style="color:var(--kn-text-faint)">—</span>');
      return `<div style="display:grid;grid-template-columns:30px 60px 1fr 110px 90px 80px 80px 70px;gap:6px;padding:6px 10px;border-bottom:1px solid var(--kn-border);font-size:11.5px;align-items:center">
        <span style="color:var(--kn-text-faint);font-family:'IBM Plex Mono',monospace;font-size:10px">${idx+1}</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--kn-blue);font-size:10.5px">${escHtml(p.rawCode)}</span>
        <span style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" dir="auto" title="${escHtml(p.name)}">${escHtml(p.name)}</span>
        <span style="color:var(--kn-text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px">${empNames}</span>
        <span style="font-size:10px">${escHtml(p.phaseRaw||'')}</span>
        <span style="font-size:10px">${escHtml(p.statusRaw||'')}</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px">${p.progress}%</span>
        <span style="font-size:10px;font-weight:600;color:${action==='update'?'var(--kn-amber)':'var(--kn-green)'};text-transform:uppercase;letter-spacing:0.05em">${action}</span>
      </div>`;
    }).join('');

    document.getElementById('impSummary').style.display = 'block';
    document.getElementById('impSummary').innerHTML = `<div style="background:var(--kn-blue-tint);padding:10px 12px;border-radius:6px;font-size:12px;border-left:3px solid var(--kn-blue);color:var(--kn-blue);font-weight:500">Found <strong>${projs.length}</strong> projects on "${escHtml(sheetName)}" — <span style="color:var(--kn-amber)">${willUpdate} will update</span> · <span style="color:var(--kn-green)">${willAdd} will be added</span></div>`;
    document.getElementById('impPreview').style.display = 'block';
    document.getElementById('impPreview').innerHTML = `
      <div style="display:grid;grid-template-columns:30px 60px 1fr 110px 90px 80px 80px 70px;gap:6px;padding:8px 10px;background:var(--kn-warm-soft);font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--kn-text-soft);font-weight:600;border-bottom:1px solid var(--kn-border)">
        <span>#</span><span>Code</span><span>Project</span><span>Assigned</span><span>Phase</span><span>Status</span><span>Prog</span><span>Action</span>
      </div>
      ${previewRows}
    `;
    document.getElementById('impMode').style.display = 'block';
    document.getElementById('impApply').disabled = false;
    refreshWarn();
  };

  document.getElementById('impApply').onclick = async () => {
    const projs = trackerImportState.parsed;
    if (projs.length === 0) return;

    let updated = 0, added = 0, deleted = 0;

    if (chosenMode === 'replace') {
      // Wipe all existing projects (assignments stay but become orphaned by ID — user warned)
      const existing = [...state.projects];
      for (const p of existing) {
        await DB.del('projects', p.id);
        deleted++;
      }
      state.projects = [];
    }

    const existingByCode = new Map();
    state.projects.forEach(p => {
      const c = normalizeProjectCode(p.code);
      if (!existingByCode.has(c)) existingByCode.set(c, []);
      existingByCode.get(c).push(p);
    });

    // Compute starting sortIndex — preserves the order from the spreadsheet
    let nextSortIdx = 0;
    if (chosenMode === 'replace') {
      nextSortIdx = 10;
    } else {
      // Continue from the highest existing index
      const maxExisting = state.projects.reduce((m,p) => Math.max(m, p.sortIndex || 0), 0);
      nextSortIdx = maxExisting + 10;
    }

    for (let pIdx = 0; pIdx < projs.length; pIdx++) {
      const ip = projs[pIdx];
      const matched = existingByCode.get(ip.code) || [];
      const existing = matched.find(ex => ex.name && ip.name && ex.name.trim().toLowerCase() === ip.name.trim().toLowerCase()) || matched[0];

      if (existing && chosenMode !== 'add') {
        // Update existing in place
        existing.client = ip.client || existing.client;
        existing.assignedTo = matchEmployeeIds(ip.assignedToRaw);
        existing.startDate = ip.startDate || existing.startDate;
        existing.dueDate = ip.dueDate || existing.dueDate;
        existing.phase = ip.phase;
        existing.progress = ip.progress;
        existing.trackStatus = ip.trackStatus;
        existing.priority = ip.priority;
        existing.ongoingActivities = ip.ongoingActivities || existing.ongoingActivities;
        existing.milestone = ip.milestone || existing.milestone;
        // Update sortIndex on replace mode to preserve sheet order
        if (chosenMode === 'replace') existing.sortIndex = nextSortIdx + (pIdx * 10);
        // Sync lifecycle
        if (ip.trackStatus === 'cancelled') existing.status = 'cancelled';
        else if (ip.trackStatus === 'done') existing.status = 'closed';
        else existing.status = 'active';
        ensureTrackerFields(existing);
        await DB.put('projects', existing);
        updated++;
      } else if (!existing) {
        // Add new
        const newP = {
          id: uid(),
          code: ip.rawCode || ip.code || nextProjectCode(inferProjectType(ip.code)),
          name: ip.name,
          client: ip.client,
          type: inferProjectType(ip.code),
          status: ip.trackStatus === 'cancelled' ? 'cancelled' : ip.trackStatus === 'done' ? 'closed' : 'active',
          color: PALETTE[(state.projects.length + added) % PALETTE.length],
          assignedTo: matchEmployeeIds(ip.assignedToRaw),
          startDate: ip.startDate,
          dueDate: ip.dueDate,
          phase: ip.phase,
          progress: ip.progress,
          trackStatus: ip.trackStatus,
          priority: ip.priority,
          ongoingActivities: ip.ongoingActivities,
          milestone: ip.milestone,
          sortIndex: nextSortIdx + (pIdx * 10)
        };
        ensureTrackerFields(newP);
        state.projects.push(newP);
        await DB.put('projects', newP);
        added++;
      }
    }

    markSaved();
    closeModal();
    render();
    const msg = chosenMode === 'replace'
      ? `Replaced: ${deleted} removed · ${added} imported`
      : `${updated} updated · ${added} added`;
    toast(msg, 'success');
  };
}


/* ---------- Weekly Snapshots ---------- */
function defaultSnapshotLabel() {
  const wk = getCurrentWeekLabel();
  const sun = wk.start, thu = wk.end;
  const fmtMo = (d) => d.toLocaleString('en', { month: 'short' });
  const sameMonth = sun.getMonth() === thu.getMonth();
  if (sameMonth) {
    return `WK${String(wk.weekNum).padStart(2,'0')}_${sun.getDate()}-${thu.getDate()}${fmtMo(thu)}`;
  } else {
    return `WK${String(wk.weekNum).padStart(2,'0')}_${sun.getDate()}${fmtMo(sun)}-${thu.getDate()}${fmtMo(thu)}`;
  }
}

  showModal(`

  setTimeout(() => document.getElementById('snapLabel').focus(), 50);
  document.getElementById('snapSaveBtn').onclick = async () => {
    const label = document.getElementById('snapLabel').value.trim();
    if (!label) { toast('Please enter a label','error'); return; }

    // Find existing snapshot with same label (to overwrite)
    const dupe = state.snapshots.find(s => s.weekLabel === label);
    const id = dupe ? dupe.id : uid();

    const snapshot = {
      id,
      weekLabel: label,
      savedAt: Date.now(),
      // Deep clone projects so future edits don't mutate the snapshot
      projects: JSON.parse(JSON.stringify(state.projects))
    };

    if (dupe) {
      const i = state.snapshots.findIndex(s => s.id === dupe.id);
      state.snapshots[i] = snapshot;
    } else {
      state.snapshots.push(snapshot);
    }
    await DB.put('snapshots', snapshot);
    markSaved();
    closeModal();
    toast(`Snapshot "${label}" saved`,'success');
    render();
  };
}

async function deleteSnapshot(snapshotId) {
  const snap = state.snapshots.find(s => s.id === snapshotId);
  if (!snap) return;
  if (!confirm(`Delete snapshot "${snap.weekLabel}"? This cannot be undone.`)) return;
  state.snapshots = state.snapshots.filter(s => s.id !== snapshotId);
  await DB.del('snapshots', snapshotId);
  if (state.trackerSnapshotId === snapshotId) state.trackerSnapshotId = null;
  markSaved();
  toast('Snapshot deleted','success');
  render();
}

function manageSnapshots() {
  if (state.snapshots.length === 0) {
    toast('No snapshots saved yet','error');
    return;
  }
  const sorted = [...state.snapshots].sort((a,b) => b.savedAt - a.savedAt);
  showModal(`
    <div class="modal-head">

function getCurrentWeekLabel() {
  // Find the ISO week + a "WK## · Mon DD – Mon DD" string for the current date
  const now = new Date();
  const day = now.getDay();
  // Saudi week starts Sunday
  const sunday = new Date(now); sunday.setDate(now.getDate() - day);
  const thursday = new Date(sunday); thursday.setDate(sunday.getDate() + 4);
  // ISO week number (rough — based on day of year / 7)
  const start = new Date(sunday.getFullYear(), 0, 1);
  const weekNum = Math.ceil((((sunday - start) / 86400000) + start.getDay() + 1) / 7);
  const fmtShort = (d) => d.toLocaleString('en', { month: 'short', day: 'numeric' });
  return {
    weekNum,
    label: `WK${String(weekNum).padStart(2,'0')} · ${fmtShort(sunday)} – ${fmtShort(thursday)}`,
    start: sunday,
    end: thursday
  };
}

/* ---------- Render: Projects ---------- */
function renderProjects() {
  document.getElementById('topActions').innerHTML = `
    <button class="btn btn-secondary" id="exportBtn">${ic('download')}<span>Save backup</span></button>
    <button class="btn btn-primary" id="addProj">${ic('plus')}<span>New project</span></button>
  `;
  document.getElementById('addProj').onclick = () => openProjectModal();
  document.getElementById('exportBtn').onclick = () => exportFullBackup();

  const filterMap = { all:'All', project:'Awarded (KN)', proposal:'Proposals (PR)', internal:'Internal (KN-IN)', closed:'Closed', cancelled:'Cancelled' };
  const filtered = state.projects.filter(p => {
    // Tab filter
    if (state.projectFilter === 'closed' && p.status !== 'closed') return false;
    if (state.projectFilter === 'cancelled' && p.status !== 'cancelled') return false;
    if (state.projectFilter !== 'closed' && state.projectFilter !== 'cancelled') {
      // Type-based tabs (all/project/proposal/internal) hide closed and cancelled
      if (p.status === 'closed' || p.status === 'cancelled') return false;
      if (state.projectFilter !== 'all' && p.type !== state.projectFilter) return false;
    }
    // Search filter — applies to every tab
    if (state.searchTerm) {
      const t = state.searchTerm.toLowerCase();
      return p.name.toLowerCase().includes(t) || p.code.toLowerCase().includes(t) || (p.client||'').toLowerCase().includes(t);
    }
    return true;
  }).sort((a,b) => a.code.localeCompare(b.code, undefined, { numeric: true }));

  // Clean up any selected projects no longer in filter
  const filteredIds = new Set(filtered.map(p => p.id));
  state.selectedProjects = state.selectedProjects.filter(id => state.projects.find(p => p.id === id));
  const visibleSelected = state.selectedProjects.filter(id => filteredIds.has(id));
  const allFilteredSelected = filtered.length > 0 && visibleSelected.length === filtered.length;
  const someFilteredSelected = visibleSelected.length > 0 && !allFilteredSelected;

  // Bulk action bar
  const bulkBar = state.selectedProjects.length > 0 ? `
    <div class="bulk-bar">
      <span class="bulk-bar-count">${state.selectedProjects.length} project${state.selectedProjects.length>1?'s':''} selected</span>
      <div style="flex:1"></div>
      <button id="bulkClose">Mark Closed</button>
      <button id="bulkCancelled">Mark Cancelled</button>
      <button id="bulkOpen">Mark Active</button>
      <button id="bulkType">Change Type…</button>
      <button class="danger" id="bulkDelete">${ic('trash')}<span>Delete</span></button>
      <button id="bulkClear">Clear</button>
    </div>
  ` : '';

  document.getElementById('content').innerHTML = `
    <div class="list-toolbar">
      <input type="text" class="search-input" placeholder="Search projects, codes, clients…" value="${escHtml(state.searchTerm)}" id="searchProj">
      <div class="filter-tabs">
        ${Object.entries(filterMap).map(([k,v]) => `<button class="${state.projectFilter===k?'active':''}" data-f="${k}">${v}</button>`).join('')}
      </div>
      <div style="margin-left:auto;font-size:12px;color:var(--kn-text-soft)">${filtered.length} project${filtered.length===1?'':'s'}${state.selectedProjects.length>0?` · ${state.selectedProjects.length} selected`:''}</div>
    </div>
    ${bulkBar}
    <div class="data-table">
      ${filtered.length === 0 ? `<div class="empty-state"><h3>No projects yet</h3><p>${state.searchTerm ? 'Try a different search.' : 'Click "New project" to add one.'}</p></div>` : `
      <table>
        <thead>
          <tr>
            <th style="width:40px;text-align:center"><input type="checkbox" class="row-checkbox" id="selectAll" ${allFilteredSelected?'checked':''} ${someFilteredSelected?'data-indeterminate="1"':''}></th>
            <th style="width:30px"></th>
            <th style="width:100px">Ref. #</th>
            <th style="width:80px">Type</th>
            <th>Name</th>
            <th style="width:140px">Client</th>
            <th style="width:90px">Status</th>
            <th style="width:110px;text-align:right">${monthName(state.currentDate)} hrs</th>
            <th style="width:80px"></th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(p => {
            const y = state.currentDate.getFullYear(), m = state.currentDate.getMonth();
            const monthHrs = state.assignments.filter(a => a.projectId === p.id && a.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).reduce((s,a)=>s+a.hours,0);
            const typeLabel = p.type === 'project' ? 'KN' : p.type === 'proposal' ? 'PR' : 'IN';
            const isSelected = state.selectedProjects.includes(p.id);
            return `<tr class="${isSelected?'row-selected':''}">
              <td style="text-align:center"><input type="checkbox" class="row-checkbox" data-projsel="${p.id}" ${isSelected?'checked':''}></td>
              <td><span class="color-swatch" style="background:${p.color}"></span></td>
              <td><span class="row-code">${escHtml(p.code)}</span></td>
              <td><span class="proj-type-badge type-${typeLabel}">${typeLabel}</span></td>
              <td><strong style="font-weight:500" dir="auto">${escHtml(p.name)}</strong></td>
              <td style="color:var(--kn-text-soft)" dir="auto">${escHtml(p.client||'—')}</td>
              <td><span class="status-badge status-${p.status||'active'}">${p.status||'active'}</span></td>
              <td style="text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:500">${monthHrs.toFixed(1)}h</td>
              <td><div class="row-actions"><button class="btn btn-ghost btn-icon" data-edit="${p.id}">${ic('edit')}</button><button class="btn btn-ghost btn-icon" data-rm="${p.id}">${ic('trash')}</button></div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>
  `;

  // Indeterminate state
  const allCb = document.getElementById('selectAll');
  if (allCb && allCb.dataset.indeterminate) allCb.indeterminate = true;

  const searchInput = document.getElementById('searchProj');
  if (searchInput) {
    searchInput.oninput = (e) => {
      const cursorPos = e.target.selectionStart;
      state.searchTerm = e.target.value;
      render();
      // After re-render the input is a new DOM node — refocus it and restore cursor
      const fresh = document.getElementById('searchProj');
      if (fresh) {
        fresh.focus();
        try { fresh.setSelectionRange(cursorPos, cursorPos); } catch(_) {}
      }
    };
  }
  document.querySelectorAll('.filter-tabs button').forEach(b => b.onclick = () => { state.projectFilter = b.dataset.f; render(); });

  // Select all
  if (allCb) allCb.onchange = () => {
    if (allCb.checked) {
      filtered.forEach(p => { if (!state.selectedProjects.includes(p.id)) state.selectedProjects.push(p.id); });
    } else {
      const filteredIds = filtered.map(p => p.id);
      state.selectedProjects = state.selectedProjects.filter(id => !filteredIds.includes(id));
    }
    render();
  };

  // Per-row checkbox
  document.querySelectorAll('[data-projsel]').forEach(cb => cb.onchange = () => {
    const id = cb.dataset.projsel;
    if (cb.checked) {
      if (!state.selectedProjects.includes(id)) state.selectedProjects.push(id);
    } else {
      state.selectedProjects = state.selectedProjects.filter(x => x !== id);
    }
    render();
  });

  // Bulk actions
  const cb = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  cb('bulkClose', async () => {
    if (!confirm(`Mark ${state.selectedProjects.length} project(s) as Closed?`)) return;
    for (const id of state.selectedProjects) {
      const p = state.projects.find(x => x.id === id);
      if (p) { p.status = 'closed'; await DB.put('projects', p); }
    }
    markSaved();
    toast(`${state.selectedProjects.length} project(s) closed`,'success');
    state.selectedProjects = [];
    render();
  });
  cb('bulkCancelled', async () => {
    if (!confirm(`Mark ${state.selectedProjects.length} project(s) as Cancelled?`)) return;
    for (const id of state.selectedProjects) {
      const p = state.projects.find(x => x.id === id);
      if (p) { p.status = 'cancelled'; await DB.put('projects', p); }
    }
    markSaved();
    toast(`${state.selectedProjects.length} project(s) cancelled`,'success');
    state.selectedProjects = [];
    render();
  });
  cb('bulkOpen', async () => {
    if (!confirm(`Mark ${state.selectedProjects.length} project(s) as Active?`)) return;
    for (const id of state.selectedProjects) {
      const p = state.projects.find(x => x.id === id);
      if (p) { p.status = 'active'; await DB.put('projects', p); }
    }
    markSaved();
    toast(`${state.selectedProjects.length} project(s) reopened`,'success');
    state.selectedProjects = [];
    render();
  });
  cb('bulkType', () => openBulkTypeModal());
  cb('bulkDelete', async () => {
    const ids = [...state.selectedProjects];
    const totalAssigns = ids.reduce((s,id) => s + state.assignments.filter(a => a.projectId === id).length, 0);
    const msg = totalAssigns > 0
      ? `Delete ${ids.length} project(s) AND their ${totalAssigns} assignments? This cannot be undone.`
      : `Delete ${ids.length} project(s)? This cannot be undone.`;
    if (!confirm(msg)) return;
    if (!confirm('Are you sure?')) return;
    for (const id of ids) {
      const linked = state.assignments.filter(a => a.projectId === id);
      state.assignments = state.assignments.filter(a => a.projectId !== id);
      for (const a of linked) await DB.del('assignments', a.id);
      state.projects = state.projects.filter(x => x.id !== id);
      await DB.del('projects', id);
    }
    markSaved();
    toast(`${ids.length} project(s) deleted`,'success');
    state.selectedProjects = [];
    render();
  });
  cb('bulkClear', () => { state.selectedProjects = []; render(); });

  // Per-row edit / delete
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const p = state.projects.find(x => x.id === b.dataset.edit);
    if (p) openProjectModal(p);
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    const p = state.projects.find(x => x.id === b.dataset.rm);
    if (!p) return;
    const usage = state.assignments.filter(a => a.projectId === p.id).length;
    if (usage > 0) {
      if (!confirm(`This project has ${usage} assignments. Delete project AND all its assignments?`)) return;
      const linked = state.assignments.filter(a => a.projectId === p.id);
      state.assignments = state.assignments.filter(a => a.projectId !== p.id);
      for (const a of linked) await DB.del('assignments', a.id);
    } else {
      if (!confirm(`Delete project "${p.name}"?`)) return;
    }
    state.projects = state.projects.filter(x => x.id !== p.id);
    await DB.del('projects', p.id);
    markSaved();
    toast('Project deleted','success');
    render();
  });
}

function openBulkTypeModal() {
  const count = state.selectedProjects.length;
  showModal(`
    <div class="modal-head">
      <div>
        <div class="modal-title">Change type</div>
        <div class="modal-sub">Apply to ${count} project${count>1?'s':''}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">${ic('x')}</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label">New type</label>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
          ${[
            {v:'project',l:'Awarded',c:'KN'},
            {v:'proposal',l:'Proposal',c:'PR'},
            {v:'internal',l:'Internal',c:'KN-IN'}
          ].map(t => `<div class="weight-opt" data-bt="${t.v}"><div class="v" style="font-size:13px;font-family:'IBM Plex Sans',sans-serif">${t.l}</div><span class="l">prefix: ${t.c}</span></div>`).join('')}
        </div>
      </div>
      <div class="field-help" style="background:var(--kn-warm-soft);padding:10px;border-radius:6px;border-left:3px solid var(--kn-blue)">Note: changing type does NOT rename project codes. Edit individual codes if needed.</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="btApply" disabled>Apply</button>
    </div>
  `);
  let chosen = null;
  document.querySelectorAll('[data-bt]').forEach(o => o.onclick = () => {
    document.querySelectorAll('[data-bt]').forEach(x => x.classList.remove('active'));
    o.classList.add('active');
    chosen = o.dataset.bt;
    document.getElementById('btApply').disabled = false;
  });
  document.getElementById('btApply').onclick = async () => {
    if (!chosen) return;
    for (const id of state.selectedProjects) {
      const p = state.projects.find(x => x.id === id);
      if (p) { p.type = chosen; await DB.put('projects', p); }
    }
    markSaved();
    toast(`Type changed for ${state.selectedProjects.length} project(s)`,'success');
    state.selectedProjects = [];
    closeModal();
    render();
  };
}

/* ---------- Render: Reports ---------- */
function renderReports() {
  document.getElementById('topActions').innerHTML = `
    ${topbarMonthPicker()}
    <button class="btn btn-secondary" id="exportBtn">${ic('download')}<span>Export Excel</span></button>
  `;
  bindMonthPicker();
  document.getElementById('exportBtn').onclick = () => exportTimesheet();

  const y = state.currentDate.getFullYear(), m = state.currentDate.getMonth();
  const monthKey = `${y}-${String(m+1).padStart(2,'0')}`;
  const cap = state.settings.productiveHoursPerDay;

  const rows = [];
  state.employees.forEach(e => {
    const empAssigns = state.assignments.filter(a => a.employeeId === e.id && a.date.startsWith(monthKey));
    const grouped = {};
    empAssigns.forEach(a => {
      if (!grouped[a.projectId]) grouped[a.projectId] = { hours:0, weighted:0 };
      grouped[a.projectId].hours += a.hours;
      grouped[a.projectId].weighted += a.hours * (WEIGHT_MULTIPLIER[String(a.weight)] ?? 1);
    });
    Object.entries(grouped).forEach(([pid, g]) => {
      const p = state.projects.find(pp=>pp.id===pid);
      if (p) rows.push({ emp: e, project: p, hours: g.hours, weighted: g.weighted });
    });
  });
  rows.sort((a,b) => a.emp.name.localeCompare(b.emp.name) || b.weighted - a.weighted);
  const byCat = { project: [], proposal: [], internal: [] };
  rows.forEach(r => byCat[r.project.type].push(r));

  const renderTable = (title, items, badge) => `
    <div class="dash-section">
      <div class="section-head">
        <div>
          <div class="section-title">${title}</div>
          <div class="section-sub">${items.length} ${items.length === 1 ? 'entry' : 'entries'} this month</div>
        </div>
        <div class="proj-type-badge type-${badge}">${badge}</div>
      </div>
      ${items.length === 0 ? '<div style="color:var(--kn-text-soft);font-size:13px">No entries.</div>' : `
      <table>
        <thead>
          <tr>
            <th style="width:30px"></th>
            <th style="width:100px">Ref. #</th>
            <th>Project</th>
            <th>Employee</th>
            <th style="width:120px;text-align:right">Hours</th>
            <th style="width:120px;text-align:right">Weighted</th>
            <th style="width:90px;text-align:right">Load %</th>
          </tr>
        </thead>
        <tbody>
          ${items.map(r => {
            // capacity = working days × 6.5 (per individual employee, leave already deducted from their personal cap)
            const empCap = monthLoadForEmployee(r.emp.id, y, m).capacity;
            const loadPct = empCap ? (r.weighted / empCap * 100) : 0;
            return `<tr>
              <td><span class="color-swatch" style="background:${r.project.color}"></span></td>
              <td><span class="row-code">${escHtml(r.project.code)}</span></td>
              <td><strong style="font-weight:500" dir="auto">${escHtml(r.project.name)}</strong><br><span style="font-size:11px;color:var(--kn-text-soft)">${escHtml(r.project.client||'—')}</span></td>
              <td>${escHtml(r.emp.name)}</td>
              <td style="text-align:right;font-family:'IBM Plex Mono',monospace">${r.hours.toFixed(1)}</td>
              <td style="text-align:right;font-family:'IBM Plex Mono',monospace">${r.weighted.toFixed(1)}</td>
              <td style="text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:500">${loadPct.toFixed(1)}%</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>
  `;

  const teamCap = state.employees.reduce((s,e) => s + monthLoadForEmployee(e.id, y, m).capacity, 0);

  document.getElementById('content').innerHTML = `
    <div class="cal-toolbar">
      <div class="cal-month-label">${monthName(state.currentDate)} report</div>
      <div style="flex:1"></div>

    if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  // Highlight tab on scroll using IntersectionObserver
  const stabBtns = document.querySelectorAll('.settings-tabs button[data-stab]');
  if (stabBtns.length && 'IntersectionObserver' in window) {
    const sectionEls = Array.from(document.querySelectorAll('[data-section]'));
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const key = e.target.dataset.section;
          stabBtns.forEach(b => b.classList.toggle('active', b.dataset.stab === key));
        }
      });
    }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });

      const hex = document.querySelector(`[data-hmc-hex="${k}"]`);
      if (hex) hex.textContent = input.value;
      applyHeatmapColors();
    };
    input.onchange = async () => {
      // Persist on commit
      await saveSettings();
      markSaved();
    };
  });
  const resetBtn = document.getElementById('resetHmColors');
  if (resetBtn) resetBtn.onclick = async () => {
    if (!confirm('Reset all heatmap and status colors to defaults?')) return;
    state.settings.heatmapColors = null;
    await saveSettings();
    applyHeatmapColors();
    render();
    toast('Colors reset','success');
  };

  // Tracker settings handlers
  const setTrkMs = document.getElementById('setTrkMs');
  if (setTrkMs) setTrkMs.onchange = async (e) => {
    state.settings.trackerShowMilestone = e.target.checked;
    await saveSettings();
    render();
  };
  const setTrkDone = document.getElementById('setTrkDone');
  if (setTrkDone) setTrkDone.onchange = async (e) => {
    state.settings.trackerHighlightDone = e.target.checked;
    await saveSettings();
    render();
  };
  const resetCols = document.getElementById('resetTrkCols');
  if (resetCols) resetCols.onclick = async () => {
    if (!confirm('Reset column widths to defaults?')) return;
    state.settings.trackerColumnWidths = null;
    await saveSettings();
    toast('Column widths reset','success');
    render();
  };
  const resetOrder = document.getElementById('resetTrkOrder');
  if (resetOrder) resetOrder.onclick = async () => {
    if (!confirm('Clear manual row ordering? Tracker will fall back to priority + due date sorting.')) return;
    for (const p of state.projects) {
      delete p.sortIndex;
      await DB.put('projects', p);
    }
    markSaved();
    toast('Row order cleared','success');
    render();
  };

  document.getElementById('addHol').onclick = async () => {
    const today = fmtDate(new Date());
    state.holidays.push({ name: 'New holiday', startDate: today, endDate: today });
    await saveHolidays();
    render();
  };
  document.getElementById('resetHol').onclick = async () => {
    if (!confirm('Reset to default 2026 Saudi holidays? This replaces your current list.')) return;
    state.holidays = JSON.parse(JSON.stringify(DEFAULT_HOLIDAYS));
    await saveHolidays();
    render();
  };
  document.querySelectorAll('[data-holstart]').forEach(inp => {
    inp.onchange = async () => {
      const i = +inp.dataset.holstart;
      state.holidays[i].startDate = inp.value;
      // If end is now before start, push end to match
      if (state.holidays[i].endDate < state.holidays[i].startDate) state.holidays[i].endDate = state.holidays[i].startDate;
      state.holidays.sort((a,b) => a.startDate.localeCompare(b.startDate));
      await saveHolidays();
      render();
    };
  });
  document.querySelectorAll('[data-holend]').forEach(inp => {
    inp.onchange = async () => {
      const i = +inp.dataset.holend;
      state.holidays[i].endDate = inp.value;
      // If end before start, push start back
      if (state.holidays[i].endDate < state.holidays[i].startDate) state.holidays[i].startDate = state.holidays[i].endDate;
      state.holidays.sort((a,b) => a.startDate.localeCompare(b.startDate));
      await saveHolidays();
      render();
    };
  });
  document.querySelectorAll('[data-holname]').forEach(inp => {
    inp.onchange = async () => {
      const i = +inp.dataset.holname;
      state.holidays[i].name = inp.value;
      await saveHolidays();
    };
  });
  document.querySelectorAll('[data-rmhol]').forEach(b => b.onclick = async () => {
    if (!confirm('Remove this holiday?')) return;
    state.holidays.splice(+b.dataset.rmhol, 1);
    await saveHolidays();
    render();
  });

  document.getElementById('savePin').onclick = async () => {
    const pin = document.getElementById('newPin').value.trim();
    if (pin.length < 4) { toast('PIN must be at least 4 characters','error'); return; }
    state.settings.pinHash = await sha256(pin);
    await saveSettings();
    toast('PIN saved','success');
    render();
  };
  const rm = document.getElementById('rmPin');
  if (rm) rm.onclick = async () => {
    if (!confirm('Remove PIN protection?')) return;
    state.settings.pinHash = null;
    await saveSettings();
    toast('PIN removed','success');
    render();
  };

  document.getElementById('wipeAll').onclick = async () => {
    if (!confirm('Wipe ALL data? This cannot be undone. Make sure you exported a backup first.')) return;
    if (!confirm('Are you absolutely sure?')) return;
    await Promise.all(['employees','projects','assignments','leaves','settings','snapshots'].map(s => DB.clear(s)));
    location.reload();
  };
}

async function saveSettings() { await DB.put('settings', { key:'app', value: state.settings }); markSaved(); }
async function saveHolidays() { await DB.put('settings', { key:'holidays', value: state.holidays }); markSaved(); }


/* ---------- Modals ---------- */
function showModal(html) {
  closeModal();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `<div class="modal">${html}</div>`;
  backdrop.onclick = (e) => { if (e.target === backdrop) closeModal(); };
  document.body.appendChild(backdrop);
}
function closeModal() {
  document.querySelectorAll('.modal-backdrop').forEach(m => m.remove());
}

/* ---------- Searchable project picker (used in assignment modals) ---------- */
function buildProjectPicker(currentId, opts = {}) {
  // opts.employeeId — if passed, projects assigned to that employee surface in their own section first
  const allProjects = state.projects.filter(p => p.status === 'active' || p.id === currentId)
    .sort((a,b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
  const grouped = {
    project: allProjects.filter(p => p.type === 'project'),
    proposal: allProjects.filter(p => p.type === 'proposal'),
    internal: allProjects.filter(p => p.type === 'internal')
  };
  const selected = state.projects.find(p => p.id === currentId);
  const triggerId = 'pp_' + uid();
  let curEmpId = opts.employeeId || null; // mutable so external code can update it

  const html = `
    <div class="proj-picker" id="${triggerId}">
      <button class="proj-picker-trigger" type="button">
        ${selected ? `<span class="swatch" style="background:${selected.color}"></span>
          <span class="text"><span class="row-code">${escHtml(selected.code)}</span> · ${escHtml(selected.client||'—')} · ${escHtml(selected.name)}</span>` :
          `<span class="text placeholder">Pick a project…</span>`}
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="proj-picker-panel" style="display:none">
        <input type="text" class="proj-picker-search" placeholder="Search by code, client, or name…">
        <div class="proj-picker-list"></div>
      </div>
    </div>
  `;

  const attach = (onChange) => {
    const root = document.getElementById(triggerId);
    if (!root) return;
    const trigger = root.querySelector('.proj-picker-trigger');
    const panel = root.querySelector('.proj-picker-panel');
    const search = root.querySelector('.proj-picker-search');
    const list = root.querySelector('.proj-picker-list');
    let curId = currentId;
    let term = '';
    let showAll = false; // whether to expand "All other projects" section

    const renderList = () => {
      const t = term.toLowerCase();
      const matchTerm = (p) => !t || p.name.toLowerCase().includes(t) || p.code.toLowerCase().includes(t) || (p.client||'').toLowerCase().includes(t);

      let sections = [];

      // If an employee is selected, surface their assigned projects FIRST as a primary section
      if (curEmpId) {
        const emp = state.employees.find(e => e.id === curEmpId);
        const assignedProjs = allProjects.filter(p => (p.assignedTo || []).includes(curEmpId)).filter(matchTerm);
        if (assignedProjs.length > 0) {
          sections.push({
            label: `${emp?.name || 'Employee'}'s projects`,
            cls: 'type-mine',
            items: assignedProjs,
            primary: true
          });
        }
      }

      // Standard sections (filter out items already shown in the "mine" section)
      const shownIds = new Set(sections.flatMap(s => s.items.map(p => p.id)));
      const stdSections = [
        { key: 'project', label: 'Awarded (KN)', cls: 'type-KN' },
        { key: 'proposal', label: 'Proposals (PR)', cls: 'type-PR' },
        { key: 'internal', label: 'Internal (KN-IN)', cls: 'type-IN' }
      ];
      stdSections.forEach(sm => {
        const items = grouped[sm.key].filter(p => !shownIds.has(p.id)).filter(matchTerm);
        if (items.length > 0) sections.push({ label: sm.label, cls: sm.cls, items, primary: false });
      });

      if (sections.length === 0) {
        list.innerHTML = `<div class="proj-picker-empty">No projects match "${escHtml(term)}"</div>`;
        return;
      }

      // If we have a primary "mine" section and the user hasn't expanded yet (and not searching), collapse the rest under a toggle
      const hasPrimary = sections.some(s => s.primary);
      const showCollapse = hasPrimary && !showAll && !term;

      list.innerHTML = sections.map((sec, idx) => {
        if (showCollapse && !sec.primary) return '';
        return `<div class="proj-picker-section">
          <div class="proj-picker-section-head ${sec.cls}">${escHtml(sec.label)}<span class="count">${sec.items.length}</span></div>
          ${sec.items.map(p => `<button class="proj-picker-item ${p.id===curId?'active':''}" type="button" data-pid="${p.id}">
            <span class="swatch" style="background:${p.color}"></span>
            <span class="code">${escHtml(p.code)}</span>
            <span class="client" title="${escHtml(p.client||'')}">${escHtml(p.client||'—')}</span>
            <span class="name">${escHtml(p.name)}</span>
          </button>`).join('')}
        </div>`;
      }).join('') + (showCollapse ? `<button class="proj-picker-item" id="ppShowAll" style="margin-top:6px;justify-content:center;color:var(--kn-text-soft);font-style:italic;border-top:1px dashed var(--kn-border);border-radius:0;padding-top:10px">Show all other projects…</button>` : '');

      list.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => {
        curId = b.dataset.pid;
        const p = state.projects.find(x => x.id === curId);
        if (p) {
          trigger.innerHTML = `<span class="swatch" style="background:${p.color}"></span>
            <span class="text"><span class="row-code">${escHtml(p.code)}</span> · ${escHtml(p.client||'—')} · ${escHtml(p.name)}</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>`;
        }
        panel.style.display = 'none';
        trigger.classList.remove('open');
        if (onChange) onChange(curId);
      });
      const showAllBtn = list.querySelector('#ppShowAll');
      if (showAllBtn) showAllBtn.onclick = () => { showAll = true; renderList(); };
    };

    trigger.onclick = (e) => {
      e.stopPropagation();
      const isOpen = panel.style.display === 'flex';
      panel.style.display = isOpen ? 'none' : 'flex';
      trigger.classList.toggle('open', !isOpen);
      if (!isOpen) { renderList(); search.focus(); }
    };
    search.oninput = () => { term = search.value; renderList(); };
    document.addEventListener('click', (e) => {
      if (!root.contains(e.target)) { panel.style.display = 'none'; trigger.classList.remove('open'); }
    });

    root.getValue = () => curId;
    root.setEmployee = (eid) => { curEmpId = eid; showAll = false; if (panel.style.display === 'flex') renderList(); };
  };

  return { html, attach, triggerId };
}


function openAssignmentModal(prefill = {}) {
  const isEdit = !!prefill.id;
  const empId = prefill.employeeId || (state.employees[0]?.id);
  const dateStr = prefill.date || fmtDate(new Date());
  const suggestedHrs = isEdit ? prefill.hours : (state.settings.autoDistributeHours ? suggestHoursFor(empId, dateStr) : state.settings.productiveHoursPerDay);

  const a = isEdit ? { ...prefill } : {
    id: uid(),
    employeeId: empId,
    projectId: prefill.projectId || null,
    date: dateStr,
    hours: suggestedHrs,
    weight: 0,
    notes: '',
    locked: false
  };

  const empOpts = state.employees.map(e => `<option value="${e.id}" ${e.id===a.employeeId?'selected':''}>${escHtml(e.name)}</option>`).join('');
  const picker = buildProjectPicker(a.projectId, { employeeId: a.employeeId });

  // Show what's already on this day
  const showSameDayHint = () => {
    const others = state.assignments.filter(x => x.employeeId === a.employeeId && x.date === a.date && x.id !== a.id);
    if (others.length === 0) return '';
    const totalHrs = others.reduce((s,o) => s + o.hours, 0);
    return `<div class="field-help" style="background:var(--kn-blue-tint);padding:8px 10px;border-radius:6px;border-left:3px solid var(--kn-blue);color:var(--kn-blue);font-weight:500">${others.length} project${others.length>1?'s':''} already scheduled on this day · ${totalHrs.toFixed(1)}h total${state.settings.autoDistributeHours && !isEdit ? ` · auto-divided across ${others.length+1}` : ''}</div>`;
  };

  showModal(`
    <div class="modal-head">
      <div>
        <div class="modal-title">${isEdit ? 'Edit assignment' : 'New assignment'}</div>
        <div class="modal-sub">${isEdit ? 'Update or delete' : 'Schedule work for an employee'}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">${ic('x')}</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label class="field-label">Employee</label><select class="field-select" id="aEmp">${empOpts}</select></div>
        <div class="field"><label class="field-label">Date</label><input type="date" class="field-input" id="aDate" value="${a.date}"></div>
      </div>
      <div class="field"><label class="field-label">Project</label>${picker.html}</div>
      <div id="aSameDayHint">${showSameDayHint()}</div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Hours <span style="font-weight:400;color:var(--kn-text-soft)">${a.locked?'(locked)':''}</span></label>
          <input type="number" class="field-input" id="aHours" value="${a.hours}" step="0.25" min="0.25" max="24">
          <div class="field-help">${state.settings.autoDistributeHours ? 'Auto-divides when adding multiple projects to one day. Manually editing locks this value.' : 'Auto-divide is OFF in Settings.'}</div>
        </div>
        <div class="field">
          <label class="field-label">Effort weight</label>
          <div class="weight-picker" id="aWeight">
            ${[-2,-1,0,1,2].map(w => `<div class="weight-opt ${w===a.weight?'active':''}" data-w="${w}"><div class="v">${w>0?'+'+w:w}</div><span class="l">${WEIGHT_LABEL[String(w)]}</span></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="field"><label class="field-label">Notes (optional)</label><textarea class="field-textarea" id="aNotes" placeholder="What's the work?">${escHtml(a.notes||'')}</textarea></div>
    </div>
    <div class="modal-foot">
      ${isEdit ? `<button class="btn btn-danger" id="aDelete">${ic('trash')}<span>Delete</span></button>` : ''}
      <div style="flex:1"></div>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="aSave">${isEdit ? 'Save changes' : 'Add assignment'}</button>
    </div>
  `);

  // Attach project picker
  picker.attach((newProjId) => { a.projectId = newProjId; });

  // Track if user manually changed hours (then we lock the assignment)
  const hoursInput = document.getElementById('aHours');
  const initialHours = +hoursInput.value;
  let userTouchedHours = false;
  hoursInput.oninput = () => { userTouchedHours = true; };

  // weight picker
  document.querySelectorAll('#aWeight .weight-opt').forEach(opt => opt.onclick = () => {
    document.querySelectorAll('#aWeight .weight-opt').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    a.weight = +opt.dataset.w;
  });

  // Re-suggest hours when employee or date changes (only on add, not edit, only if user hasn't touched)
  const refreshSuggestion = () => {
    if (isEdit || userTouchedHours || !state.settings.autoDistributeHours) return;
    const eid = document.getElementById('aEmp').value;
    const ds = document.getElementById('aDate').value;
    hoursInput.value = suggestHoursFor(eid, ds);
    document.getElementById('aSameDayHint').innerHTML = (() => {
      const others = state.assignments.filter(x => x.employeeId === eid && x.date === ds);
      if (others.length === 0) return '';
      const totalHrs = others.reduce((s,o) => s + o.hours, 0);
      return `<div class="field-help" style="background:var(--kn-blue-tint);padding:8px 10px;border-radius:6px;border-left:3px solid var(--kn-blue);color:var(--kn-blue);font-weight:500">${others.length} project${others.length>1?'s':''} already scheduled · ${totalHrs.toFixed(1)}h total · auto-divided across ${others.length+1}</div>`;
    })();
  };
  document.getElementById('aEmp').onchange = (e) => {
    refreshSuggestion();
    // Refresh project picker to surface assigned projects for the newly selected employee
    const pickerRoot = document.getElementById(picker.triggerId);
    if (pickerRoot && pickerRoot.setEmployee) pickerRoot.setEmployee(e.target.value);
  };
  document.getElementById('aDate').onchange = refreshSuggestion;

  document.getElementById('aSave').onclick = async () => {
    const finalHours = +hoursInput.value;
    const finalProjectId = a.projectId;
    const newA = {
      id: a.id,
      employeeId: document.getElementById('aEmp').value,
      projectId: finalProjectId,
      date: document.getElementById('aDate').value,
      hours: finalHours,
      weight: +document.querySelector('#aWeight .weight-opt.active').dataset.w,
      notes: document.getElementById('aNotes').value.trim(),
      // Lock if user manually touched hours, OR if it was already locked, OR on edit
      locked: a.locked || userTouchedHours || (isEdit && finalHours !== initialHours)
    };
    if (!newA.employeeId) { toast('Pick an employee','error'); return; }
    if (!newA.projectId) { toast('Pick a project','error'); return; }
    if (!newA.date) { toast('Pick a date','error'); return; }
    if (newA.hours <= 0) { toast('Hours must be > 0','error'); return; }

    if (isEdit) {
      const old = state.assignments.find(x => x.id === a.id);
      await History.apply(actUpdateAssignment(old, newA));
    } else {
      await History.apply(actAddAssignment(newA));
      // Redistribute hours among unlocked siblings (if auto-distribute is on and user didn't manually set hours)
      if (state.settings.autoDistributeHours && !userTouchedHours) {
        await redistributeUnlocked(newA.employeeId, newA.date);
      }
    }
    closeModal();
    render();
    toast(isEdit ? 'Saved' : 'Added','success');
  };
  if (isEdit) {
    document.getElementById('aDelete').onclick = async () => {
      if (!confirm('Delete this assignment?')) return;
      const target = state.assignments.find(x=>x.id===a.id);
      await History.apply(actDeleteAssignment(target));
      // Redistribute remaining unlocked
      if (state.settings.autoDistributeHours) {
        await redistributeUnlocked(target.employeeId, target.date);
      }
      closeModal();
      render();
    };
  }
}

function openLeaveModal(prefill = {}) {
  const empOpts = state.employees.map(e => `<option value="${e.id}" ${e.id===prefill.employeeId?'selected':''}>${escHtml(e.name)}</option>`).join('');
  const today = prefill.date || fmtDate(new Date());

  showModal(`
    <div class="modal-head">
      <div>
        <div class="modal-title">Mark leave / remote</div>
        <div class="modal-sub">Annual, sick, remote, or other</div>
      </div>
      <button class="modal-close" onclick="closeModal()">${ic('x')}</button>
    </div>
    <div class="modal-body">
      <div class="field"><label class="field-label">Employee</label><select class="field-select" id="lEmp">${empOpts}</select></div>
      <div class="field-row">
        <div class="field"><label class="field-label">From</label><input type="date" class="field-input" id="lFrom" value="${today}"></div>
        <div class="field"><label class="field-label">To</label><input type="date" class="field-input" id="lTo" value="${today}"></div>
      </div>
      <div class="field">
        <label class="field-label">Type</label>
        <select class="field-select" id="lType">
          <option>Annual Leave</option>
          <option>Sick Leave</option>
          <option>Remote Work</option>
          <option>Public Holiday Off</option>
          <option>Unpaid Leave</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field"><label class="field-label">Notes (optional)</label><textarea class="field-textarea" id="lNotes"></textarea></div>
      <div class="field-help" style="background:var(--kn-warm-soft);padding:10px;border-radius:6px;border-left:3px solid var(--kn-blue)">Existing assignments on these days will be removed. Leave days deduct from the employee's monthly capacity.</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="lSave">Mark leave</button>
    </div>
  `);

  document.getElementById('lSave').onclick = async () => {
    const empId = document.getElementById('lEmp').value;
    const from = document.getElementById('lFrom').value;
    const to = document.getElementById('lTo').value;
    const type = document.getElementById('lType').value;
    const notes = document.getElementById('lNotes').value.trim();
    if (!empId || !from || !to) { toast('Fill required fields','error'); return; }
    if (from > to) { toast('From date must be before To','error'); return; }

    // Build list of dates (skip weekends and holidays)
    const days = [];
    const start = parseDate(from), end = parseDate(to);
    for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
      if (isWeekend(d) || isHoliday(d)) continue;
      const ds = fmtDate(d);
      if (state.leaves.find(l => l.employeeId === empId && l.date === ds)) continue;
      days.push(ds);
    }
    if (days.length === 0) { toast('No workdays in range','error'); return; }

    // Remove conflicting assignments — but keep them if marking Remote Work (it's a workday flag)
    if (type !== 'Remote Work') {
      for (const ds of days) {
        const conflicts = state.assignments.filter(a => a.employeeId === empId && a.date === ds);
        for (const c of conflicts) await History.apply(actDeleteAssignment(c));
      }
    }
    // Add leaves as a bulk action so undo reverses them all together
    const items = days.map(ds => ({ id: uid(), employeeId: empId, date: ds, type, notes }));
    await History.apply(actBulkAddLeaves(items));

    closeModal();
    render();
    toast(`${days.length} day${days.length>1?'s':''} marked as ${type}`,'success');
  };
}

      <button class="btn btn-primary" id="pSave">${isEdit ? 'Save' : 'Create'}</button>
    </div>
  `);

  document.querySelectorAll('[data-pt]').forEach(t => t.onclick = () => {
    document.querySelectorAll('[data-pt]').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    proj.type = t.dataset.pt;
    if (!isEdit) document.getElementById('pCode').value = nextProjectCode(proj.type);
  });
  document.querySelectorAll('#pColor .color-opt').forEach(c => c.onclick = () => {
    document.querySelectorAll('#pColor .color-opt').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    proj.color = c.dataset.c;
  });

  // Assignee toggle (visual)
  document.querySelectorAll('[data-passgn]').forEach(cb => cb.onchange = () => {
    const lbl = cb.closest('label');
    const e = state.employees.find(em => em.id === cb.dataset.passgn);
    if (cb.checked) { lbl.style.background = e.color; lbl.style.color = 'white'; lbl.style.borderColor = e.color; }
    else { lbl.style.background = 'transparent'; lbl.style.color = 'var(--kn-text)'; lbl.style.borderColor = 'var(--kn-border)'; }
  });
  // Allow clicking the label too
  document.querySelectorAll('#pAssignedWrap label').forEach(lbl => lbl.onclick = (e) => {
    if (e.target.tagName === 'INPUT') return;
    const cb = lbl.querySelector('input');
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  });

  document.getElementById('pSave').onclick = async () => {
    proj.code = document.getElementById('pCode').value.trim();
    proj.name = document.getElementById('pName').value.trim();
    proj.client = document.getElementById('pClient').value.trim();
    proj.status = document.getElementById('pStatus').value;
    proj.parentId = document.getElementById('pParent').value || null;
    proj.startDate = document.getElementById('pStart').value || null;
    proj.dueDate = document.getElementById('pDue').value || null;
    proj.phase = document.getElementById('pPhase').value;
    proj.trackStatus = document.getElementById('pTrackStatus').value;
    proj.priority = document.getElementById('pPriority').value;
    proj.progress = Math.max(0, Math.min(100, +document.getElementById('pProgress').value || 0));
    proj.assignedTo = Array.from(document.querySelectorAll('[data-passgn]:checked')).map(cb => cb.dataset.passgn);
    proj.ongoingActivities = document.getElementById('pActivities').value.trim();
    proj.milestone = document.getElementById('pMilestone').value.trim();
    if (!proj.code || !proj.name) { toast('Code and name are required','error'); return; }
    const dup = state.projects.find(x => x.code === proj.code && x.id !== proj.id);
    if (dup) { toast('That code is already used','error'); return; }
    if (isEdit) {
      const i = state.projects.findIndex(x => x.id === proj.id);
      state.projects[i] = proj;
    } else {
      state.projects.push(proj);
    }
    await DB.put('projects', proj);
    markSaved();
    closeModal();
    render();
    toast(isEdit ? 'Saved' : 'Project created','success');
  };
  if (isEdit) {
    document.getElementById('pDelete').onclick = async () => {
      const usage = state.assignments.filter(a => a.projectId === proj.id).length;
      const children = getChildProjects(proj.id);
      let msg = '';
      if (children.length > 0 && usage > 0) {
        msg = `This is an umbrella project with ${children.length} sub-project(s) and ${usage} time assignment(s).\n\nDelete the umbrella + all its sub-projects + their assignments?\n\n(Or click Cancel and use "Lifecycle: Cancelled" instead to keep the history.)`;
      } else if (children.length > 0) {
        msg = `This is an umbrella project with ${children.length} sub-project(s).\n\nDelete the umbrella + all its sub-projects?`;
      } else if (usage > 0) {
        msg = `This project has ${usage} assignments. Delete project AND its assignments?`;
      } else {
        msg = 'Delete this project?';
      }
      if (!confirm(msg)) return;

      // Cascade delete children + their assignments
      for (const child of children) {
        const childAssigns = state.assignments.filter(a => a.projectId === child.id);
        state.assignments = state.assignments.filter(a => a.projectId !== child.id);
        for (const a of childAssigns) await DB.del('assignments', a.id);
        state.projects = state.projects.filter(x => x.id !== child.id);
        await DB.del('projects', child.id);
      }

      // Delete this project's assignments
      const linked = state.assignments.filter(a => a.projectId === proj.id);
      state.assignments = state.assignments.filter(a => a.projectId !== proj.id);
      for (const a of linked) await DB.del('assignments', a.id);
      state.projects = state.projects.filter(x => x.id !== proj.id);
      await DB.del('projects', proj.id);
      markSaved();
      closeModal();
      const summary = children.length > 0
        ? `Deleted umbrella + ${children.length} sub-project(s)`
        : 'Project deleted';
      toast(summary, 'success');
      render();
    };
  }
}

function nextProjectCode(type) {
  const prefix = type === 'project' ? 'KN' : type === 'proposal' ? 'PR' : 'KN-IN';
  const used = state.projects.filter(p => p.code.startsWith(prefix)).map(p => parseInt(p.code.replace(prefix,'').replace('-','')) || 0);
  const next = used.length > 0 ? Math.max(...used) + 1 : 1;
  return `${prefix}${String(next).padStart(2,'0')}`;
}
